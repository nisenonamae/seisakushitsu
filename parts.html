<style>

button:hover{background:var(--row2)}button:disabled{opacity:.4}button.main{background:var(--sea);border-color:var(--sea);color:#fff;font-weight:700}
header{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#24282e;border-bottom:1px solid #000}
header a{color:var(--sea);font-size:12px;text-decoration:none}header b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400;color:var(--sub);font-size:12px}.nav{display:flex;align-items:center;gap:6px;margin-bottom:8px}.nav b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#pname{width:100%;margin-top:6px;background:var(--row);border:1px solid var(--line);border-radius:6px;padding:4px 7px;-webkit-user-select:text;user-select:text}

 #tools{grid-template-columns:repeat(5,1fr)}#tools button{grid-template-columns:1fr;justify-items:center;text-align:center;gap:2px;padding:6px 1px;font-size:12px;min-height:46px}#tools small{display:none}#tools button.on{box-shadow:inset 0 -3px 0 var(--sea)}}

<main>
<div id="stageW"><canvas id="cv"></canvas><div id="hint"></div></div>
<div id="side">
 <div class="nav"><button id="prev">◀</button><b id="ttl"></b><button id="next">▶</button></div>
 <h4 class="pc">どう直すか</h4><div id="tools"></div>
 <div id="ctx"></div>

 <div id="pasteBox"><div class="tip" style="color:var(--sub);font-size:12px">写せなかったので、下を全部選んでコピーしてください</div><textarea id="pasteT" readonly></textarea></div>
</div></main>
<script>
/* 部品で直す（作り手・2026-11-26）：素材は「部品」の集まり（tools/kahitsu/gen_parts.py の素材パック v3）。
 先に「どれを」（部品を押して選ぶ）、それから「どう」（動かす・形・描き直す・塗る）。直しはその場で絵に反映され、直した部品そのものと、やった直しの記録（log）が Claude への返事になる。
 つなぎ目（joint:true の部品の、最初と最後の点）は、形・描き直すでは動かない＝親とのつながりが保たれる。動かす（位置・向き・大きさ）は子の部品もいっしょに動く。 */
const $=id=>document.getElementById(id),clone=o=>JSON.parse(JSON.stringify(o));
const TOOLS=[['move','✥','動かす','部品をつまんで動かす。◯で回す、□で大きさ'],['shape','◇','形','点をつまんで輪郭を変える。線の上を押すと点が増える'],['redraw','✎','描き直す','形をひと筆で囲むと、選んだ部品がその形に入れ替わる。何も選ばずに描くと新しい部品'],['paint','🖌','塗る','選んだ部品の中だけに塗れる（はみ出さない）'],['sketch','〰','下描き','全体を作り直したい時・メモ。自由に描ける']];
const VERD=[['ok','合格'],['fix','直す'],['redo','作り直す']],VC={ok:'#5cc28a',fix:'#e0a23a',redo:'#ef7b65','':'transparent'};
let keepJ=false;let PACK=/*PACK*/null,TRY=false,items=[],cur=0,sel=null,tool='move',selPt=-1,showOrig=false,color='#c98a80',size=14,undoS=[];
const cv=$('cv'),g=cv.getContext('2d');let V={s:1,tx:0,ty:0},dpr=1;
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const it=()=>items[cur],part=id=>it().parts.find(p=>p.id===id);
function hint(t,ms){const h=$('hint');h.textContent=t;h.style.opacity=1;clearTimeout(hint.t);hint.t=setTimeout(()=>h.style.opacity=0,ms||2200)}
function save(){if(PACK)LS.set('parts:'+PACK.pack,JSON.stringify(items.map(i=>({id:i.id,parts:i.parts,sketch:i.sketch,log:i.log,verdict:i.verdict,memo:i.memo}))))}
function load(p){PACK=p;items=p.items.map(i=>({...clone(i),orig:clone(i.parts),sketch:[],log:[],verdict:'',memo:''}));try{for(const o of JSON.parse(LS.get('parts:'+p.pack)||'[]')){const t=items.find(i=>i.id===o.id);if(t)Object.assign(t,o)}}catch(e){}
 cur=Math.max(0,items.findIndex(i=>!i.verdict));sel=null;undoS=[];fit();ui();draw()}
/* ---- 形 ---- */
function pathOf(pts,k){const n=pts.length,p=new Path2D();if(n<3)return p;const P=i=>pts[(i+n)%n];p.moveTo(P(0)[0],P(0)[1]);for(let i=0;i<n;i++){const a=P(i-1),b=P(i),c=P(i+1),d=P(i+2),t=k==null?.5:k;p.bezierCurveTo(b[0]+(c[0]-a[0])*t/3,b[1]+(c[1]-a[1])*t/3,c[0]-(d[0]-b[0])*t/3,c[1]-(d[1]-b[1])*t/3,c[0],c[1])}p.closePath();return p}
function kids(id,ps){const o=[id];for(const p of ps||it().parts)if(p.parent===id)o.push(...kids(p.id,ps));return o}
function bbox(pts){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const[x,y]of pts){a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y)}return{x0:a,y0:b,x1:c,y1:d,cx:(a+c)/2,cy:(b+d)/2}}
function pivot(p){if(p.joint){const a=p.pts[0],b=p.pts[p.pts.length-1];return[(a[0]+b[0])/2,(a[1]+b[1])/2]}const b=bbox(p.pts);return[b.cx,b.cy]}
function xform(id,f){for(const k of kids(id)){const p=part(k);p.pts=p.pts.map(q=>f(q));for(const s of p.strokes||[])s.pts=s.pts.map(q=>f(q))}}
function drawItem(c,itm,parts,opt){c.fillStyle=itm.bg||'#e9e6dc';c.fillRect(0,0,itm.w,itm.h);for(const p of[...parts].sort((a,b)=>a.z-b.z)){const pa=pathOf(p.pts);c.fillStyle=p.color;c.fill(pa);if(p.strokes&&p.strokes.length){c.save();c.clip(pa);for(const s of p.strokes)stroke(c,s);c.restore()}}
 if(opt&&opt.sketch)for(const s of itm.sketch||[])stroke(c,s)}
function stroke(c,s){c.lineCap=c.lineJoin='round';c.lineWidth=s.size;c.strokeStyle=c.fillStyle=s.color;c.beginPath();if(s.pts.length<2){c.arc(s.pts[0][0],s.pts[0][1],s.size/2,0,7);c.fill();return}c.moveTo(...s.pts[0]);for(const q of s.pts)c.lineTo(...q);c.stroke()}
/* ---- 画面 ---- */
function resize(){const r=cv.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);cv.width=Math.max(10,r.width*dpr);cv.height=Math.max(10,r.height*dpr)}
function fit(){resize();const i=it();if(!i)return;const r=cv.getBoundingClientRect();V.s=Math.min(r.width/i.w,r.height/i.h)*.94;V.tx=(r.width-i.w*V.s)/2;V.ty=(r.height-i.h*V.s)/2}
const toW=(x,y)=>[(x-V.tx)/V.s,(y-V.ty)/V.s],px=n=>n/V.s;
function handles(p){const b=bbox(p.pts),pv=pivot(p),m=px(26);return{b,pv,rot:[b.cx,b.y0-m],sc:[b.x1+px(10),b.y1+px(10)]}}
function draw(){const i=it();g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);if(!i)return;g.setTransform(dpr*V.s,0,0,dpr*V.s,dpr*V.tx,dpr*V.ty);
 if(showOrig){drawItem(g,i,i.orig);return}drawItem(g,i,i.parts,{sketch:1});if(live)stroke(g,live);
 const p=sel&&part(sel);if(!p)return;const pa=pathOf(p.pts);g.lineWidth=px(2);g.strokeStyle='#3d8ef0';g.setLineDash([px(6),px(4)]);g.stroke(pa);g.setLineDash([]);
 if(p.joint&&(tool==='shape'||(tool==='redraw'&&keepJ))){const a=p.pts[0],b=p.pts[p.pts.length-1];g.lineWidth=px(5);g.strokeStyle='#ffd24a';g.beginPath();g.moveTo(...a);g.lineTo(...b);g.stroke()}
 const dot=(q,r,f,sq)=>{g.fillStyle=f;g.strokeStyle='#10141a';g.lineWidth=px(1.5);g.beginPath();if(sq)g.rect(q[0]-px(r),q[1]-px(r),px(r*2),px(r*2));else g.arc(q[0],q[1],px(r),0,7);g.fill();g.stroke()};
 if(tool==='shape'||(tool==='redraw'&&keepJ))p.pts.forEach((q,k)=>{const j=p.joint&&(k===0||k===p.pts.length-1);if(tool==='shape'||j)dot(q,j?6:7,j?'#ffd24a':(k===selPt?'#ff7ad1':'#fff'),j)});
 if(tool==='move'){const h=handles(p);g.lineWidth=px(1);g.strokeStyle='rgba(255,255,255,.6)';g.strokeRect(h.b.x0,h.b.y0,h.b.x1-h.b.x0,h.b.y1-h.b.y0);g.beginPath();g.moveTo(h.b.cx,h.b.y0);g.lineTo(...h.rot);g.stroke();dot(h.rot,9,'#5cc28a');dot(h.sc,8,'#fff',1);dot(h.pv,4,'#ffd24a')}}
function thumb(c,i){c.width=160;c.height=120;const k=c.getContext('2d'),s=Math.min(160/i.w,120/i.h);k.fillStyle='#1e2126';k.fillRect(0,0,160,120);k.setTransform(s,0,0,s,(160-i.w*s)/2,(120-i.h*s)/2);drawItem(k,i,i.parts,{sketch:1})}
const LOGN={new:'新しく描いた',del:'消した',clear:'全部消した',move:'動かした',rot:'回した',scale:'大きさを変えた',shape:'形を変えた',redraw:'描き直した',paint:'塗った',color:'色を変えた',sketch:'下描き・メモ'};
function logTxt(l){const n=l.part?(part(l.part)||{}).name||l.name||l.part:'全体';const r=v=>Math.round(v);return n+'：'+LOGN[l.op]+(l.op==='move'?`（右へ${r(l.dx)}・下へ${r(l.dy)}）`:l.op==='rot'?`（${r(l.deg)}度）`:l.op==='scale'?`（${r(l.k*100)}%）`:l.n>1?`（${l.n}回）`:'')}
function ui(){const i=it();if(!i)return;$('ttl').textContent=`${cur+1} / ${items.length}　${i.name}`;$('pk').textContent=(PACK.title||'')+(i.kind?'・'+i.kind:'');{const n=$('pname'),q=sel&&part(sel);n.style.display=q?'':'none';if(q&&document.activeElement!==n)n.value=q.name}$('prev').disabled=cur<=0;$('next').disabled=cur>=items.length-1;$('undo').disabled=!undoS.length;
 $('tools').innerHTML=TOOLS.map(t=>`<button data-t="${t[0]}" class="${t[0]===tool?'on':''}" title="${t[3]}"><i>${t[1]}</i><span>${t[2]}<small>${t[3]}</small></span></button>`).join('');
 const T=TOOLS.find(t=>t[0]===tool),p=sel&&part(sel),cols=[...new Set([color,...i.parts.map(q=>q.color),'#2b2523','#f1ead6','#c98a80','#ffffff','#d04040'])].slice(0,12);
 const pal=()=>cols.map(c=>`<button class="sw ${c===color?'on':''}" data-c="${c}" style="background:${c}"></button>`).join('')+`<input type="color" id="colIn" value="${color}" style="width:30px;height:28px;padding:0;border:0;background:none;flex:none"><input type="range" id="sizeIn" min="2" max="60" value="${size}">`;
 $('ctx').innerHTML=(tool==='paint'?(p?`<button id="setCol">部品の色をこの色に</button><button id="clrPaint">塗りを消す</button>`:'')+pal():tool==='sketch'?pal()+`<button id="clrSk">下描きを消す</button>`:tool==='redraw'?pal().replace(/<input type="range"[^>]*>/,'')+(p&&p.joint?`<button id="keepJ" class="${keepJ?'on':''}" title="入：親とのつなぎ目（黄色の線）は動かさず、そこから先だけ描き直す。切：どこにでも、どんな形にでも">つなぎ目を残す：${keepJ?'入':'切'}</button>`:'')+(p?`<button id="delPart">この部品を消す</button><button id="desel">選ぶのをやめる（新しい部品を描く）</button>`:'')+`<button id="clrAll">全部消して一から描く</button>`:tool==='shape'?`<button id="delPt" ${p&&selPt>=0?'':'disabled'}>選んだ点を消す</button>`:tool==='move'&&p?`<button id="zUp">手前へ</button><button id="zDn">奥へ</button>`:'')+`<span class="tip">${tool==='redraw'?(p?(p.joint&&keepJ?'黄色の線から先を、ひと筆で描く':`「${p.name}」を、描いた形に入れ替える（場所も形も自由）`):'形をひと筆で囲むと、今の色で新しい部品になる'):p||tool==='sketch'?T[3]:'まず、直したい部品を押して選ぶ'}</span>`;
 $('chips').innerHTML=[...i.parts].sort((a,b)=>b.z-a.z).map(q=>`<button data-p="${q.id}" class="${q.id===sel?'on':''}"><i style="background:${q.color}"></i>${q.name}</button>`).join('');
 $('verd').innerHTML=VERD.map(v=>`<button data-v="${v[0]}" class="${v[0]} ${i.verdict===v[0]?'on':''}">${v[1]}</button>`).join('');if(document.activeElement!==$('memo'))$('memo').value=i.memo||'';
 $('items').innerHTML=items.map((q,k)=>`<button data-i="${k}" class="${k===cur?'cur':''}" title="${q.name}"><canvas></canvas><em style="background:${VC[q.verdict||'']}"></em></button>`).join('');$('items').querySelectorAll('canvas').forEach((c,k)=>thumb(c,items[k]));
 $('log').innerHTML=i.log.length?i.log.map(logTxt).join('<br>'):'まだ何も直していません';$('file').style.display=TRY?'none':'';$('open').style.display=TRY?'none':'';$('back').style.display=TRY?'none':''}
/* ---- 直しの記録・戻す ---- */
function begin(){const i=it();undoS.push(JSON.stringify({parts:i.parts,sketch:i.sketch,log:i.log,verdict:i.verdict}));if(undoS.length>60)undoS.shift()}
function logOp(o){const i=it(),L=i.log,l=L[L.length-1];if(l&&l.op===o.op&&l.part===o.part){if(o.op==='move'){l.dx+=o.dx;l.dy+=o.dy}else if(o.op==='rot')l.deg+=o.deg;else if(o.op==='scale')l.k*=o.k;else l.n=(l.n||1)+1}else L.push(o);if(!i.verdict||i.verdict==='ok')i.verdict=o.op==='sketch'&&!L.some(x=>x.op!=='sketch')?'redo':'fix'}
function done(){save();ui();draw()}
function undo(){const s=undoS.pop();if(!s)return;Object.assign(it(),JSON.parse(s));if(sel&&!part(sel))sel=null;selPt=-1;done()}
/* ---- 指・マウス ---- */
const hitPart=(x,y)=>{const ps=[...it().parts].sort((a,b)=>b.z-a.z);g.save();g.setTransform(1,0,0,1,0,0);let r=null;for(const p of ps){if(g.isPointInPath(pathOf(p.pts),x,y)){r=p;break}}g.restore();if(!r){let bd=px(14);for(const p of ps){const b=bbox(p.pts);const d=Math.max(b.x0-x,x-b.x1,b.y0-y,y-b.y1,0);if(d<bd){bd=d;r=p}}}return r};
const D2=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function segNear(p,q){let best=null;const n=p.pts.length;for(let k=0;k<n;k++){if(p.joint&&k===n-1)continue;const a=p.pts[k],b=p.pts[(k+1)%n],t=Math.max(0,Math.min(1,((q[0]-a[0])*(b[0]-a[0])+(q[1]-a[1])*(b[1]-a[1]))/(D2(a,b)**2||1))),d=D2(q,[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);if(!best||d<best.d)best={d,k}}return best}
function resample(pts,n,closed){const P=closed?[...pts,pts[0]]:pts;let L=0;const seg=[];for(let i=1;i<P.length;i++){const d=D2(P[i],P[i-1]);seg.push(d);L+=d}const out=[],m=closed?n:n-1;for(let j=0;j<n;j++){let t=L*j/m,i=0;while(i<seg.length-1&&t>seg[i]){t-=seg[i];i++}const u=seg[i]?Math.min(1,t/seg[i]):0;out.push([P[i][0]+(P[i+1][0]-P[i][0])*u,P[i][1]+(P[i+1][1]-P[i][1])*u])}return out}
const ptrs=new Map();let op=null,live=null,pinch=null;
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);const s=pos(e);ptrs.set(e.pointerId,s);
 if(ptrs.size===2){if(op&&op.snap){Object.assign(it(),JSON.parse(op.snap));undoS.pop()}op=null;live=null;const[a,b]=[...ptrs.values()];pinch={d:D2(a,b),m:[(a[0]+b[0])/2,(a[1]+b[1])/2],V:{...V}};draw();return}
 if(ptrs.size>2)return;const w=toW(...s),p=sel&&part(sel);op={s,w,last:w,moved:false,kind:'tap'};
 if(tool==='sketch'){op.kind='sketch';live={color,size,pts:[w]};return}
 if(tool==='move'&&p){const h=handles(p);if(D2(w,h.rot)<px(22))op.kind='rot';else if(D2(w,h.sc)<px(22))op.kind='scale';if(op.kind!=='tap'){op.pv=h.pv;op.a0=Math.atan2(w[1]-h.pv[1],w[0]-h.pv[0]);op.d0=D2(w,h.pv)||1;op.acc=op.kind==='rot'?0:1;return}}
 if(tool==='shape'&&p){let bk=-1,bd=px(22);p.pts.forEach((q,k)=>{const d=D2(q,w);if(d<bd){bd=d;bk=k}});if(bk>=0){if(p.joint&&(bk===0||bk===p.pts.length-1)){hint('ここは親とのつなぎ目なので動きません。位置を変えるなら「動かす」');op.kind='none';return}selPt=bk;op.kind='pt';op.k=bk;ui();draw();return}
  const sn=segNear(p,w);if(sn&&sn.d<px(14)){begin();op.snap=undoS[undoS.length-1];p.pts.splice(sn.k+1,0,[w[0],w[1]]);selPt=sn.k+1;op.kind='pt';op.k=selPt;op.began=true;draw();return}}
 const h=hitPart(...w);op.hit=h?h.id:null;if(tool==='move'&&h){if(sel!==h.id){sel=h.id;selPt=-1;ui()}op.kind='move';draw();return}
 if((tool==='paint'&&p)||tool==='redraw'){op.kind=tool;live={color:tool==='paint'?color:'#ffd24a',size:tool==='paint'?size:px(3),pts:[w]};return}
 op.kind=h?'tap':'pan';op.V={...V}};
cv.onpointermove=e=>{if(!ptrs.has(e.pointerId))return;const s=pos(e);ptrs.set(e.pointerId,s);
 if(pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()],d=D2(a,b),m=[(a[0]+b[0])/2,(a[1]+b[1])/2],k=Math.max(.2,Math.min(12,pinch.V.s*d/pinch.d))/pinch.V.s;V.s=pinch.V.s*k;V.tx=m[0]-(pinch.m[0]-pinch.V.tx)*k;V.ty=m[1]-(pinch.m[1]-pinch.V.ty)*k;draw();return}
 if(!op)return;const w=toW(...s);if(!op.moved&&D2(s,op.s)<5)return;const first=!op.moved;op.moved=true;const p=sel&&part(sel);
 if(op.kind==='pan'){V.tx=op.V.tx+s[0]-op.s[0];V.ty=op.V.ty+s[1]-op.s[1]}
 else if(op.kind==='tap'&&tool==='paint'&&!p){op.kind='none';hint('まず、直したい部品を押して選ぶ')}
 else if(op.kind==='tap'){op.kind='pan';op.V={...V};op.s=s}
 else if(op.kind==='sketch'||op.kind==='paint'||op.kind==='redraw')live.pts.push(w);
 else if(p){if(first&&!op.began){begin();op.snap=undoS[undoS.length-1]}
  if(op.kind==='move'){const dx=w[0]-op.last[0],dy=w[1]-op.last[1];xform(sel,q=>[q[0]+dx,q[1]+dy]);op.dx=(op.dx||0)+dx;op.dy=(op.dy||0)+dy}
  else if(op.kind==='rot'){const a=Math.atan2(w[1]-op.pv[1],w[0]-op.pv[0]),da=a-op.a0,c=Math.cos(da),sn=Math.sin(da),v=op.pv;op.a0=a;op.acc+=da;xform(sel,q=>[v[0]+(q[0]-v[0])*c-(q[1]-v[1])*sn,v[1]+(q[0]-v[0])*sn+(q[1]-v[1])*c])}
  else if(op.kind==='scale'){const d=D2(w,op.pv)||1,k=Math.max(.2,Math.min(5,d/op.d0)),v=op.pv;op.d0=d;op.acc*=k;xform(sel,q=>[v[0]+(q[0]-v[0])*k,v[1]+(q[1]-v[1])*k])}
  else if(op.kind==='pt'){p.pts[op.k]=[w[0],w[1]]}}
 op.last=w;draw()};
cv.onpointerup=cv.onpointercancel=e=>{ptrs.delete(e.pointerId);if(pinch){if(ptrs.size<2)pinch=null;return}const o=op;op=null;if(!o)return;const p=sel&&part(sel);
 if(!o.moved){live=null;if(o.kind==='pt'){if(o.began){logOp({op:'shape',part:sel});done()}return}if(o.kind==='none')return;const h=hitPart(...o.w);if(h){sel=sel===h.id&&tool!=='move'?sel:h.id;selPt=-1}else if(tool!=='sketch'){sel=null;selPt=-1}ui();draw();return}
 if(o.kind==='pan'||o.kind==='none'){draw();return}
 if(o.kind==='move')logOp({op:'move',part:sel,dx:o.dx||0,dy:o.dy||0});else if(o.kind==='rot')logOp({op:'rot',part:sel,deg:o.acc*180/Math.PI});else if(o.kind==='scale')logOp({op:'scale',part:sel,k:o.acc});else if(o.kind==='pt')logOp({op:'shape',part:sel});
 else if(o.kind==='sketch'){begin();it().sketch.push(live);logOp({op:'sketch'})}
 else if(o.kind==='paint'){begin();p.strokes=p.strokes||[];p.strokes.push(live);logOp({op:'paint',part:sel})}
 else if(o.kind==='redraw'){const S=live.pts;let len=0;for(let k=1;k<S.length;k++)len+=D2(S[k],S[k-1]);if(len<px(30)){live=null;hint('もう少し長く描いてください');draw();return}begin();
  if(p&&p.joint&&keepJ){const A=p.pts[0],B=p.pts[p.pts.length-1];let R=resample(S,14,false);if(D2(R[0],A)+D2(R[13],B)>D2(R[0],B)+D2(R[13],A))R.reverse();p.pts=[A,...R,B];logOp({op:'redraw',part:sel})}
  else if(p){p.pts=resample(S,26,true);p.joint=false;logOp({op:'redraw',part:sel})}
  else{const i=it(),n=i.parts.filter(q=>q.isNew).length+1,q={id:'n'+Date.now().toString(36),name:'新しい部品 '+n,z:Math.max(0,...i.parts.map(q=>q.z))+1,color,pts:resample(S,26,true),joint:false,parent:null,strokes:[],isNew:true};i.parts.push(q);sel=q.id;logOp({op:'new',part:q.id,name:q.name})}}
 live=null;done()};
cv.addEventListener('wheel',e=>{e.preventDefault();const s=pos(e),k=Math.exp(-e.deltaY*.0015),ns=Math.max(.2,Math.min(12,V.s*k)),r=ns/V.s;V.tx=s[0]-(s[0]-V.tx)*r;V.ty=s[1]-(s[1]-V.ty)*r;V.s=ns;draw()},{passive:false});
/* ---- ボタン ---- */
$('tools').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;tool=b.dataset.t;selPt=-1;ui();draw();const T=TOOLS.find(t=>t[0]===tool);hint(T[3],2600)};
$('ctx').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=sel&&part(sel);if(b.dataset.c){color=b.dataset.c;ui();return}
 if(b.id==='keepJ'){keepJ=!keepJ;ui();draw();return}if(b.id==='desel'){sel=null;ui();draw();return}
 if(b.id==='delPart'&&p){begin();const i=it();for(const q of i.parts)if(q.parent===p.id)q.parent=p.parent;i.parts=i.parts.filter(q=>q!==p);it().log.push({op:'del',part:p.id,name:p.name});if(!i.verdict||i.verdict==='ok')i.verdict='fix';sel=null;done();return}
 if(b.id==='clrAll'){if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='本当に全部消す（戻すで戻せる）';return}begin();const i=it();i.parts=[];i.log.push({op:'clear'});i.verdict='redo';sel=null;done();return}
 if(b.id==='setCol'&&p){begin();p.color=color;logOp({op:'color',part:sel});done()}else if(b.id==='clrPaint'&&p){begin();p.strokes=[];done()}else if(b.id==='clrSk'){begin();it().sketch=[];done()}
 else if(b.id==='delPt'&&p&&selPt>=0){const n=p.pts.length;if(n<=4)return hint('点はこれ以上減らせません');if(p.joint&&(selPt===0||selPt===n-1))return;begin();p.pts.splice(selPt,1);selPt=-1;logOp({op:'shape',part:sel});done()}
 else if((b.id==='zUp'||b.id==='zDn')&&p){begin();const ps=[...it().parts].sort((a,b)=>a.z-b.z),k=ps.indexOf(p),o=ps[k+(b.id==='zUp'?1:-1)];if(o){const oo=ps[k+(b.id==='zUp'?2:-2)];p.z=oo?(o.z+oo.z)/2:o.z+(b.id==='zUp'?1:-1)}logOp({op:'move',part:sel,dx:0,dy:0});done()}};
$('ctx').oninput=e=>{if(e.target.id==='colIn'){color=e.target.value}else if(e.target.id==='sizeIn')size=+e.target.value};$('ctx').onchange=e=>{if(e.target.id==='colIn')ui()};
$('chips').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;sel=sel===b.dataset.p?null:b.dataset.p;selPt=-1;ui();draw()};
$('verd').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;const i=it();i.verdict=i.verdict===b.dataset.v?'':b.dataset.v;save();ui()};
$('memo').oninput=e=>{it().memo=e.target.value;save()};$('pname').oninput=e=>{const q=sel&&part(sel);if(q){q.name=e.target.value;save();const c=document.querySelector(`#chips [data-p="${sel}"]`);if(c&&c.lastChild)c.lastChild.textContent=q.name}};
function go(k){if(k<0||k>=items.length||k===cur)return;cur=k;sel=null;selPt=-1;undoS=[];fit();ui();draw()}
$('items').onclick=e=>{const b=e.target.closest('[data-i]');if(b)go(+b.dataset.i)};$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);$('undo').onclick=undo;
{const o=$('orig'),on=v=>e=>{e.preventDefault();showOrig=v;draw()};o.onpointerdown=on(true);o.onpointerup=o.onpointerleave=o.onpointercancel=on(false)}
function output(){return JSON.stringify({kahitsu:3,pack:PACK.pack,title:PACK.title,exported:new Date().toISOString(),items:items.map(i=>({id:i.id,name:i.name,verdict:i.verdict,memo:i.memo,log:i.log.map(l=>({...l,text:logTxtOf(i,l)})),parts:i.parts.map(p=>({...p,pts:p.pts.map(q=>q.map(v=>Math.round(v*10)/10)),strokes:(p.strokes||[]).map(s=>({...s,pts:s.pts.map(q=>q.map(Math.round))}))})),sketch:(i.sketch||[]).map(s=>({...s,pts:s.pts.map(q=>q.map(Math.round))}))}))})}
function logTxtOf(i,l){const c=cur;cur=items.indexOf(i);const t=logTxt(l);cur=c;return t}
$('copy').onclick=async()=>{const t=output();try{await navigator.clipboard.writeText(t);hint('直しを写しました。チャットに貼り付けて Claude に渡してください',3500)}catch(e){$('pasteBox').style.display='block';$('pasteT').value=t;$('pasteT').focus();$('pasteT').select();hint('写せませんでした。下の欄からコピーしてください',3500)}};
$('file').onclick=()=>{const d=new Date(),p2=n=>String(n).padStart(2,'0'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([output()],{type:'application/json'}));a.download=`naoshi_${PACK.pack}_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}_${p2(d.getHours())}${p2(d.getMinutes())}.json`;a.click();hint('書き出しました。このファイルを Claude に渡してください',3000)};
$('open').onclick=()=>$('fin').click();$('fin').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const p=JSON.parse(await f.text());if(!p.items||!p.items[0].parts)throw 0;LS.set('parts:last',JSON.stringify(p));load(p)}catch(x){hint('部品の素材パックではないファイルです',3000)}};
addEventListener('keydown',e=>{if(/TEXTAREA|INPUT/.test(e.target.tagName))return;if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}else if(e.key>='1'&&e.key<='5'){tool=TOOLS[+e.key-1][0];selPt=-1;ui();draw()}});
new ResizeObserver(()=>{const c=[cv.width,cv.height];resize();if(c[0]!==cv.width||c[1]!==cv.height){if(it())fit();draw()}}).observe(cv);
if(!PACK){try{PACK=JSON.parse(LS.get('parts:last'))}catch(e){}}
if(PACK)load(PACK);else{resize();$('ttl').textContent='素材パックを開いてください';$('tools').innerHTML='';hint('右（下）の「素材パックを開く」から始めます',5000)}
</script></body></html>
