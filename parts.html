</div></main>
<script>
/* 部品で直す（作り手・2026-11-26）：素材は「部品」の集まり（tools/kahitsu/gen_parts.py の素材パック v3）。
 先に「どれを」（部品を押して選ぶ）、それから「どう」（動かす・形・描き直す・塗る）。直しはその場で絵に反映され、直した部品そのものと、やった直しの記録（log）が Claude への返事になる。
 つなぎ目（joint:true の部品の、最初と最後の点）は、形・描き直すでは動かない＝親とのつながりが保たれる。動かす（位置・向き・大きさ）は子の部品もいっしょに動く。 */
const $=id=>document.getElementById(id),clone=o=>JSON.parse(JSON.stringify(o));
const TOOLS=[['move','✥','動かす','部品をつまんで動かす。◯で回す、□で大きさ'],['shape','◇','形','点をつまんで輪郭を変える。線の上を押すと点が増える'],['redraw','✎','描き直す','形をひと筆で囲むと、選んだ部品がその形に入れ替わる。何も選ばずに描くと新しい部品'],['paint','🖌','塗る','なぞり始めた部品の中だけに塗れる（はみ出さない）。丸ごと色を変えるなら「部品の色をこの色に」'],['sketch','〰','下描き','全体を作り直したい時・メモ。自由に描ける']];
const VERD=[['ok','合格'],['fix','直す'],['redo','作り直す']],VC={ok:'#5cc28a',fix:'#e0a23a',redo:'#ef7b65','':'transparent'};
let keepJ=false,pick=false,msel=new Set(),refSel=new Set(),lastArea='work',CLIP=null;let PACK=/*PACK*/null,TRY=false,items=[],cur=0,sel=null,tool='move',selPt=-1,showOrig=false,color='#c98a80',size=14,undoS=[];
const cv=$('cv'),g=cv.getContext('2d');let V={s:1,tx:0,ty:0},dpr=1;
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const it=()=>items[cur],part=id=>it().parts.find(p=>p.id===id);
function hint(t,ms){const h=$('hint');h.textContent=t;h.style.opacity=1;clearTimeout(hint.t);hint.t=setTimeout(()=>h.style.opacity=0,ms||2200)}
function save(){if(PACK){LS.set('parts:at:'+PACK.pack,String(Date.now()));cloudSoon()}if(PACK)LS.set('parts:'+PACK.pack,JSON.stringify(items.map(i=>({id:i.id,parts:i.parts,sketch:i.sketch,log:i.log,verdict:i.verdict,memo:i.memo,split:!!i.split}))))}
function load(p){PACK=p;items=p.items.map(i=>({...clone(i),orig:clone(i.parts),sketch:[],log:[],verdict:'',memo:''}));try{for(const o of JSON.parse(LS.get('parts:'+p.pack)||'[]')){const t=items.find(i=>i.id===o.id);if(t)Object.assign(t,o)}}catch(e){}refSel=new Set();msel=new Set();trEdit=false;for(const i of items)loadTrace(i);
 cur=Math.max(0,items.findIndex(i=>!i.verdict));sel=null;undoS=[];$('stageW').classList.toggle('split',!!(items[cur]&&items[cur].split));fit();ui();draw();cloudLoad()}
/* ---- 形 ---- */
/* 角（作り手の引き継ぎ 5・2026-11-26）：点の3つめが 1 の点は角（なめらかにしない）＝[x,y,1]。きば・葉の先・しぶきの粒の先が丸くならない */
function pathOf(pts,k){const n=pts.length,p=new Path2D();if(n<3)return p;const P=i=>pts[(i+n)%n];p.moveTo(P(0)[0],P(0)[1]);for(let i=0;i<n;i++){const a=P(i-1),b=P(i),c=P(i+1),d=P(i+2),t=k==null?.5:k,tb=b[2]?0:t,tc=c[2]?0:t;p.bezierCurveTo(b[0]+(c[0]-a[0])*tb/3,b[1]+(c[1]-a[1])*tb/3,c[0]-(d[0]-b[0])*tc/3,c[1]-(d[1]-b[1])*tc/3,c[0],c[1])}p.closePath();return p}
const keepC=(q,r)=>{if(q[2])r[2]=1;return r};
/* フォルダ（作り手・2026-11-26「描くみたいにレイヤー分けして、フォルダみたいにまとめる」）：フォルダ＝形のない部品 {folder:true,pts:[]}。中身は parent でつながる（今までの「頭（全体）」の親子と同じ）。動かすと中身が全部ついてくる。hide＝見せない（フォルダなら中身も） */
const hiddenIn=(p,ps)=>{let q=p,n=0;while(q&&n++<50){if(q.hide)return true;q=q.parent&&ps.find(x=>x.id===q.parent)}return false};
function bboxOf(p){if(!p.folder)return bbox(p.pts);const P=kids(p.id).map(part).filter(q=>q&&!q.folder).flatMap(q=>q.pts);return P.length?bbox(P):{x0:0,y0:0,x1:1,y1:1,cx:0,cy:0}}
function kids(id,ps){const o=[id];for(const p of ps||it().parts)if(p.parent===id)o.push(...kids(p.id,ps));return o}
function bbox(pts){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const[x,y]of pts){a=Math.min(a,x);b=Math.min(b,y);c=Math.max(c,x);d=Math.max(d,y)}return{x0:a,y0:b,x1:c,y1:d,cx:(a+c)/2,cy:(b+d)/2}}
function pivot(p){if(p.folder){const b=bboxOf(p);return[b.cx,b.cy]}if(p.joint){const a=p.pts[0],b=p.pts[p.pts.length-1];return[(a[0]+b[0])/2,(a[1]+b[1])/2]}const b=bbox(p.pts);return[b.cx,b.cy]}
function xformS(f){for(const id of new Set([...msel,...(sel?[sel]:[])].filter(x=>part(x)).flatMap(x=>kids(x)))){const p=part(id);p.pts=p.pts.map(q=>keepC(q,f(q)));for(const s of p.strokes||[])s.pts=s.pts.map(q=>f(q))}}   /* 選んでいる物を全部（複数選び・フォルダの中身も）
*/function xform(id,f){for(const k of kids(id)){const p=part(k);p.pts=p.pts.map(q=>keepC(q,f(q)));for(const s of p.strokes||[])s.pts=s.pts.map(q=>f(q))}}
function drawItem(c,itm,parts,opt){c.fillStyle=itm.bg||'#e9e6dc';c.fillRect(0,0,itm.w,itm.h);if(opt&&opt.under)opt.under(c);for(const p of[...parts].sort((a,b)=>a.z-b.z)){if(p.folder||hiddenIn(p,parts))continue;const pa=pathOf(p.pts);c.fillStyle=p.color;c.globalAlpha=p.a==null?1:p.a;c.fill(pa);c.globalAlpha=1;if(p.strokes&&p.strokes.length){c.save();c.clip(pa);for(const s of p.strokes)stroke(c,s);c.restore()}}
 if(opt&&opt.sketch)for(const s of itm.sketch||[])stroke(c,s)}
function stroke(c,s){c.lineCap=c.lineJoin='round';c.lineWidth=s.size;c.strokeStyle=c.fillStyle=s.color;c.beginPath();if(s.pts.length<2){c.arc(s.pts[0][0],s.pts[0][1],s.size/2,0,7);c.fill();return}c.moveTo(...s.pts[0]);for(const q of s.pts)c.lineTo(...q);c.stroke()}
/* ---- 画面 ---- */
function resize(){const r=cv.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);cv.width=Math.max(10,r.width*dpr);cv.height=Math.max(10,r.height*dpr)}
function fit(){resize();const i=it();if(!i)return;const r=cv.getBoundingClientRect();V.s=Math.min(r.width/i.w,r.height/i.h)*.94;V.tx=(r.width-i.w*V.s)/2;V.ty=(r.height-i.h*V.s)/2}
const toW=(x,y)=>[(x-V.tx)/V.s,(y-V.ty)/V.s],px=n=>n/V.s;
function handles(p){const b=bboxOf(p),pv=pivot(p),m=px(26);return{b,pv,rot:[b.cx,b.y0-m],sc:[b.x1+px(10),b.y1+px(10)]}}
function draw(){drawRef();const i=it();g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);if(!i)return;g.setTransform(dpr*V.s,0,0,dpr*V.s,dpr*V.tx,dpr*V.ty);
 if(showOrig){drawItem(g,i,i.orig);return}const tr=i.trace;drawItem(g,i,i.parts,{sketch:1,under:tr&&!tr.top?c=>drawTrace(c,i):null});if(tr&&tr.top)drawTrace(g,i);if(live)stroke(g,live);
 if(tr&&trEdit&&!tr.hide){g.lineWidth=px(1.5);g.strokeStyle='#ffd24a';g.setLineDash([px(6),px(4)]);g.strokeRect(tr.x,tr.y,tr.w,tr.h);g.setLineDash([]);g.fillStyle='#fff';g.strokeStyle='#10141a';g.beginPath();g.rect(tr.x+tr.w-px(9),tr.y+tr.h-px(9),px(18),px(18));g.fill();g.stroke();return}
 for(const id of msel){const q=part(id);if(!q||id===sel)continue;g.lineWidth=px(1.6);g.strokeStyle='#7fb0f5';g.setLineDash([px(4),px(4)]);if(q.folder){const b=bboxOf(q);g.strokeRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0)}else g.stroke(pathOf(q.pts));g.setLineDash([])}
 const p=sel&&part(sel);if(!p)return;const pa=pathOf(p.pts);g.lineWidth=px(2);g.strokeStyle='#3d8ef0';g.setLineDash([px(6),px(4)]);if(p.folder){const b=bboxOf(p);g.strokeRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0)}else g.stroke(pa);g.setLineDash([]);

/* 重なり（z）の付け替え：動かす部品（フォルダなら中身ごと）を、zLo と zHi のあいだに、今の順のまま並べる。ほかの部品の z は変えない＝絵の見た目は、動かした物以外そのまま */
function placeBlock(ids,zLo,zHi){const P=ids.map(part).filter(q=>q&&!q.folder).sort((a,b)=>a.z-b.z);P.forEach((q,k)=>q.z=zLo+(zHi-zLo)*(k+1)/(P.length+1))}
function moveTo(dragIds,tgt,pos){const i=it(),T=part(tgt);if(!T)return;const moving=new Set(dragIds.flatMap(id=>kids(id)));if(moving.has(tgt))return hint('自分の中には入れられません',1800);

 if(pos==='in'){newParent=T.id;const top=tz.length?Math.max(...tz):(others.length?others[others.length-1]:0);zLo=top;zHi=Math.min(...others.filter(z=>z>top).concat([top+2]))}

addEventListener('keydown',e=>{if(/TEXTAREA|INPUT|SELECT/.test(e.target.tagName))return;const mod=e.ctrlKey||e.metaKey,K=e.key.toLowerCase();if(mod&&K==='c'){e.preventDefault();doCopy();return}if(mod&&K==='v'){clearTimeout(pasteT);pasteT=setTimeout(()=>{pasteAt=Date.now();doPaste()},150);return}   /* 画像が入っていれば paste の方で「なぞる画像」に。paste が来ない時だけここで部品を貼る */if(mod&&K==='g'){e.preventDefault();mkFolder();return}if((e.key==='Delete'||e.key==='Backspace')&&sel){e.preventDefault();delPart();return}if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo()}else if(e.key>='1'&&e.key<='5'){tool=TOOLS[+e.key-1][0];selPt=-1;ui();draw()}});

/* 素材パックは、制作室の中の一覧（tools/kahitsu/packs/index.json）から自分で読む（作り手・2026-11-26「ダウンロードして選ぶのは面倒」）。いちばん新しい物を開き、上の欄で切りかえる。読めない時だけ、前に開いた物かファイルから */
/* ---- 制作室の同期に乗せる（作り手・2026-11-26「ファイルのダウンロードなしに、制作室だけで完結」）----
 お絵描き・制作室と同じ設定（gh_o・gh_r・gh_t・gh_p。新しいトークンは要らない）で、直しを <data.json のフォルダ>/parts/<パック>.json に自動で保存する。
 開いた時に、そこにあるほうが新しければ取り込む（別の端末の続きができる。どちらが新しいかは時刻で決め、人は何もしない）。「Claude に渡す」は data.json に頼みごと parts_fix を足すだけ */
const GS=()=>({o:LS.get('gh_o')||'',r:LS.get('gh_r')||'',t:LS.get('gh_t')||'',p:LS.get('gh_p')||'roadmap/apps/seisakushitsu/data.json'}),syncOn=()=>{const s=GS();return !!(s.o&&s.r&&s.t)&&!TRY};
const b64e=s=>{const u=new TextEncoder().encode(s);let t='';for(let i=0;i<u.length;i+=0x8000)t+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(t)},b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
const gurl=path=>{const s=GS();return`https://api.github.com/repos/${s.o}/${s.r}/contents/${path}`},gh=()=>({Authorization:'Bearer '+GS().t,Accept:'application/vnd.github+json'});
const cpath=()=>GS().p.replace(/data\.json$/,'')+'parts/'+PACK.pack+'.json';
function cloudLab(t,c){const e=$('cloud');e.textContent=t;e.style.color=c||'var(--sub)'}
async function gGet(path){const r=await fetch(gurl(path),{headers:gh(),cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw new Error('GitHub '+r.status);const j=await r.json();let txt=j.content?b64d(j.content):'';if(!txt){const r2=await fetch(`https://api.github.com/repos/${GS().o}/${GS().r}/git/blobs/${j.sha}`,{headers:{...gh(),Accept:'application/vnd.github.raw'},cache:'no-store'});txt=await r2.text()}return{data:JSON.parse(txt),sha:j.sha}}
async function gPut(path,obj,sha,msg){const r=await fetch(gurl(path),{method:'PUT',headers:gh(),body:JSON.stringify({message:msg,content:b64e(JSON.stringify(obj)),...(sha?{sha}:{})})});if(r.status===409||r.status===422)return false;if(!r.ok)throw new Error('GitHub '+r.status);return true}
let cT=null,cBusy=false,cAgain=false;

async function cloudSave(){if(!syncOn()||!PACK)return false;if(cBusy){cAgain=true;return false}cBusy=true;clearTimeout(cT);try{const o=JSON.parse(output());o.savedAt=+(LS.get('parts:at:'+PACK.pack)||Date.now());for(let k=0;k<3;k++){const g=await gGet(cpath());if(await gPut(cpath(),o,g&&g.sha,'部品の直し '+PACK.pack)){cloudLab('保存済み','var(--good)');return true}}throw new Error('混み合っています')}catch(e){cloudLab('保存できません：'+e.message,'var(--busy)');return false}finally{cBusy=false;if(cAgain){cAgain=false;cloudSoon()}}}
async function cloudLoad(){if(!syncOn()||!PACK){cloudLab(TRY?'':'この端末だけに保存');return}try{cloudLab('確かめています…');const g=await gGet(cpath()),mine=+(LS.get('parts:at:'+PACK.pack)||0);
  if(g&&(g.data.savedAt||0)>mine){for(const r of g.data.items||[]){const t=items.find(i=>i.id===r.id);if(t)Object.assign(t,{parts:r.parts,sketch:r.sketch||[],log:(r.log||[]).map(({text,...l})=>l),verdict:r.verdict||'',memo:r.memo||''})}LS.set('parts:at:'+PACK.pack,String(g.data.savedAt));LS.set('parts:'+PACK.pack,JSON.stringify(items.map(i=>({id:i.id,parts:i.parts,sketch:i.sketch,log:i.log,verdict:i.verdict,memo:i.memo}))));sel=null;undoS=[];ui();draw();hint('別の端末の続きを取り込みました',2600)}
  if(g&&(g.data.savedAt||0)<mine)cloudSoon();else cloudLab(g?'保存済み':'', 'var(--good)')}catch(e){cloudLab('同期できません：'+e.message,'var(--busy)')}}
async function sendClaude(){if(!syncOn())return false;hint('渡しています…',8000);if(!await cloudSave()&&!cBusy)return hint('保存できなかったので、渡せませんでした',3500),true;
 try{for(let k=0;k<4;k++){const g=await gGet(GS().p);if(!g)throw new Error('data.json がありません');const D=g.data;D.jobs=D.jobs||[];const now=Date.now();for(const j of D.jobs)if(!j.deleted&&j.type==='parts_fix'&&j.pack===PACK.pack&&j.status==='待ち'){j.deleted=true;j.updatedAt=now}
   D.jobs.push({id:'j'+now.toString(36)+Math.random().toString(36).slice(2,6),type:'parts_fix',status:'待ち',pack:PACK.pack,name:PACK.title||PACK.pack,path:cpath(),notes:'部品の直し。'+items.filter(i=>i.verdict).length+' / '+items.length+' を見た',createdAt:now,updatedAt:now});
   if(await gPut(GS().p,D,g.sha,'部品の直しを頼む')){hint('Claude に渡しました。直した素材は、次の素材パックとして自動で届きます',4000);return true}}throw new Error('混み合っています')}catch(e){hint('渡せませんでした：'+e.message,4000)}return true}
const PK='tools/kahitsu/packs/';

async function boot(){if(TRY){load(PACK);return}let L=null;try{const r=await fetch(PK+'index.json',{cache:'no-store'});if(r.ok)L=await r.json()}catch(e){}
 if(L&&L.length){const s=$('packSel');s.style.display='';s.innerHTML=L.map(x=>`<option value="${x.file}">${x.title}（${x.n}）</option>`).join('');const last=LS.get('parts:file'),seen=LS.get('parts:seen')||'',newest=L[L.length-1].file;
  const pick=(newest!==seen||!L.some(x=>x.file===last))?newest:last;LS.set('parts:seen',newest);s.value=pick;s.onchange=()=>openPack(s.value).catch(()=>hint('読めませんでした',2500));
  try{await openPack(pick);if(pick===newest&&newest!==seen&&seen)hint('新しい素材パックが届いています',3000);return}catch(e){}}
