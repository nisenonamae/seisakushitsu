 {const k=tw(t,2.75,.7);if(k>0&&k<1)for(let i=0;i<6;i++){const a=-1.2-i*.14,v=120+i*18;ell(HX+304+Math.cos(a)*v*k,HY-112+Math.sin(a)*v*k+260*k*k,4,4,'#e8f6fa')}}

 {const fly=tw(t,5.5,1.6);const hop=pulse(t,1.35,.3)*14+pulse(t,3.55,.3)*12;const bx=lerp(HX+40,HX+420,ease(fly)),by=lerp(HY-150+bob-hop,HY-470,ease(fly));if(fly<1)birdA(bx,by,1.1,fly>0?Math.abs(Math.sin(t*22))*1.2:(hop>2?.8:0))}

 {const k=ease(tw(t,7.6,1.6));if(k>0){blurOn(9);fill([[-60,760,.2],[-60,430+300*(1-k),.6],[240,470+300*(1-k),.9],[520,640+200*(1-k),.8],[600,760,.2]],C.sandN);fill([[1340,760,.2],[1340,560+260*(1-k),.6],[1100,640+200*(1-k),.9],[980,760,.2]],C.sandN);blurOff()}}
