<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="lib.js"></script>
<script>
/* 緑のアラビア（2026-11-22）。場面は P.mode で選ぶ（絵コンテの番号：s01＝0-1 … s19＝1-9）。段を分けて作る：いまは段1（大きな形）まで。
   段1＝空・地面・主役・手前の大きな面だけ（1場面 3〜5色）。段2 以降は、この形を作り替えずに足す */
const C={skyL:'#cfe9ee',skyD:'#f4dfb2',grass:'#8dbf7a',grassF:'#6fa58c',water:'#63acc9',waterD:'#3f86a8',mesa:'#7c9c98',mesaD:'#c79a62',sand:'#e3ad62',sandF:'#cf9150',sandN:'#b9793f',
 hip:'#5d4b66',hipL:'#8a7391',fg:'#1d3a36',fgS:'#6b4426',bone:'#f7f0e1',sea:'#3d6f8e',land:'#d9b77a',landG:'#93b981',wall:'#b88a52',wallD:'#8f6638',night:'#182233',rock:'#8a6a52',hand:'#5b3b2c',biwa:'#2f6f93'};
function fill(pts,col,dx=0,dy=0){g.fillStyle=col;g.beginPath();blob(pts,dx,dy);g.fill()}
function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}
function ell(x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill()}
// カバ（横向き・右向き）。段1は1色の影絵
function hippo(x,y,s,col=C.hip,dir=1){g.save();g.translate(x,y);g.scale(s*dir,s);
 fill([[-150,-40,.9],[-120,-95,.9],[-20,-112,.8],[70,-96,.8],[120,-70,.7],[178,-74,.8],[212,-40,.9],[204,6,.9],[150,22,.8],[110,10,.6],[100,60,.5],[62,62,.4],[56,24,.6],[-70,28,.6],[-78,62,.4],[-118,62,.4],[-124,10,.7]],col);
 ell(96,-100,13,16,col);ell(128,-98,12,15,col);g.restore()}
// カバの頭だけ（水から出ている）
function hippoHead(x,y,s,col=C.hip){g.save();g.translate(x,y);g.scale(s,s);fill([[-120,10,.8],[-110,-40,.9],[-40,-62,.8],[30,-50,.8],[70,-34,.7],[120,-40,.8],[150,-10,.9],[140,14,.6]],col);ell(-52,-62,13,17,col);ell(-8,-62,13,17,col);ell(96,-42,10,9,col);ell(126,-40,10,9,col);g.restore()}
// カバの顔（正面）
function hippoFace(x,y,s,col=C.hip,col2=C.hipL){g.save();g.translate(x,y);g.scale(s,s);
 ell(-118,-150,34,44,col);ell(118,-150,34,44,col);
 fill([[-170,-40,.9],[-150,-140,.9],[0,-176,.8],[150,-140,.9],[170,-40,.9],[190,60,.9],[150,150,.9],[0,172,.8],[-150,150,.9],[-190,60,.9]],col);
 fill([[-176,70,.9],[-120,10,.8],[0,-6,.7],[120,10,.8],[176,70,.9],[150,150,.9],[0,172,.8],[-150,150,.9]],col2);g.restore()}
function boneHippo(x,y,s,col=C.bone){g.save();g.translate(x,y);g.scale(s,s);
 fill([[110,-70,.8],[178,-74,.8],[212,-44,.9],[204,-6,.8],[150,6,.7],[118,-20,.6]],col);
 fill([[-130,-64,.5],[110,-70,.5],[112,-54,.5],[-130,-48,.5]],col);
 for(const x0 of [-100,-60,-20,20,60])fill([[x0,-56,.4],[x0+16,-56,.4],[x0+10,22,.6],[x0-2,22,.6]],col);
 fill([[-140,-60,.6],[-120,-66,.6],[-116,60,.4],[-134,60,.4]],col);fill([[86,-60,.6],[104,-62,.6],[102,60,.4],[86,60,.4]],col);g.restore()}
function reeds(side,col=C.fg,k=1){blurOn(9);const r=R(side>0?5:9);for(let i=0;i<5;i++){const x=(side>0?W-30:30)-side*i*70*r(),h=(420+r()*320)*k,w=60+r()*70,lean=(r()-.4)*120*side;fill([[x-w/2,H+20,.3],[x-w/5+lean*.4,H-h*.6,.8],[x+lean,H-h,.9],[x+w/3+lean*.4,H-h*.5,.8],[x+w/2,H+20,.3]],col)}blurOff()}
function skyG(top,bot,yh){const s=g.createLinearGradient(0,0,0,yh);s.addColorStop(0,top);s.addColorStop(1,bot);g.fillStyle=s;g.fillRect(0,0,W,yh+2)}
// ---- いつもの湖（水平・葦ごし）
function lakeBase(){skyG('#a9d8e6',C.skyL,300);fill([[-40,300,.4],[300,262,.8],[620,286,.8],[820,240,.5],[1100,240,.5],[1330,292,.4],[1330,330,.2],[-40,330,.2]],C.mesa);rect(0,300,W,60,C.grass);rect(0,340,W,H-340,C.water)}
function sandBase(){skyG('#f7e6bd',C.skyD,300);fill([[-40,300,.4],[300,262,.8],[620,286,.8],[820,240,.5],[1100,240,.5],[1330,292,.4],[1330,330,.2],[-40,330,.2]],C.mesaD);
 fill([[-40,330,.3],[260,300,.9],[620,346,.9],[980,304,.9],[1330,336,.3],[1330,760,.1],[-40,760,.1]],C.sandF);fill([[-40,470,.3],[380,420,.9],[800,470,.9],[1330,430,.3],[1330,760,.1],[-40,760,.1]],C.sand)}
const SC={
 s01(t){lakeBase();hippoHead(780,470,1.5);ell(770,372,10,8,C.fg);reeds(-1);reeds(1)},
 s02(t){sandBase();hippo(770,470,1.15);reeds(-1,C.fgS,.35);reeds(1,C.fgS,.3)},
 s03(t){sandBase();boneHippo(770,470,1.15);blurOn(9);fill([[-60,760,.2],[-60,430,.6],[240,470,.9],[520,640,.8],[600,760,.2]],C.sandN);fill([[1340,760,.2],[1340,560,.6],[1100,640,.9],[980,760,.2]],C.sandN);blurOff()},
 s11(t){rect(0,0,W,H,C.sea);fill([[620,110,.5],[1010,150,.6],[1160,440,.7],[900,650,.6],[690,400,.6]],C.land);fill([[-40,-40,.2],[560,-40,.3],[520,120,.8],[300,210,.8],[-40,260,.4]],C.landG);fill([[1330,-40,.2],[1100,-40,.3],[1130,90,.8],[1330,130,.4]],C.landG);fill([[-40,400,.4],[230,360,.8],[420,470,.8],[330,760,.4],[-40,760,.2]],C.landG);
  fill([[150,420,.5],[190,400,.6],[214,470,.6],[186,520,.6],[160,480,.5]],C.landG)},
 s12(t){skyG('#f7e6bd',C.skyD,530);rect(0,530,W,190,C.sand);rect(880,0,400,530,C.wall);rect(880,0,36,530,C.wallD);ell(980,290,34,44,C.wallD);
  hippo(690,490,.62);fill([[330,330,.5],[520,330,.5],[540,400,.6],[560,470,.5],[530,530,.3],[500,530,.3],[496,440,.5],[380,440,.5],[376,530,.3],[344,530,.3],[330,440,.5]],'#6d6a72');
  fill([[210,420,.6],[262,420,.6],[270,530,.3],[204,530,.3]],'#7a5c44');fill([[104,380,.6],[124,300,.8],[150,380,.6],[142,530,.3],[112,530,.3]],'#4a4450')},
 s13(t){rect(0,0,W,H,C.skyD);rect(0,560,W,160,C.sand);hippoFace(640,400,1.55)},
 s14(t){skyG('#a9d8e6',C.skyL,240);fill([[700,240,.3],[860,180,.5],[1130,180,.5],[1330,240,.3]],C.mesa);rect(0,238,W,H,C.grass);fill([[200,500,.9],[420,400,.9],[900,390,.9],[1120,470,.9],[980,600,.9],[420,620,.9]],C.water);
  hippoHead(640,500,.6);reeds(-1);reeds(1,C.fg,.8)},
 s15(t){rect(0,0,W,H,C.grass);fill([[280,380,.9],[440,230,.9],[840,220,.9],[1010,360,.9],[900,520,.9],[430,540,.9]],C.water);
  fill([[430,110,.7],[640,60,.7],[820,130,.7],[1000,300,.7],[900,560,.7],[760,680,.7],[520,650,.7],[400,420,.7]],C.biwa)},
 s16(t){lakeBase();fill([[250,250,.7],[430,246,.7],[450,330,.5],[420,340,.4],[280,340,.4],[240,320,.5]],'#6d5a48');fill([[520,268,.7],[600,262,.7],[606,336,.4],[524,336,.4]],'#a98862');fill([[1090,230,.7],[1112,180,.8],[1128,232,.7],[1124,336,.3],[1096,336,.3]],'#4a4450');
  hippoHead(880,470,1.35);reeds(-1);blurOn(9);fill([[560,760,.3],[600,470,.8],[650,330,.9],[690,480,.8],[720,760,.3]],C.fg);blurOff();reeds(1)},
 s17(t){rect(0,0,W,H,C.waterD);rect(0,0,W,120,'#9fd3e0');
  fill([[380,330,.9],[440,210,.9],[820,190,.9],[930,300,.9],[860,380,.8],[820,380,.5],[810,520,.4],[750,520,.4],[744,390,.6],[560,390,.6],[552,500,.4],[492,500,.4],[486,380,.6]],C.hip);
  blurOn(9);fill([[-40,760,.3],[20,300,.8],[110,200,.9],[170,420,.8],[230,760,.3]],C.fg);fill([[1060,760,.3],[1130,360,.8],[1210,250,.9],[1260,460,.8],[1330,760,.3]],C.fg);blurOff()},
 s18(t){rect(0,0,W,H,C.grass);blurOn(12);fill([[480,-40,.3],[1330,-40,.2],[1330,400,.5]],C.water);ell(1000,150,120,60,C.hip);blurOff();
  fill([[200,440,.9],[330,360,.9],[470,380,.9],[540,460,.8],[500,580,.9],[330,620,.9],[220,560,.9]],C.hand);fill([[440,400,.4],[560,372,.5],[580,420,.5],[470,450,.4]],'#3c3f47');
  blurOn(10);fill([[-40,760,.3],[-40,560,.7],[80,480,.9],[170,760,.3]],C.fg);blurOff()},
 s19(t){skyG('#f7e6bd','#e9dcc0',240);fill([[700,240,.3],[860,180,.5],[1130,180,.5],[1330,240,.3]],C.mesaD);rect(0,238,W,H,C.sandF);fill([[200,500,.9],[420,400,.9],[900,390,.9],[1120,470,.9],[980,600,.9],[420,620,.9]],C.sand);fill([[470,510,.9],[560,460,.9],[760,456,.9],[840,500,.9],[740,560,.9],[540,560,.9]],C.water);
  hippoHead(640,510,.55);reeds(-1,C.fgS,.6)},
};
window.init=function(){};
window.render=function(t){g.setTransform(1,0,0,1,0,0);g.filter='none';(SC[P.mode]||SC.s01)(t)};
</script></body></html>
