<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="lib.js"></script>
<script>
/* よくある説を同じ絵柄で（横から見た土の道）。mode：truck（重いトラックが通ると道がへこむ）／rain（雨水が土を流して筋ができる）／brake（急ブレーキで砂が前に押し寄せる）／tread（タイヤの溝の跡が、すじ模様のように残る）／sort（揺れで大きな粒と小さな粒が分かれる） */
window.DEF={mode:'truck'};
const rr=R(13);
function truckSide(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='rgba(30,20,10,.25)';g.beginPath();g.ellipse(0,46,230,14,0,0,7);g.fill();
  g.fillStyle='#4f6f9f';g.beginPath();g.roundRect(-230,-150,300,140,10);g.fill();g.fillStyle='#3d5a85';g.beginPath();g.moveTo(80,-10);g.lineTo(80,-120);g.lineTo(170,-120);g.quadraticCurveTo(200,-118,210,-80);g.lineTo(220,-10);g.closePath();g.fill();
  g.fillStyle='#bfe0f2';g.beginPath();g.moveTo(100,-110);g.lineTo(165,-110);g.quadraticCurveTo(185,-108,192,-80);g.lineTo(100,-80);g.closePath();g.fill();g.fillStyle='rgba(255,255,255,.12)';g.fillRect(-225,-140,290,10);g.fillStyle='#2f3b4a';g.fillRect(-230,-14,450,10);g.restore();
  for(const wx of [-170,-90,150])tire(x+wx*s,y+10*s,40*s,-x/40)}
window.render=function(t){const m=P.mode;sky();hills(0);
  if(m==='truck'){const x=lerp(250,W+150,t/DUR);const dent=x2=>22*Math.exp(-Math.pow((x2-x)/170,2));const top=x2=>540+dent(x2)+ (x2<x?6:0);ground(top);truckSide(x,540-70,1.5);sfxOnce('e',0,'engine',DUR)}
  if(m==='rain'){const top=x=>540+ (t>0.5? Math.min(1,(t-0.5)/1.2)*8*Math.max(0,Math.sin(x/23)) :0);ground(top);
    for(let i=0;i<160;i++){const r2=R(i+1);const x=r2()*W,ph=r2();const y=((t*1.6+ph)%1)*560;g.strokeStyle='rgba(210,230,255,.9)';g.lineWidth=3;g.beginPath();g.moveTo(x,y);g.lineTo(x-8,y+30);g.stroke()}
    g.fillStyle='rgba(60,70,90,.30)';g.fillRect(0,0,W,520);for(let x=20;x<W;x+=46){g.strokeStyle='rgba(90,140,200,.85)';g.lineWidth=6;g.beginPath();g.moveTo(x,545);g.lineTo(x+30*Math.min(1,t/1.5),560);g.stroke()}sfxOnce('r',0,'car',DUR)}
  if(m==='brake'){const u=clamp(t/(DUR*0.75));const x=lerp(200,760,1-Math.pow(1-u,2));const pile=10*u;const top=x2=>540-pile*Math.exp(-Math.pow((x2-(x+185))/40,2))-pile*Math.exp(-Math.pow((x2-(x-40))/40,2));ground(top);
    for(let k=0;k<3;k++){g.fillStyle='rgba(60,40,20,.35)';g.fillRect(200,544+k*3,x-200,2)}car(x,540-34*1.2,1.2,{heads:3,t,wheelR:41,wheelAng:0,bob:u<1?2:0});sfxOnce('b',0,'thump')}
  if(m==='tread'){const off=t*180;const top=x=>540;ground(top);
    for(let x=-(off%30);x<640-70;x+=30){g.fillStyle='rgba(95,65,35,.8)';g.fillRect(x,541,14,40)}
    const wx=640,wy=540-110;g.save();g.translate(wx,wy);g.rotate(off/110);g.fillStyle='#1b1d22';g.beginPath();g.arc(0,0,110,0,7);g.fill();for(let i=0;i<24;i++){g.save();g.rotate(i*Math.PI/12);g.fillStyle='#34373e';g.fillRect(-9,-122,18,26);g.restore()}g.fillStyle='#9aa3ae';g.beginPath();g.arc(0,0,60,0,7);g.fill();g.restore()}
  if(m==='sort'){ // 大きな粒と小さな粒が混ざった平らな道 → 揺れで大きな粒が等間隔に寄り集まり、そこが盛り上がって波になる（断面）
    const u=ease((t-0.3)/(DUR*0.75));const shake_=(t<DUR*0.85?1:0)*2*Math.sin(t*40);
    const lam=200;const top=x=>420-26*u*Math.max(0,Math.sin(2*Math.PI*x/lam));ground(top,-20,W+20,'#7a5c38');
    for(let i=0;i<420;i++){const r2=R(i+40);const big=r2()<0.28;const x0=r2()*W,y0=430+r2()*260;
      let x=x0,y=y0;if(big){const k=Math.round(x0/lam-0.25)+0.25;const cxk=k*lam;x=lerp(x0,cxk+(r2()-.5)*70,u);y=lerp(y0,top(x)+16+r2()*40,u)}else{y=Math.max(y0,top(x0)+10)}
      g.fillStyle=big?'#ecd3a0':'#3a2814';g.beginPath();g.arc(x+(big?shake_:0),y,big?11:4,0,7);g.fill()}
    sfxOnce('s',0,'rattle',DUR*0.85)}
};
</script></body></html>
