<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="lib.js"></script>
<script>
/* 衛星写真の地図（NASA Blue Marble）。view："aus"（世界→オーストラリアへ寄り、メルボルンに印）／"atlantic"（北大西洋へ寄り、二つの都市に印、線で結ぶ）
   img＝地図画像のパス（正距円筒図法）。pins＝[[経度,緯度,名前],...]。times[i+1]＝pins[i]を出す瞬間。link＝線で結ぶ瞬間の times の番号 */
window.DEF={view:'aus'};
function init(){loadImg('map',P.img)}
const VIEWS={aus:[110,-5,158,-45],atlantic:[-95,62,15,28]};
window.render=function(t){
  const im=IMG.map;const iw=im.width,ih=im.height;const X=lon=>(lon+180)/360*iw,Y=lat=>(90-lat)/180*ih;
  const v=VIEWS[P.view];const u=ease((t-0.3)/1.6);
  // 見る範囲（世界全体 → 目的の範囲）。画面の縦横比に合わせる
  let x0=lerp(0,X(v[0]),u),x1=lerp(iw,X(v[2]),u),y0=lerp(0,Y(v[1]),u),y1=lerp(ih,Y(v[3]),u);
  const cx=(x0+x1)/2,cy=(y0+y1)/2;let w=x1-x0,h=y1-y0;if(w/h>W/H)h=w*H/W;else w=h*W/H;x0=cx-w/2;y0=cy-h/2;
  g.fillStyle='#061226';g.fillRect(0,0,W,H);g.drawImage(im,x0,y0,w,h,0,0,W,H);
  g.fillStyle='rgba(0,10,30,.18)';g.fillRect(0,0,W,H);
  const S=(lon,lat)=>[(X(lon)-x0)/w*W,(Y(lat)-y0)/h*H];
  if(u>0.2){sfxOnce('z',0.3,'whoosh')}
  (P.pins||[]).forEach((p,i)=>{const t0=T(i+1,1.9+i*0.6);const k=back((t-t0)/0.35);if(k<=0)return;sfxOnce('p'+i,t0,'pop');const [x,y]=S(p[0],p[1]);
    g.fillStyle='rgba(255,90,54,.35)';g.beginPath();g.arc(x,y,24*k+6*Math.sin(t*5),0,7);g.fill();g.fillStyle='#ff5a36';g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();g.arc(x,y,11*k,0,7);g.fill();g.stroke();
    label(Math.min(W-160,Math.max(160,x)),y-56,p[2],k,'#fff',32)});
  if(P.link!=null&&(P.pins||[]).length>1){const t0=T(P.link,3.5);const k=ease((t-t0)/0.9);if(k>0){sfxOnce('l',t0,'whoosh');const [ax,ay]=S(...P.pins[0]),[bx,by]=S(...P.pins[1]);const mx=(ax+bx)/2,my=Math.min(ay,by)-160;
    g.strokeStyle='#ffd36a';g.lineWidth=6;g.setLineDash([16,10]);g.beginPath();g.moveTo(ax,ay);const N=40;for(let i=1;i<=N*k;i++){const q=i/N;g.lineTo((1-q)*(1-q)*ax+2*q*(1-q)*mx+q*q*bx,(1-q)*(1-q)*ay+2*q*(1-q)*my+q*q*by)}g.stroke();g.setLineDash([])}}
};
</script></body></html>
