<script>
/* ロサンゼルスの水の回・第2章（ポンプのない水路）。
 mode：drift（水路を横から。葉っぱが流れていく）
      ／height（高さを大きく伸ばした断面。ats：[0] 取り入れ口が光る [1] 終点が光る [2] 高さの線と数字 [3] 水が坂を下る [4] 水の粒が流れ続ける）
      ／flatten（同じ断面。ats：[0] 1km で 2m の三角 [1] 本当の比率へ押しつぶされて一本の線に）
      ／contour（上から見た等高線の地形。ats：[0] 丘が浮き上がる [1] 水路が等高線に沿って曲がりながらのびる）
      ／seep（水路の断面。水が土にしみ出して減る。ats[0] でコンクリートが敷かれて止まる）
      ／cover（横から。日ざしで湯気。ats[0] でふたがかぶさる、ats[1] で先へ進み、管が丘の下を通る）
      ／siphon（深い谷。ats：[0] 鉄の管が谷を下って上る [1] 深さの線と数字 [2] 入口と出口の高さの線）
      ／pressure（管の輪切りと圧力計。ats[0] で針が 26 へ）
      ／ship（南北アメリカの地図。ats：[0] 東海岸に印 [1] 船が出る [2] パナマにバツ [3] 南の端を回って西海岸へ）
      ／tunnel（山の断面をトンネルが抜ける。ats：[0] 水路の帯にトンネルの区間が並ぶ [1] つなげて一本に [2] いちばん長い1本が光る）
      ／power（水が管を落ちて水車を回す。ats[0] で電気が街へ）
      ／build（砂漠の工事。ats：[0] 年 [1] 人が端から並ぶ [2] 工場が3つ建つ）
      ／musashi（関東の地図。はじめに広い地図から寄る。ats：[0] 利根川 [1] 短い水路 [2] 荒川から街へ [3] 坂の印 [4] ポンプの印）
      ／arrive（カリフォルニアの地図から、水路の終点へ寄る。東京の話から主役に戻る合図）
      ／cascade（斜面の階段を水が流れ落ちる。ats[0] で人が集まってコップをかかげる） */

function skyD(h=440){const s=g.createLinearGradient(0,0,0,h);s.addColorStop(0,'#6fb4e6');s.addColorStop(1,'#f5e2bb');g.fillStyle=s;g.fillRect(0,0,W,h+4)}

function drift(t){skyD();ridge(400,'#c9b08c',6,110);ridge(428,'#bb9f76',1,50);g.fillStyle=sandPat('#d6b784');g.fillRect(0,430,W,H);for(const[x,s] of [[120,1],[380,1.2],[700,0.9],[980,1.1],[1200,1]])shrub(x,440,s);

const PX0=150,PX1=1130,PB=590,PH=380;
function prof(e,t,wk,flow){const cy=u=>PB-(1-u)*PH*e,gy=u=>cy(u)-(18+26*Math.abs(Math.sin(u*9.1))+14*Math.sin(u*23))*Math.min(1,e*1.4)*(u>0.04&&u<0.96?1:0.3);

  const P=[];for(let i=0;i<=60;i++){const u=i/60;P.push([lerp(PX0,PX1,u),cy(u)])}lineK(P,1,[['#cfc9bb',12]]);const r=lineK(P,wk,[[WAT,7]]);if(flow&&wk>=1)dotsOn(P,r.L,r.D,t,9,3,0.25);return{cy,P}}
function profEnds(e,t,a=1){g.save();g.globalAlpha=a;const s=Math.max(0.05,e);g.save();g.translate(PX0-70,PB-PH*e+4);g.scale(1,1);for(const[dx,z] of [[-70,1.5],[0,2.1],[60,1.6]])mtn(dx,0+z*8,z*lerp(0.5,1,s),1);g.restore();

function height(t){const Ta=T(1,1),Tb=T(2,2),T1=T(3,3.2),T2=T(4,7),T3=T(5,11);skyD(600);const wk=ease(clamp((t-T2)/2.2));prof(1,t,wk,true);profEnds(1,t);for(const[tt,x,y] of [[Ta,PX0,PB-PH],[Tb,PX1,PB]]){const q=(t-tt)/1.0;if(q>0&&q<1){g.strokeStyle=`rgba(255,211,106,${1-q})`;g.lineWidth=7;g.beginPath();g.arc(x,y,14+60*q,0,7);g.stroke();g.fillStyle='#ffd36a';g.beginPath();g.arc(x,y,10,0,7);g.fill()}}sfxOnce('ia',Ta,'tick');sfxOnce('ib',Tb,'tick');

function flatten(t){const T1=T(1,5),T2=T(2,10);skyD(600);const u=ease(clamp((t-T2)/Math.max(1.6,DUR-T2-0.8)));const e=lerp(1,0.012,u);prof(e,t,1,true);profEnds(e,t,1-clamp(u*1.6));
  const k=clamp((t-T1)/0.4)*(1-clamp((t-T2)/0.4));if(k>0){g.save();g.globalAlpha=k;g.translate(640,150);g.scale(back(clamp(k)),back(clamp(k)));g.fillStyle='rgba(12,18,28,.8)';g.beginPath();g.roundRect(-330,-90,660,190,22);g.fill();g.fillStyle=WAT;g.beginPath();g.moveTo(-260,-20);g.lineTo(240,30);g.lineTo(-260,30);g.closePath();g.fill();g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(-260,48);g.lineTo(240,48);g.moveTo(-280,-20);g.lineTo(-280,30);g.stroke();g.fillStyle='#fff';g.font=`900 34px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillText('1km',0,74);g.fillStyle='#ffd36a';g.fillText('2m',-250,-52);g.restore();sfxOnce('p',T1,'pop')}

const HILLS=[[330,250,150,110,0.3],[640,470,170,120,-0.2],[930,230,160,120,0.15],[1130,520,130,100,0.4],[140,560,120,90,0]];
function contour(t){const T1=T(1,3),T2=T(2,6.5);g.fillStyle=sandPat('#d9bf8e');g.fillRect(0,0,W,H);const hk=ease(clamp((t-T1)/0.8));

function seep(t){const T1=T(1,6.5);g.fillStyle=sandPat('#c9a46a');g.fillRect(0,0,W,H);skyD(170);g.fillStyle=sandPat('#d6b784');g.fillRect(0,170,W,24);const cx=640,top=194,bot=470,tw=330,bw=170;const k=ease(clamp((t-T1)/0.9));
  const dry=clamp(t/Math.max(2,T1))*(1-k);const wetA=(0.25+0.4*clamp(t/3))*(1-k);if(wetA>0){const gr=g.createRadialGradient(cx,bot,60,cx,bot+60,360);gr.addColorStop(0,`rgba(70,50,30,${wetA})`);gr.addColorStop(1,'rgba(70,50,30,0)');g.fillStyle=gr;g.fillRect(cx-420,top,840,H)}

  if(k<1){const r=R(9);for(let i=0;i<46;i++){const side=r();const q=((t*0.35+r())%1);let x,y;if(side<0.5){x=cx+(r()-0.5)*2*bw;y=bot+6+q*190}else{const s=side<0.75?-1:1,m=r();x=cx+s*(bw+(tw-bw)*m*0.7)+s*q*60;y=bot-(bot-top)*m*0.7+q*150}g.fillStyle=`rgba(90,170,225,${0.85*(1-q)*(1-k)})`;g.beginPath();g.ellipse(x,y,3,5,0,0,7);g.fill()}}
  if(k>0){g.strokeStyle='#b9b6ae';g.lineWidth=20;g.lineJoin='round';g.lineCap='round';const C=[[cx-tw+4,top+4],[cx-bw,bot],[cx+bw,bot],[cx+tw-4,top+4]];const mid=[[cx,bot]];g.beginPath();const a=clamp(k*1.6),b=clamp(k*1.6-0.6);g.moveTo(cx-bw*a,bot);g.lineTo(cx+bw*a,bot);g.stroke();if(b>0){g.beginPath();g.moveTo(cx-bw,bot);g.lineTo(lerp(cx-bw,cx-tw+4,b),lerp(bot,top+4,b));g.moveTo(cx+bw,bot);g.lineTo(lerp(cx+bw,cx+tw-4,b),lerp(bot,top+4,b));g.stroke()}g.lineCap='butt';sfxOnce('c',T1,'thump')}
  for(const[x,s] of [[160,1.1],[1090,1],[980,0.8]])shrub(x,194,s)}

function cover(t){const T1=T(1,6),T2=T(2,11);const pan=ease(clamp((t-T2)/1.6))*760;skyD();const sx=1080-pan*0.25;g.fillStyle='#fff3c9';g.beginPath();g.arc(sx,110,46,0,7);g.fill();g.strokeStyle='rgba(255,243,201,.7)';g.lineWidth=6;for(let i=0;i<12;i++){const a=i*Math.PI/6+t*0.3;g.beginPath();g.moveTo(sx+Math.cos(a)*62,110+Math.sin(a)*62);g.lineTo(sx+Math.cos(a)*(84+8*Math.sin(t*3+i)),110+Math.sin(a)*(84+8*Math.sin(t*3+i)));g.stroke()}
  g.save();g.translate(-pan,0);const WW=2300;const gt=x=>430-210*Math.exp(-Math.pow((x-1560)/260,2));g.fillStyle=sandPat('#d6b784');g.beginPath();g.moveTo(0,H);for(let x=0;x<=WW;x+=12)g.lineTo(x,gt(x));g.lineTo(WW,H);g.fill();
  g.fillStyle='#b9b2a3';g.fillRect(0,440,WW,86);const wg=g.createLinearGradient(0,448,0,516);wg.addColorStop(0,'#63b3e4');wg.addColorStop(1,'#2f77ad');g.fillStyle=wg;g.fillRect(0,450,WW,66);g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=2.5;const r=R(4);for(let i=0;i<50;i++){const y=458+r()*52,x=((r()*WW+t*150)%(WW+80))-40;g.beginPath();g.moveTo(x,y);g.lineTo(x+22,y);g.stroke()}
  const lk=clamp((t-T1)/1.6);const lidX=lerp(-40,WW,t>T2?1:lk*0.6);if(lk>0){g.fillStyle='#cfc9bb';g.fillRect(0,430,lidX,22);g.fillStyle='rgba(0,0,0,.12)';for(let x=0;x<lidX;x+=70)g.fillRect(x,430,3,22);sfxOnce('l',T1,'thump')}
  const vr=R(12);for(let i=0;i<26;i++){const x=40+vr()*1240;if(x<lidX)continue;const q=((t*0.3+vr())%1);g.strokeStyle=`rgba(255,255,255,${0.55*(1-q)})`;g.lineWidth=4;g.beginPath();const y=440-q*150;g.moveTo(x,y);g.quadraticCurveTo(x+12,y-20,x,y-40);g.quadraticCurveTo(x-12,y-60,x,y-80);g.stroke()}
  g.fillStyle=sandPat('#c9a46a');g.fillRect(0,526,WW,H);for(const[x,s] of [[200,1],[520,1.1],[900,1],[1250,0.9],[1480,1.1],[1650,1],[1980,1]])shrub(x,gt(x)+2,s);g.restore();if(t>T2)sfxOnce('z',T2,'whoosh')}

  g.fillStyle='#cfc9bb';g.fillRect(0,250,372,14);g.fillStyle=WAT;g.fillRect(0,240,366,12);g.fillStyle='#cfc9bb';g.fillRect(908,280,372,14);

  const m=clamp((t-T2)/0.4);if(m>0){g.strokeStyle=`rgba(255,255,255,${0.95*m})`;g.lineWidth=4;g.beginPath();g.moveTo(626,256);g.lineTo(654,256);g.moveTo(640,256);g.lineTo(640,256+320*ease(m));g.stroke();if(m>=1){g.beginPath();g.moveTo(626,576);g.lineTo(654,576);g.stroke()}numLabel(770,200,'約250m',clamp((t-T2-0.2)/0.3),54);if(m>=1){g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=3;g.beginPath();g.moveTo(700,220);g.lineTo(650,300);g.stroke()}sfxOnce('n',T2+0.2,'pop')}
  const h=clamp((t-T3)/0.5);if(h>0){const pu=0.5+0.5*Math.sin((t-T3)*5);g.strokeStyle=`rgba(255,211,106,${0.95*h})`;g.lineWidth=5;g.beginPath();g.moveTo(362,244);g.lineTo(362+(1000-362)*ease(h),244);g.stroke();if(h>=1){g.strokeStyle=`rgba(255,255,255,${0.7+0.3*pu})`;g.beginPath();g.moveTo(940,244);g.lineTo(940,274);g.moveTo(926,244);g.lineTo(954,244);g.moveTo(926,274);g.lineTo(954,274);g.stroke();g.fillStyle=`rgba(255,211,106,${0.5+0.5*pu})`;g.beginPath();g.arc(362,244,9,0,7);g.arc(914,274,9,0,7);g.fill()}sfxOnce('h',T3,'tick')}}
