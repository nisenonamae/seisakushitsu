/* 第4章：洗濯板ができやすい場所・道の材料・直し方・日本の研究。文字なし。
 spots    … 真上から見た田舎の道。times[1..4] で 交差点・坂・カーブ・家の出入り口 に波の縞が浮かぶ
 brake    … 横から。times[1] 止まっていた車が急に走り出し（後ろへ砂）、そこに波 → times[2] 次の車が急ブレーキ（前が沈む）、止まる手前に波
 surge    … 大きな車輪。押す力（下の光）が times[1] で急に強くなり、そこから先に波が次々にできる
 dry      … 強い日ざしで表面が乾いて白っぽくなり、粒がばらけて浮く → 車が通るとすぐ波
 balance  … 上に天びん（左＝砂利、右＝細かい粒）、下に道。times[1] 細かい粒が減る→砂利がばらけて波、[2] 細かい粒が多すぎ→乾くと土ぼこり、[3] 雨→ぬかるんで滑る
 regrade  … 湿った道（雨上がり）。重機の刃が times[1] で谷の底より深く入り、混ぜ直す → times[2] でローラーが通り、なめらかに
 skim     … 乾いた道。刃が山の頭だけを削ってならす → 車が通ると、同じ場所にすぐ波が戻る
 compress … 断面の下に土の層。車が通ると、車輪の下の土がぎゅっと縮む（層の線が沈む）
 seed     … 縮んで残ったわずかなくぼみ。次の車輪がそこで沈んで跳ね、先に小さな山ができる
 lab      … 左：筒の中の土をおもりで押す実験（少しずつ縮む）。右：画面の中の計算で、波がだんだん育つ
 bounce   … 小さなでこぼこで上下に揺れる車。下で波が育つ。times[1] で上下の揺れの矢印が大きく光る */
window.DEF={mode:'spots'};

function stripes(x,y,ang,len,wid,k){if(k<=0)return;g.save();g.translate(x,y);g.rotate(ang);for(let i=-len/2;i<len/2;i+=16){g.fillStyle=`rgba(110,80,45,${0.75*k})`;g.fillRect(i,-wid/2,7,wid);g.fillStyle=`rgba(255,240,205,${0.5*k})`;g.fillRect(i+7,-wid/2,3,wid)}g.restore()}
function blade(x,y,sc=1){g.save();g.translate(x,y);g.scale(sc,sc);track(-75,-210,170,10);g.fillStyle='#e0a526';g.beginPath();g.roundRect(-40,-150,200,60,10);g.fill();g.fillStyle='#bfe0f2';g.fillRect(90,-200,50,44);g.fillStyle='#e0a526';g.fillRect(84,-206,62,8);
  g.strokeStyle='#4b5563';g.lineWidth=10;g.beginPath();g.moveTo(40,-92);g.lineTo(-10,-20);g.stroke();g.fillStyle='#374151';g.beginPath();g.moveTo(-60,-34);g.lineTo(10,-34);g.lineTo(-6,6);g.lineTo(-70,6);g.closePath();g.fill();g.fillStyle='#9ca3af';g.fillRect(-72,2,72,6);tire(130,-50,40,x/40);g.restore()}

   // 道すじ：まっすぐ（左の外→カーブの入口）＋カーブ（下の外へ）
   const bz=(u)=>{const P0=[820,420],C=[1010,420],P1=[1060,800];const v=1-u;return [v*v*P0[0]+2*v*u*C[0]+u*u*P1[0],v*v*P0[1]+2*v*u*C[1]+u*u*P1[1]]};
   const main=u=>u<0.6?[lerp(-120,820,u/0.6),420]:bz((u-0.6)/0.4);
   const branch=u=>[330,lerp(420,-60,u)],drive=u=>[130,lerp(420,250,u)];
   const strokePath=(fn,w)=>{g.strokeStyle='#cfa86c';g.lineWidth=w;g.lineCap='butt';g.lineJoin='round';g.beginPath();for(let u=0;u<=1.0001;u+=0.005){const p=fn(u);u===0?g.moveTo(...p):g.lineTo(...p)}g.stroke()};
   // 坂（影の帯）

   const top=x=>BASE-28*A1*Math.max(0,Math.sin(2*Math.PI*(x-260)/90))*(x>260&&x<560?1:0)-28*A2*Math.max(0,Math.sin(2*Math.PI*(x-760)/90))*(x>760&&x<1060?1:0);layers(top);

   {const d=Math.max(0,t-t1);const x=200+420*d*d;if(x<W+300){car(x,BASE-34,1,{col:'#c0392b',heads:2,t,wheelR:34,wheelAng:x/34,bob:d<0.6?6*Math.sin(d*10)*0:0});if(t>t1&&d<1.2){sfxOnce('a',t1,'engine',1.2);const r2=R(3);for(let i=0;i<30;i++){const dd=(d*1.5+r2())%1;g.fillStyle=`rgba(200,170,120,${0.8*(1-dd)})`;g.beginPath();g.arc(x-110-dd*200,BASE-10-dd*80*r2(),3+3*r2(),0,7);g.fill()}}}}

     if(d>tb&&d<tb+1){const r2=R(5);for(let i=0;i<24;i++){const dd=((d-tb)*1.5+r2())%1;g.fillStyle=`rgba(200,170,120,${0.8*(1-dd)})`;g.beginPath();g.arc(x+120+dd*120,BASE-6-dd*60*r2(),3+3*r2(),0,7);g.fill()}}}
 }
 else if(m==='surge'){
   sky2();const t1=T(1,DUR*0.35);const off=t*170;const wx=520,r=170;const born=t>t1?(t1*170+wx):1e9;
   const top=x=>{const X=x+off;const amp=X>born?36*clamp((X-born)/40):0;const grow=X>born?clamp((t-t1)/2):0;return BASE-1.2*Math.sin(X/5)-(X>born&&x<wx?amp*grow*Math.max(0,Math.sin(2*Math.PI*(X-born)/230)):0)};
   layers(top);const spike=t>t1&&t<t1+0.5?1-((t-t1)/0.5):0;const f=0.35+0.65*spike+(t>t1?0.25*Math.max(0,Math.sin(2*Math.PI*((wx+off)-born)/230)):0);
   const gr=g.createRadialGradient(wx,top(wx)+6,4,wx,top(wx)+6,160*f+30);gr.addColorStop(0,`rgba(255,170,60,${0.9*clamp(f)})`);gr.addColorStop(1,'rgba(255,170,60,0)');g.fillStyle=gr;g.beginPath();g.ellipse(wx,top(wx)+60,200*f+30,140*f+20,0,0,7);g.fill();
   const ph=t>t1?(((wx+off)-born)%230)/230:0;tire(wx,top(wx)-r-(t>t1?24*clamp((t-t1)/2)*4*ph*(1-ph):0),r,off/r);
   if(t>t1)sfxOnce('s',t1,'thump');
 }
 else if(m==='dry'){

   g.fillStyle='#fff3b0';g.shadowColor='#ffd36a';g.shadowBlur=60;g.beginPath();g.arc(1100,110,60,0,7);g.fill();g.shadowBlur=0;
   for(let i=0;i<12;i++){const a=i*Math.PI/6+t*0.3;g.strokeStyle=`rgba(255,220,120,${0.5*k})`;g.lineWidth=6;g.beginPath();g.moveTo(1100+80*Math.cos(a),110+80*Math.sin(a));g.lineTo(1100+120*Math.cos(a),110+120*Math.sin(a));g.stroke()}
   const tc=DUR*0.55;const A=ease((t-tc-0.4)/1.4);const top=x=>BASE-18*A*Math.max(0,Math.sin(2*Math.PI*x/150))*(x<lerp(-200,W+200,clamp((t-tc)/1.6))-120?1:0);
   const base=`rgb(${Math.round(lerp(201,226,k))},${Math.round(lerp(164,200,k))},${Math.round(lerp(106,150,k))})`;layers(top,-20,W+20,base);

   if(t>tc){const x=lerp(-200,W+200,clamp((t-tc)/1.6));car(x,BASE-34-A*6,1,{col:'#2f5d9f',heads:A*4,t,wheelR:34,wheelAng:x/34});dust(x-120,BASE-10,tc,t,4,30);sfxOnce('c',tc,'car',1.6)}
 }
 else if(m==='balance'){
   const t1=T(1,DUR*0.2),t2=T(2,DUR*0.5),t3=T(3,DUR*0.75);const st=t<t1?0:t<t2?1:t<t3?2:3;
   const fines=st===0?1:st===1?lerp(1,0.2,ease((t-t1)/0.6)):lerp(0.2,2.2,ease((t-t2)/0.6));const th=clamp((1-fines)*0.25,-0.22,0.22);
