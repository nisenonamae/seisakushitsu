<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="lib.js"></script>
<script>
/* 舗装は幹線道路だけ：真上から見た乾いた土地。灰色の幹線道路が一本だけ通り、そこから枝分かれする道はぜんぶ土の色。
   カメラは幹線道路を走る車について行き、少しずつ高く上がって（引いて）、まわりの道がみな土の道だと見せる。文字なし */
window.DEF={};
const rr=R(31);const br=[];for(let i=0;i<60;i++){const x=i*220+rr()*120;br.push({x,up:rr()<.5,L:300+rr()*900,bend:(rr()-.5)*300,farm:rr()<.6})}
window.render=function(t){
  const z=lerp(1.6,0.55,ease((t-0.4)/Math.max(1,DUR*0.8)));const camX=t*260;
  g.fillStyle='#c8a875';g.fillRect(0,0,W,H);
  g.save();g.translate(W/2,H/2);g.scale(z,z);g.translate(-camX-200,0);
  // 地面のむら
  const r2=R(5);for(let i=0;i<220;i++){const x=r2()*6000-500,y=(r2()-.5)*2400;g.fillStyle='rgba(150,120,75,.25)';g.beginPath();g.ellipse(x,y,40+r2()*120,20+r2()*60,r2()*3,0,7);g.fill()}
  // 土の道（枝分かれ）
  for(const b of br){const sgn=b.up?-1:1;g.strokeStyle='#e2c99a';g.lineWidth=14;g.lineCap='round';g.beginPath();g.moveTo(b.x,0);g.quadraticCurveTo(b.x+b.bend,sgn*b.L*0.5,b.x+b.bend*0.6,sgn*b.L);g.stroke();
    if(b.farm){const fx=b.x+b.bend*0.6,fy=sgn*b.L;g.fillStyle='#8a6a48';g.fillRect(fx-22,fy-16,44,32);g.fillStyle='#b45309';g.fillRect(fx-22,fy-16,44,10)}}
  // 幹線道路（舗装）
  g.fillStyle='#4b5160';g.fillRect(-1000,-26,8000,52);g.fillStyle='#e5e7eb';for(let x=-1000;x<7000;x+=90)g.fillRect(x,-2,46,4);
  // 車（上から）
  const cx=camX+200;g.fillStyle='#c0392b';g.beginPath();g.roundRect(cx-34,-18,68,28,8);g.fill();g.fillStyle='#bfe0f2';g.fillRect(cx+6,-14,12,20);
  g.restore();sfxOnce('c',0,'car',DUR);
};
</script></body></html>
