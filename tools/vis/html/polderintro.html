<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="lib.js"></script>
<script src="geo_land.js"></script>
<script>
/* 人工の土地の回・地図と上からの景色。
 mode：fields（上から見た干拓地の畑と町 → ats[0] の言葉で水が押し寄せて海に戻る＝100年前）
      ／nlmap（オランダの地図。ats[0] でフレヴォラント州が光る）
      ／flash（100年前の地図＝内海 → 一気に陸へ変わる）
      ／jpmap（日本 → ats[0] で東京湾へ寄る） */
window.DEF={mode:'fields'};
const SEA='#42667f',SEA2='#5b8198',LAND='#e2d4ad',LAND2='#cdbf9c',NB='#b9b196',FRESH='#7fb2c9',LAKE='#4d7892',HI='#f0b63e';
let PAT={};
function noisePat(key,base,spots,n=900,sz=256){if(PAT[key])return PAT[key];const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,sz,sz);const r=R(key.length*13+7);
  for(let i=0;i<n;i++){x.fillStyle=spots[Math.floor(r()*spots.length)];x.globalAlpha=0.25+r()*0.4;const w=4+r()*26,h=3+r()*14;x.beginPath();x.ellipse(r()*sz,r()*sz,w,h,r()*3,0,7);x.fill()}
  return PAT[key]=g.createPattern(c,'repeat')}
function view(lon,lat,sc){return{lon,lat,sc,k:Math.cos(lat*Math.PI/180)}}
function pj(v,lo,la){return[W/2+(lo-v.lon)*v.sc*v.k,H/2-(la-v.lat)*v.sc]}
function poly(v,rings){g.beginPath();for(const r of rings){for(let i=0;i<r.length;i++){const[x,y]=pj(v,r[i][0],r[i][1]);i?g.lineTo(x,y):g.moveTo(x,y)}g.closePath()}}
function seaBg(t){g.fillStyle=SEA;g.fillRect(0,0,W,H);g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=2;const r=R(3);for(let i=0;i<46;i++){const x=r()*W,y=r()*H,w=30+r()*50;const o=Math.sin(t*0.9+i)*10;g.beginPath();g.moveTo(x+o,y);g.quadraticCurveTo(x+o+w/2,y-6,x+o+w,y);g.stroke()}}
function nlBase(v,t,old){seaBg(t);const G=window.GEO;
  g.fillStyle=NB;poly(v,G.nb);g.fill();
  for(const[n,rs] of Object.entries(G.prov)){if(old&&n==='Flevoland')continue;g.fillStyle=noisePat('land',LAND,['#d3c79a','#c9cf9c','#e9dcba','#bfc893']);poly(v,rs);g.fill();g.strokeStyle='rgba(120,105,70,.25)';g.lineWidth=1;g.stroke()}
  g.fillStyle=old?SEA:LAKE;poly(v,[G.lake[0]]);if(old)g.fill();else{poly(v,G.lake);g.fill('evenodd');lakeWater(v,t,1)}}
// 湖は「色を付けた区域」ではなく水に見えるように：海と同じ波と、小さな帆船（残った水は今も水、と絵だけで分かるように）
function lakeWater(v,t,a){const G=window.GEO;g.save();poly(v,G.lake);g.clip('evenodd');g.globalAlpha=a;g.strokeStyle='rgba(255,255,255,.16)';g.lineWidth=2;const r=R(8);for(let i=0;i<60;i++){const[x,y]=pj(v,4.95+r()*0.95,52.25+r()*0.85);const w=14+r()*20,o=Math.sin(t*0.9+i)*6;g.beginPath();g.moveTo(x+o,y);g.quadraticCurveTo(x+o+w/2,y-4,x+o+w,y);g.stroke()}
  for(const[lo,la,ph] of [[5.33,52.86,0],[5.13,52.6,2]]){const[x,y]=pj(v,lo+Math.sin(t*0.25+ph)*0.03,la);g.fillStyle='rgba(20,40,55,.35)';g.beginPath();g.ellipse(x+2,y+4,9,3,0,0,7);g.fill();g.fillStyle='#f4ecd8';g.beginPath();g.moveTo(x,y-11);g.lineTo(x+8,y+2);g.lineTo(x-5,y+2);g.closePath();g.fill();g.fillStyle='#7a4f2c';g.fillRect(x-7,y+2,15,3)}
  g.restore();g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=1.5;poly(v,G.lake);g.stroke()}
const NLV=()=>view(5.35,52.25,238);
function fields(t){const T1=T(1,DUR*0.42);const r=R(11);
  // 畑（区画）
  g.fillStyle='#8fae6b';g.fillRect(0,0,W,H);const cw=214,ch=180;const cols=['#9cbb6c','#b9c873','#e3cf5a','#d9c58a','#86a862','#a9c47a','#cdb774','#93b56e'];
  for(let j=0;j<4;j++)for(let i=0;i<6;i++){const x=i*cw+6,y=j*ch+6;const c=cols[Math.floor(r()*cols.length)];g.fillStyle=c;g.fillRect(x,y,cw-12,ch-12);
    g.strokeStyle='rgba(60,80,40,.22)';g.lineWidth=2;const vert=r()>0.5;for(let k=10;k<(vert?cw:ch)-12;k+=11){g.beginPath();if(vert){g.moveTo(x+k,y+3);g.lineTo(x+k,y+ch-15)}else{g.moveTo(x+3,y+k);g.lineTo(x+cw-15,y+k)}g.stroke()}}
  // 水路（縦）と道（横）
  for(let i=0;i<=6;i++){g.fillStyle='#5f9fc0';g.fillRect(i*cw-5,0,10,H);g.fillStyle='rgba(255,255,255,.25)';g.fillRect(i*cw-1,0,2,H)}
  for(let j=0;j<=4;j++){g.fillStyle='#d9d3c3';g.fillRect(0,j*ch-6,W,12);g.fillStyle='#b9b3a3';for(let x=0;x<W;x+=40)g.fillRect(x,j*ch-1,20,2)}
  // 並木（影つき）と農家
  const tree=(x,y,s)=>{g.fillStyle='rgba(20,40,20,.28)';g.beginPath();g.ellipse(x+9*s,y+8*s,13*s,9*s,0.5,0,7);g.fill();g.fillStyle='#3f7a45';g.beginPath();g.arc(x,y,11*s,0,7);g.fill();g.fillStyle='#5c9a55';g.beginPath();g.arc(x-3*s,y-3*s,6*s,0,7);g.fill()};
  const house=(x,y,rot,col)=>{g.save();g.translate(x,y);g.rotate(rot);g.fillStyle='rgba(20,30,20,.3)';g.fillRect(-20+8,-13+8,40,26);g.fillStyle=col;g.fillRect(-20,-13,40,26);g.fillStyle='rgba(0,0,0,.18)';g.fillRect(-20,0,40,13);g.fillStyle='rgba(255,255,255,.35)';g.fillRect(-20,-1,40,2);g.restore()};
  for(let j=1;j<4;j++)for(let x=30;x<W;x+=58)tree(x+(j%2)*20,j*ch+22,1);
  for(let i=0;i<6;i++)for(let j=0;j<4;j++){if(r()<0.55){house(i*cw+50+r()*40,j*ch+ch-34,0,['#b5533c','#c9603f','#8e4a3a'][Math.floor(r()*3)]);house(i*cw+105+r()*30,j*ch+ch-38,0,'#6f7a84')}}
  // 町（右下）
  g.fillStyle='#cfc8b6';g.fillRect(4*cw+8,2*ch+8,2*cw-16,2*ch-16);for(let a=0;a<9;a++)for(let b=0;b<7;b++){house(4*cw+40+a*44,2*ch+40+b*46,0,['#b5533c','#c9603f','#8e4a3a','#7d8790'][(a*3+b)%4])}
  for(let b=0;b<8;b++){g.fillStyle='#e9e4d6';g.fillRect(4*cw+12,2*ch+16+b*46,2*cw-24,5)}
  // トラクター（畑を横切る）と車
  const tx=lerp(-60,W+60,(t*0.07)%1);g.save();g.translate(tx,ch*1+70);track(-26,-14,26,14);g.fillStyle='rgba(0,0,0,.3)';g.fillRect(-22,-8,48,24);g.fillStyle='#c0392b';g.fillRect(-26,-12,34,24);g.fillStyle='#2c2f36';g.fillRect(8,-14,18,28);g.restore();
  g.fillStyle='rgba(90,70,40,.35)';g.fillRect(0,ch+62,Math.max(0,tx-26),16);
  for(let k=0;k<3;k++){const cx=lerp(W+80,-80,((t*0.11+k/3)%1));g.save();g.translate(cx,3*ch);track(-16,-8,16,8);g.fillStyle=['#2f5d9f','#e6e2d8','#3b3b3b'][k];g.beginPath();g.roundRect(-16,-8,32,16,5);g.fill();g.restore()}
  // 雲の影
  g.fillStyle='rgba(30,40,60,.10)';for(let k=0;k<3;k++){const cx=((t*22+k*520)%(W+600))-300;g.beginPath();g.ellipse(cx,160+k*210,210,90,0.2,0,7);g.fill()}
  // 水が押し寄せる（100年前に戻る）
  const u=clamp((t-T1)/1.7);if(u>0){const e=ease(u);const front=lerp(-200,W+260,e);
    g.save();g.beginPath();g.moveTo(-10,-10);for(let y=-10;y<=H+10;y+=12){g.lineTo(front+Math.sin(y*0.02+t*3)*26+Math.sin(y*0.057+t*2)*12-(y*0.18),y)}g.lineTo(-10,H+10);g.closePath();g.clip();
    const s=g.createLinearGradient(0,0,0,H);s.addColorStop(0,'#3d6d8c');s.addColorStop(1,'#2c5674');g.fillStyle=s;g.globalAlpha=0.94;g.fillRect(0,0,W,H);g.globalAlpha=1;
    g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=3;const rr=R(21);for(let i=0;i<70;i++){const x=rr()*W,y=rr()*H,w=40+rr()*70,o=Math.sin(t*1.4+i)*14;g.beginPath();g.moveTo(x+o,y);g.quadraticCurveTo(x+o+w/2,y-9,x+o+w,y);g.stroke()}
    // 帆船（上から）
    const bx=lerp(-120,W*0.62,ease(clamp((t-T1-0.5)/3.2)))+ (t-T1)*14,by=H*0.36+Math.sin(t*1.3)*6;g.save();g.translate(bx,by);g.rotate(-0.12);track(-60,-30,60,30);g.fillStyle='rgba(10,30,45,.3)';g.beginPath();g.ellipse(8,10,58,18,0,0,7);g.fill();g.fillStyle='#7a4f2c';g.beginPath();g.moveTo(-56,0);g.quadraticCurveTo(0,-22,60,0);g.quadraticCurveTo(0,22,-56,0);g.fill();g.fillStyle='#f3ead6';g.beginPath();g.moveTo(-6,-2);g.lineTo(36,-30);g.lineTo(30,26);g.closePath();g.fill();g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=3;g.beginPath();g.moveTo(-58,0);g.lineTo(-110,-12);g.moveTo(-58,0);g.lineTo(-110,12);g.stroke();g.restore();
    g.restore();
    // 波打ちぎわの白い泡
    g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=5;g.beginPath();for(let y=-10;y<=H+10;y+=12){const x=front+Math.sin(y*0.02+t*3)*26+Math.sin(y*0.057+t*2)*12-(y*0.18);y<0?g.moveTo(x,y):g.lineTo(x,y)}g.stroke();
    sfxOnce('w',T1,'whoosh')}
  // 年（右上）：2026 → 1926
  const yr=Math.round(lerp(2026,1926,ease(clamp((t-T1)/1.7))));g.fillStyle='rgba(12,18,28,.72)';g.beginPath();g.roundRect(W-236,24,212,84,14);g.fill();g.fillStyle='#fff';g.font=`900 58px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillText(yr+'年',W-130,68)}
// 州の形（行政の区域）は湖の水面も含むので、陸だけにするには「州の中」かつ「湖の外」で切り抜く
function landClip(v,rings){const G=window.GEO;poly(v,rings);g.clip();g.beginPath();g.rect(-200,-200,W+400,H+400);for(const r of G.lake){for(let i=0;i<r.length;i++){const[x,y]=pj(v,r[i][0],r[i][1]);i?g.lineTo(x,y):g.moveTo(x,y)}g.closePath()}g.clip('evenodd')}
function nlmap(t){const v=NLV();nlBase(v,t,false);const T1=T(1,DUR*0.35),T2=T(2,DUR*0.62);const u=clamp((t-T1)/0.9);const G=window.GEO;const lift=ease(clamp((t-T2)/0.7));const fl=G.prov.Flevoland;
  if(u>0){const[x0]=pj(v,5.0,52.5),[x1]=pj(v,6.1,52.5);const xe=x0+(x1-x0)*ease(u);
    if(lift>0){g.save();g.translate(9*lift,13*lift);landClip(v,fl);g.fillStyle=`rgba(10,25,40,${0.42*lift})`;g.fillRect(-200,-200,W+400,H+400);g.restore()}
    g.save();g.translate(-3*lift,-10*lift);landClip(v,fl);g.fillStyle=HI;g.fillRect(x0,0,xe-x0+2,H);
    g.strokeStyle='rgba(120,80,10,.35)';g.lineWidth=1.5;for(let x=x0;x<xe;x+=9){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()}for(let y=150;y<520;y+=14){g.beginPath();g.moveTo(x0,y);g.lineTo(xe,y);g.stroke()}
    const pulse=(t-T1-0.9)>0?0.5+0.5*Math.sin((t-T1-0.9)*4):0;g.strokeStyle=`rgba(255,255,255,${(0.75+0.25*pulse)*ease(u)})`;g.lineWidth=7;poly(v,fl);g.stroke();poly(v,G.lake);g.stroke();g.restore();
    sfxOnce('p',T1,'pop');if(lift>0)sfxOnce('l',T2,'whoosh')}}
function flash(t){const v=NLV();nlBase(v,t,true);const G=window.GEO;const u=clamp((t-0.35)/0.55);const fl=G.prov.Flevoland;
  if(u>0){const[cx,cy]=pj(v,5.55,52.5);
    // 残る水は海の色から湖の色へ（水のまま）
    g.fillStyle=LAKE;g.globalAlpha=ease(u);poly(v,G.lake);g.fill('evenodd');g.globalAlpha=1;lakeWater(v,t,ease(u));
    // 陸になる所だけが広がる
    g.save();landClip(v,fl);g.fillStyle=noisePat('land',LAND,['#d3c79a','#c9cf9c','#e9dcba','#bfc893']);g.beginPath();g.arc(cx,cy,ease(u)*230,0,7);g.fill();g.fillStyle='rgba(240,182,62,.62)';g.beginPath();g.arc(cx,cy,ease(u)*230,0,7);g.fill();g.restore();
    const ring=clamp((t-0.35)/1.1);if(ring<1){g.strokeStyle=`rgba(255,255,255,${0.8*(1-ring)})`;g.lineWidth=6;g.beginPath();g.arc(cx,cy,40+ring*260,0,7);g.stroke()}
    sfxOnce('w',0.35,'whoosh')}}
function jpmap(t){const T1=T(1,DUR*0.5);const ZL=Math.min(1.3,Math.max(0.7,(DUR-T1)*0.6)) /* 寄りと丸は場面の中で終える */;const u=ease(clamp((t-T1+0.15)/ZL));const v=view(lerp(137.2,139.85,u),lerp(37.6,35.45,u),Math.exp(lerp(Math.log(50),Math.log(560),u)));
  seaBg(t);const G=window.GEO;g.fillStyle=noisePat('jland',lerp(0,1,u)>0.5?'#cfd3a6':LAND,['#b9c592','#a9b987','#d9d2ae','#c3b98d'],1100);poly(v,G.jp);g.fill();g.strokeStyle='rgba(90,90,60,.35)';g.lineWidth=1+u;g.stroke();
  if(u>0.5){g.fillStyle=noisePat('jland','#cfd3a6',['#b9c592','#a9b987','#d9d2ae','#c3b98d'],1100);poly(v,G.kanto);g.fill();g.strokeStyle='rgba(90,90,60,.5)';g.lineWidth=2;g.stroke()}
  const[tx,ty]=pj(v,139.85,35.45);const k=clamp((t-T1-(ZL-0.4))/0.45);
  if(u<0.25){const[px,py]=pj(v,139.8,35.5);g.fillStyle='#e23a30';g.beginPath();g.arc(px,py,7+2*Math.sin(t*5),0,7);g.fill()}
  if(k>0){g.strokeStyle=`rgba(255,255,255,${0.9*k})`;g.lineWidth=5;g.setLineDash([]);g.beginPath();g.ellipse(tx,ty+10,150*back(k),170*back(k),0.25,0,7);g.stroke();const pulse=0.5+0.5*Math.sin((t-T1)*4);g.strokeStyle=`rgba(255,255,255,${0.25*pulse*k})`;g.lineWidth=14;g.beginPath();g.ellipse(tx,ty+10,150,170,0.25,0,7);g.stroke();sfxOnce('p',T1+ZL-0.4,'pop')}
  if(u>0&&u<1)sfxOnce('z',T1-0.15,'whoosh')}
window.render=function(t){g.setTransform(1,0,0,1,0,0);({fields,nlmap,flash,jpmap}[P.mode]||fields)(t)};
</script></body></html>
