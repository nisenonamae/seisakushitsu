<script>
/* 絵の練習：夜の海の漁船（2026-11-21・12回目。作り手「アリの顔以外の場面も、今までを踏まえて」）。アリで決めた作り方が、別の物でも通るかの試し。
   先に決めたこと：
   ・主役＝船のランタン。反対の色みのだいだいは、ランタン・船の窓・灯台の光にだけ使う（面積はごく小さく）
   ・色の流れ＝濃い紺→青→青緑→緑がかった水色→薄い黄緑。暗い色に黒を使わず、背景の紺に寄せる。明るいほど黄色へ色みをずらす
   ・形＝船・岩・雲・魚は、だ円や四角を置かず、点で輪郭を描く（blob）。面を分けて色を変える（光の当たる面／影の面）。光の線は足さない
   ・動き＝カメラは主役に寄った所から引く（主役の位置は画面の中で動かさない・奥ほど少なく動く）。船は波に遅れてゆれ、ランタンはさらに遅れる。
     魚は、水面がふくらむ「ため」のあとに跳ね、落ちたあとにしぶきと波の輪が残る */
window.DEF={};
const C={sky0:'#0a1038',sky1:'#15306a',far:'#123a6c',mid:'#14607c',near:'#157a80',front:'#0f5a6c',crest:'#8fe6b4',foam:'#dcf8c4',dk:'#081430',rock:'#1b2f66',rockL:'#2b4f8a',ac:'#ffa838',ac2:'#ffd884'};
const GX=582,GY=302;   // 目線の点（ランタン）
const wave=(k,x,t)=>{const a=[5,9,14,20][k],s=[0.5,0.8,1.1,1.5][k];return a*(Math.sin(x*0.011*(1.6-k*0.25)+t*s+k*1.7)+0.45*Math.sin(x*0.027-t*s*1.3+k))};
function sea(k,y0,col,hi,t,x0=-400,x1=1700){const top=(dy)=>{g.beginPath();g.moveTo(x0,H+400);for(let x=x0;x<=x1;x+=16)g.lineTo(x,y0+wave(k,x,t)+dy);g.lineTo(x1,H+400);g.closePath()};
  g.save();top(0);g.fillStyle=hi;g.fill();top(0);g.clip();g.fillStyle=col;g.beginPath();g.moveTo(x0,H+400);for(let x=x0;x<=x1;x+=16)g.lineTo(x+7,y0+wave(k,x,t)+3.5+k*1.6);g.lineTo(x1,H+400);g.fill();g.restore()}   // 波の上のふちに明るい面（形をずらして残す）
function lighthouse(t){g.save();g.translate(1010,372);
  // 岩：光の当たる左の面と、影の右の面
  g.fillStyle=C.rock;g.beginPath();blob([[-150,40,.3],[-118,8,.5],[-70,-6,.4],[-36,-30,.5],[20,-34,.4],[46,-12,.5],[96,-4,.4],[150,40,.3]]);g.fill();
  g.fillStyle=C.rockL;g.beginPath();blob([[-118,10,.5],[-70,-6,.4],[-36,-30,.5],[-8,-33,.4],[-22,-6,.6],[-60,14,.6],[-96,22,.5]]);g.fill();
  // 灯台：少し先細り。帯は部分の上塗り
  const T=[[-17,-32,.2],[-12,-128,.25],[12,-128,.25],[18,-32,.2]];g.fillStyle='#c9e8e0';g.beginPath();blob(T);g.fill();
  g.save();g.beginPath();blob(T);g.clip();g.fillStyle='#7fb4c4';g.fillRect(2,-140,30,120);g.fillStyle='#2d5f9a';g.fillRect(-30,-100,60,20);g.fillStyle='#1f4578';g.fillRect(2,-100,30,20);g.fillStyle='#2d5f9a';g.fillRect(-30,-56,60,14);g.fillStyle='#1f4578';g.fillRect(2,-56,30,14);g.restore();
  g.fillStyle=C.rock;g.beginPath();blob([[-19,-128,.2],[19,-128,.2],[16,-136,.3],[-16,-136,.3]]);g.fill();
  g.fillStyle=C.ac;g.beginPath();blob([[-10,-136,.2],[10,-136,.2],[10,-154,.2],[-10,-154,.2]]);g.fill();g.fillStyle=C.ac2;g.fillRect(-10,-154,9,18);
  g.fillStyle=C.rock;g.beginPath();blob([[-15,-154,.2],[15,-154,.2],[4,-170,.5],[-4,-170,.5]]);g.fill();
  // 光のすじ：ゆっくり回る（左右に振れて、幅が変わる）
  const a=Math.sin(t*0.9+0.6);for(const sd of [-1,1]){const w=0.07+0.10*Math.abs(a),dir=sd>0?(-0.1+a*0.25):(Math.PI+0.1-a*0.25),al=0.10+0.16*(sd*a>0?Math.abs(a):0.2);const gr=g.createRadialGradient(0,-145,10,0,-145,720);gr.addColorStop(0,`rgba(255,216,132,${al})`);gr.addColorStop(1,'rgba(255,216,132,0)');g.fillStyle=gr;g.beginPath();g.moveTo(0,-145);g.arc(0,-145,720,dir-w,dir+w);g.fill()}
  g.restore()}
function boat(t){const bx=GX-58,k=1,tl=t-0.28;   // 波より少し遅れてゆれる
  const y=432+wave(k,bx,tl)*0.8,sl=(wave(k,bx+40,tl)-wave(k,bx-40,tl))/80,rot=Math.atan(sl)*0.55;
  // ランタン：船よりさらに遅れて振れる
  const tl2=t-0.62,sl2=(wave(k,bx+40,tl2)-wave(k,bx-40,tl2))/80,sw=-Math.atan(sl2)*2.6+Math.sin(t*2.1)*0.04;
  g.save();g.translate(bx,y);g.rotate(rot);g.scale(1.45,1.45);g.lineCap='round';g.lineJoin='round';
  // 帆柱と腕（太い線）
  g.strokeStyle='#0c1c48';g.lineWidth=6;g.beginPath();g.moveTo(-8,-22);g.lineTo(-8,-112);g.stroke();g.lineWidth=5;g.beginPath();g.moveTo(-8,-104);g.lineTo(40,-122);g.stroke();
  // 船室：正面の面と屋根。窓にだけだいだい
  g.fillStyle='#1f7f8c';g.beginPath();blob([[-52,-18,.2],[-48,-50,.3],[-12,-52,.3],[-8,-18,.2]]);g.fill();g.fillStyle='#17586e';g.beginPath();blob([[-22,-18,.2],[-20,-51,.3],[-12,-52,.3],[-8,-18,.2]]);g.fill();
  g.fillStyle='#8fe6b4';g.beginPath();blob([[-58,-49,.3],[-6,-52,.3],[-4,-58,.4],[-56,-56,.4]]);g.fill();
  g.fillStyle=C.ac;g.beginPath();blob([[-44,-42,.3],[-30,-43,.3],[-30,-30,.3],[-44,-30,.3]]);g.fill();
  // 船体：へさきが上がる。上の帯は明るく、下半分は暗い面
  const Hh=[[-84,-22,.35],[66,-24,.3],[96,-36,.4],[82,-6,.6],[60,14,.6],[-62,14,.6],[-80,2,.6]];
  g.fillStyle='#16306e';g.beginPath();blob(Hh);g.fill();g.save();g.beginPath();blob(Hh);g.clip();g.fillStyle='#0c1c48';g.beginPath();blob(Hh,-4,13);g.fill();g.fillStyle='#35c0a4';g.beginPath();blob([[-90,-26,.3],[70,-28,.3],[100,-40,.4],[96,-30,.4],[68,-17,.3],[-88,-15,.3]]);g.fill();g.restore();
  // ランタン
  g.translate(40,-122);g.rotate(sw-rot);g.strokeStyle='#0c1c48';g.lineWidth=3.4;g.beginPath();g.moveTo(0,0);g.lineTo(0,18);g.stroke();
  const gl=g.createRadialGradient(0,30,2,0,30,120);gl.addColorStop(0,'rgba(255,190,90,.50)');gl.addColorStop(0.35,'rgba(255,170,60,.16)');gl.addColorStop(1,'rgba(255,170,60,0)');g.fillStyle=gl;g.beginPath();g.arc(0,30,120,0,7);g.fill();
  g.fillStyle='#0c1c48';g.beginPath();blob([[-9,18,.3],[9,18,.3],[7,23,.3],[-7,23,.3]]);g.fill();g.beginPath();blob([[-10,41,.3],[10,41,.3],[7,46,.4],[-7,46,.4]]);g.fill();
  g.fillStyle=C.ac;g.beginPath();blob([[-8,23,.3],[8,23,.3],[10,41,.3],[-10,41,.3]]);g.fill();g.fillStyle=C.ac2;g.beginPath();blob([[-8,23,.3],[0,23,.3],[-1,41,.3],[-10,41,.3]]);g.fill();
  g.restore();return [bx+58,y]}
function fish(t){const T0=4.7,T1=5.15,D=1.0,fx0=800,fy=503;
  const u=(t-T1)/D;
  // ため：水面がふくらむ
  if(t>T0&&t<T1+0.12){const k=ease((t-T0)/(T1-T0))*(1-clamp((t-T1)/0.12));g.fillStyle=C.crest;g.beginPath();blob([[fx0-46,fy+10,.5],[fx0-14,fy-2-k*13,.8],[fx0+14,fy-2-k*13,.8],[fx0+46,fy+10,.5]]);g.fill()}
  const ring=(x,t0)=>{const a=t-t0;if(a<0||a>1.6)return;for(let i=0;i<2;i++){const r=(a-i*0.22)*90;if(r<=0)continue;g.strokeStyle=`rgba(220,248,196,${0.7*(1-a/1.6)})`;g.lineWidth=4.5;g.beginPath();g.ellipse(x,fy+4,r,r*0.2,0,0,7);g.stroke()}};
  const drops=(x,t0,dir)=>{const a=t-t0;if(a<0||a>0.9)return;const r=R(Math.round(x)+3);g.fillStyle=C.foam;for(let i=0;i<9;i++){const vx=(r()-0.5+dir*0.25)*260,vy=-(170+r()*230),px=x+vx*a,py=fy+vy*a+520*a*a,s=(3+r()*4)*(1-a*0.6);if(py>fy+6)continue;const an=Math.atan2(vy+1040*a,vx);g.save();g.translate(px,py);g.rotate(an);g.beginPath();blob([[-s*1.5,0,.6],[0,-s*.7,.8],[s*1.2,0,.8],[0,s*.7,.8]]);g.fill();g.restore()}};
  ring(fx0,T1);drops(fx0,T1,1);ring(fx0+190,T1+D);drops(fx0+190,T1+D,1);
  if(u>0&&u<1){const x=fx0+190*u,y=fy-150*4*u*(1-u),an=Math.atan2(-150*4*(1-2*u),190),wg=Math.sin(t*26)*0.25;g.save();g.translate(x,y);g.rotate(an);g.scale(1.3,1.3);
    // 魚：背は暗く、腹は明るく（面を分ける）。尾は遅れて振れる
    g.save();g.translate(-30,0);g.rotate(wg);g.fillStyle='#17586e';g.beginPath();blob([[2,0,.4],[-22,-15,.4],[-16,0,.6],[-22,15,.4]]);g.fill();g.restore();
    const B=[[38,2,.5],[20,-13,.7],[-8,-12,.7],[-32,-2,.5],[-10,11,.7],[18,12,.7]];g.fillStyle='#1f7f8c';g.beginPath();blob(B);g.fill();g.save();g.beginPath();blob(B);g.clip();g.fillStyle=C.crest;g.beginPath();blob(B,-2,11);g.fill();g.fillStyle=C.foam;g.beginPath();blob(B,-3,18);g.fill();g.restore();
    g.fillStyle='#17586e';g.beginPath();blob([[6,-11,.4],[-6,-24,.5],[-12,-11,.5]]);g.fill();g.fillStyle=C.dk;g.beginPath();g.arc(25,-3,2.6,0,7);g.fill();g.restore()}}
function scene(t){
  // カメラ：ランタンに寄った所から、ゆっくり動き出して引く。目線の点は動かさない
  const z=lerp(2.5,1,ease(clamp((t-0.5)/2.9)));const L=(d,fn)=>{const k=1+(z-1)*d;g.save();g.translate(GX,GY);g.scale(k,k);g.translate(-GX,-GY);fn();g.restore()};
  const s=g.createLinearGradient(0,0,0,430);s.addColorStop(0,C.sky0);s.addColorStop(1,C.sky1);g.fillStyle=s;g.fillRect(0,0,W,H);
  L(0.15,()=>{const r=R(11);for(let i=0;i<46;i++){const x=r()*1500-110,y=r()*360-20,sz=1.4+r()*2.4,tw=0.45+0.55*Math.sin(t*(1+r()*2)+i);g.fillStyle=`rgba(190,236,216,${0.25+0.55*tw})`;g.beginPath();blob([[x-sz,y,.3],[x,y-sz,.3],[x+sz,y,.3],[x,y+sz,.3]]);g.fill()}
    // 雲：点で描いた形。下の面を暗く
    for(const c of [[250,150,1.2],[820,100,1.5],[1150,230,0.9]]){const x=c[0]-t*6,y=c[1],k=c[2],P=[[-90,10,.6],[-60,-14,.8],[-20,-10,.6],[10,-30,.8],[50,-16,.8],[92,8,.6],[40,18,.5],[-40,18,.5]].map(p=>[x+p[0]*k,y+p[1]*k,p[2]]);g.fillStyle='#1d3d7c';g.beginPath();blob(P);g.fill();g.save();g.beginPath();blob(P);g.clip();g.fillStyle='#142a60';g.beginPath();blob(P,6*k,12*k);g.fill();g.restore()}});
  L(0.35,()=>{sea(0,402,C.far,'#1d5590',t);lighthouse(t)});
  L(0.6,()=>sea(0,424,'#12507a','#1f78a0',t+3));
  let lp;L(1,()=>{sea(1,438,C.mid,'#2a9aa0',t);lp=boat(t);
    // ランタンの映りこみ：太い短い線が、ゆれながら縦に並ぶ
    g.lineCap='round';for(let i=0;i<5;i++){const yy=lp[1]+34+i*15,w=(26-i*4)*(0.7+0.3*Math.sin(t*3+i*1.3)),xx=lp[0]+Math.sin(t*1.7+i)*7;g.strokeStyle=`rgba(255,168,56,${0.75-i*0.13})`;g.lineWidth=5;g.beginPath();g.moveTo(xx-w,yy);g.lineTo(xx+w,yy);g.stroke()}g.lineCap='butt';
    sea(2,470,C.near,C.crest,t,-400,1700)});
  L(1.25,()=>{fish(t);sea(2,512,'#136a78','#6fd0aa',t+5)});
  L(1.7,()=>{sea(3,590,C.front,'#5fc9a8',t+1);blurOn(7);g.fillStyle=C.dk;g.beginPath();blob([[-80,760,.3],[-60,560,.5],[40,520,.6],[120,566,.5],[210,560,.6],[300,640,.5],[380,760,.3]]);g.fill();g.beginPath();blob([[1010,760,.3],[1090,640,.5],[1180,610,.6],[1260,560,.5],[1400,560,.4],[1400,760,.3]]);g.fill();blurOff()});
  const vg=g.createRadialGradient(W/2,H*0.5,H*0.4,W/2,H*0.5,H*0.95);vg.addColorStop(0,'rgba(6,10,40,0)');vg.addColorStop(1,'rgba(6,10,40,.5)');g.fillStyle=vg;g.fillRect(0,0,W,H)}
// ───── 漁船を大きく（13回目・作り手「アリのノウハウ〔部分塗り・一本線・図形すぎない形・デフォルメ〕を使ったのを見たい」）─────
// 12回目は物を小さく置いたので、塗り分けも線も入れる場所がなかった。**ノウハウを見せる物は、画面の中で大きく置く**。
// デフォルメの決め方：主役（ランタン）は実物より大きく／船体は短くずんぐり、へさきを高く／船室は大きく、窓は1つだけ大きく／細い物（ロープ・柱）は太い線に
function boatBig(t){
  const s=g.createLinearGradient(0,0,0,470);s.addColorStop(0,C.sky0);s.addColorStop(1,C.sky1);g.fillStyle=s;g.fillRect(0,0,W,H);
  const r=R(11);for(let i=0;i<40;i++){const x=r()*1300,y=r()*380,sz=1.6+r()*2.6,tw=0.45+0.55*Math.sin(t*(1+r()*2)+i);g.fillStyle=`rgba(190,236,216,${0.25+0.55*tw})`;g.beginPath();blob([[x-sz,y,.3],[x,y-sz,.3],[x+sz,y,.3],[x,y+sz,.3]]);g.fill()}
  for(const c of [[210,120,1.7],[1010,190,1.3]]){const x=c[0]-t*5,y=c[1],k=c[2],P=[[-90,10,.6],[-60,-14,.8],[-20,-10,.6],[10,-30,.8],[50,-16,.8],[92,8,.6],[40,18,.5],[-40,18,.5]].map(p=>[x+p[0]*k,y+p[1]*k,p[2]]);g.fillStyle='#1d3d7c';g.beginPath();blob(P);g.fill();g.save();g.beginPath();blob(P);g.clip();g.fillStyle='#142a60';g.beginPath();blob(P,6*k,12*k);g.fill();g.restore()}
  sea(0,452,C.far,'#1d5590',t);sea(1,486,'#12507a','#1f78a0',t+3);
  const bx=620,tl=t-0.28,y=520+wave(2,bx,tl)*0.7,sl=(wave(2,bx+90,tl)-wave(2,bx-90,tl))/180,rot=Math.atan(sl)*0.5;
  const tl2=t-0.62,sl2=(wave(2,bx+90,tl2)-wave(2,bx-90,tl2))/180,sw=-Math.atan(sl2)*2.2+Math.sin(t*2.1)*0.04;
  g.save();g.translate(bx,y);g.rotate(rot);g.scale(2.7,2.7);g.lineCap='round';g.lineJoin='round';
  const ln=(P,w,col)=>{g.strokeStyle=col;g.lineWidth=w;g.beginPath();P.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke()};
  const fill=(P,col)=>{g.fillStyle=col;g.beginPath();blob(P);g.fill()};
  const inside=(P,fn)=>{g.save();g.beginPath();blob(P);g.clip();fn();g.restore()};
  // ロープ（太い線）：柱の上からへさきと船尾へ。少したるんでゆれる
  const sag=3+Math.sin(t*1.6)*1.2;g.strokeStyle='#3a6aa8';g.lineWidth=2.4;g.beginPath();g.moveTo(-6,-150);g.quadraticCurveTo(52,-98+sag,104,-56);g.moveTo(-6,-150);g.quadraticCurveTo(-58,-96+sag,-96,-32);g.stroke();
  // 柱と腕（太い線。柱は下を暗く塗り分ける）
  ln([[-6,-30],[-6,-152]],7,'#16306e');ln([[-6,-30],[-6,-72]],7,'#0c1c48');ln([[-6,-136],[58,-152]],6,'#16306e');
  // 煙突と煙（煙は点で描いた形。上ほど大きく薄く）
  fill([[-70,-74,.25],[-58,-75,.25],[-57,-96,.3],[-71,-95,.3]],'#16306e');fill([[-73,-96,.3],[-55,-97,.3],[-55,-102,.4],[-73,-101,.4]],'#35c0a4');
  for(let i=0;i<4;i++){const a=((t*0.45+i*0.25)%1),px=-64-a*26+Math.sin(a*6+i)*4,py=-106-a*62,sz=5+a*13;g.fillStyle=`rgba(60,110,170,${0.75*(1-a)})`;g.beginPath();blob([[px-sz,py+sz*.3,.7],[px-sz*.5,py-sz*.8,.8],[px+sz*.4,py-sz*.6,.8],[px+sz,py+sz*.2,.7],[px,py+sz*.8,.7]]);g.fill()}
  // 船室：正面の面（明るい）と横の面（暗い）。屋根は厚い板で、下の面を暗く
  const CB=[[-86,-28,.2],[-82,-76,.3],[-22,-80,.3],[-18,-28,.2]];fill(CB,'#1f7f8c');inside(CB,()=>{fill([[-38,-20,.2],[-36,-82,.3],[-10,-82,.3],[-10,-20,.2]],'#17586e');fill([[-90,-34,.3],[-10,-36,.3],[-10,-20,.2],[-90,-20,.2]],'#145068')});
  const RF=[[-94,-76,.35],[-14,-81,.35],[-11,-92,.5],[-92,-88,.5]];fill(RF,'#8fe6b4');inside(RF,()=>fill([[-100,-80,.3],[-8,-85,.3],[-8,-70,.3],[-100,-70,.3]],'#35c0a4'));
  // 窓：大きく1つ。中を塗り分ける（明るい左下・暗い右上）。枠は太い線
  const WN=[[-76,-66,.4],[-46,-68,.4],[-45,-42,.4],[-75,-41,.4]];fill(WN,C.ac);inside(WN,()=>{fill([[-80,-52,.5],[-58,-62,.6],[-52,-36,.5],[-80,-36,.4]],C.ac2);fill([[-56,-72,.4],[-40,-72,.4],[-40,-50,.5],[-50,-58,.6]],'#e07a1c')});
  g.strokeStyle='#0c1c48';g.lineWidth=3;g.beginPath();blob(WN);g.stroke();ln([[-60,-67],[-60,-42]],3,'#0c1c48');
  ln([[-30,-66],[-30,-32]],2.6,'#0f4258');   // 横の面の戸の線
  // 網の山（船尾）：点で描いた形に、明るい面と、網目の短い線
  const NT=[[-98,-28,.4],[-94,-44,.7],[-84,-50,.7],[-74,-42,.7],[-70,-28,.4]];fill(NT,'#2a9aa0');inside(NT,()=>{fill([[-100,-46,.6],[-86,-54,.7],[-82,-40,.7],[-98,-34,.6]],'#6fd0aa');g.strokeStyle='#17586e';g.lineWidth=2;g.beginPath();g.moveTo(-92,-30);g.lineTo(-80,-46);g.moveTo(-84,-30);g.lineTo(-74,-42);g.moveTo(-96,-40);g.lineTo(-78,-32);g.stroke()});
  // 船体：短くずんぐり、へさきが高い
  const Hh=[[-104,-30,.35],[62,-34,.3],[106,-60,.45],[114,-52,.5],[94,-8,.6],[66,24,.6],[-72,24,.6],[-100,2,.6]];fill(Hh,'#1c3a80');
  inside(Hh,()=>{    g.fillStyle='#0e2058';g.beginPath();blob(Hh,-5,17);g.fill();                                                  // 下の影の面
    fill([[52,-40,.4],[120,-70,.4],[120,-20,.5],[92,14,.5],[70,10,.6],[76,-10,.7]],'#2f5fb4');   // へさきの前の面（明るい）
