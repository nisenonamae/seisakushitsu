<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="lib.js"></script>
<script>
/* ハンドルとブレーキが効きにくい（真上から）。上の道＝ふつうの舗装道路（うすい車）、下の道＝洗濯板道路（赤い車）。文字なし。
   times[1]＝「ブレーキ」の瞬間。それまではハンドル：上の車は曲がるのに、下の車はまっすぐ滑る。そこからはブレーキ：上は早く止まり、下は長く滑ってから止まる */
window.DEF={};
const LANE=[230,500];
function laneDraw(y,kind,off){g.fillStyle=kind==='paved'?'#4b5160':'#cfa86c';g.fillRect(0,y-110,W,220);
  if(kind==='paved'){g.fillStyle='#e5e7eb';for(let x=-(off%120);x<W;x+=120)g.fillRect(x,y-3,60,6)}else{for(let x=-(off%34);x<W;x+=34){g.fillStyle='rgba(120,90,55,.45)';g.fillRect(x,y-108,14,216)}}}
function carTop(x,y,ang,col,hop,alpha=1){g.save();g.globalAlpha=alpha;g.translate(x,y);g.rotate(ang);
  for(const [wx,wy,i] of [[-60,-46,0],[-60,46,1],[62,-46,2],[62,46,3]]){const up=hop&&hop[i];g.save();g.translate(wx,wy);if(i>=2)g.rotate(P._steer||0);g.fillStyle=up?'rgba(20,20,20,.3)':'#15171b';g.fillRect(-18,-9,36,18);g.restore()}
  g.fillStyle=col;g.beginPath();g.roundRect(-95,-42,190,84,20);g.fill();g.fillStyle='#bfe0f2';g.beginPath();g.roundRect(18,-34,34,68,8);g.fill();g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.roundRect(-40,-36,56,72,10);g.fill();g.restore()}
window.render=function(t){
  const tb=T(1,DUR*0.45);g.fillStyle='#b9a27a';g.fillRect(0,0,W,H);
  if(t<tb){const u=clamp(t/tb);const steer=ease((t-0.3)/0.5)*0.45;P._steer=steer;const off=t*500;
    laneDraw(LANE[0],'paved',off);laneDraw(LANE[1],'washboard',off);sfxOnce('r',0,'rattle',tb);
    // 上：曲がる
    const a1=-ease((t-0.4)/0.9)*0.5;carTop(520,LANE[0]-ease((t-0.5)/1.2)*70,a1,'#9aa3ae',null,0.85);
    // 下：ハンドルを切っても、ほとんど向きが変わらない
    const hop=[0,1,2,3].map(i=>Math.sin(t*37+i*1.7)>0.1?1:0);carTop(520,LANE[1]+3*Math.sin(t*29),-0.04+0.03*Math.sin(t*23),'#d9534f',hop);
  }else{const u=t-tb;P._steer=0;
    laneDraw(LANE[0],'paved',0);laneDraw(LANE[1],'washboard',0);
    const v0=520;const d1=Math.min(u,v0/700);const x1=180+v0*d1-0.5*700*d1*d1;            // ふつうの道：強いブレーキ
    const dec=330;const d2=Math.min(u,v0/dec);const x2=180+v0*d2-0.5*dec*d2*d2;            // 洗濯板道路：効きが弱い
    if(u<v0/dec)sfxOnce('r2',tb,'rattle',v0/dec);
    for(let x=180;x<x2;x+=34){if(((x/34)|0)%2)continue;g.fillStyle='rgba(30,30,30,.5)';g.fillRect(x,LANE[1]-48,20,6);g.fillRect(x,LANE[1]+42,20,6)}
    g.fillStyle='rgba(20,20,20,.55)';g.fillRect(180,LANE[0]-48,x1-180,5);g.fillRect(180,LANE[0]+43,x1-180,5);
    carTop(x1,LANE[0],0,'#9aa3ae',null,0.85);const moving=u<v0/dec;const hop=moving?[0,1,2,3].map(i=>Math.sin(t*37+i*1.7)>0.1?1:0):null;carTop(x2,LANE[1]+(moving?3*Math.sin(t*29):0),0,'#d9534f',hop);
    if(!moving)sfxOnce('st',tb+v0/dec,'thump');
  }
};
</script></body></html>
