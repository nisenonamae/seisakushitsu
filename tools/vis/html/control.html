<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="lib.js"></script>
<script>
/* ハンドルとブレーキが効きにくい（真上から見た洗濯板道路）
   times[1]＝「ブレーキ」と言う瞬間。それまではハンドル、そこからブレーキ */
window.DEF={};
function topRoad(off){g.fillStyle='#7f9a5a';g.fillRect(0,0,W,H);g.fillStyle='#cfa86c';g.fillRect(0,250,W,260);
  for(let x=-((off)%34);x<W;x+=34){g.fillStyle='rgba(120,90,55,.45)';g.fillRect(x,252,14,256)}
  g.strokeStyle='rgba(255,255,255,.25)';g.lineWidth=3;g.beginPath();g.moveTo(0,250);g.lineTo(W,250);g.moveTo(0,510);g.lineTo(W,510);g.stroke()}
function carTop(x,y,ang,hop){g.save();g.translate(x,y);g.rotate(ang);
  for(const [wx,wy,i] of [[-60,-46,0],[-60,46,1],[62,-46,2],[62,46,3]]){const up=hop[i];g.fillStyle=up?'rgba(20,20,20,.35)':'#15171b';g.fillRect(wx-18,wy-9,36,18);if(up){g.strokeStyle='#ffd36a';g.lineWidth=3;g.strokeRect(wx-20,wy-11,40,22)}}
  g.fillStyle='#d9534f';g.beginPath();g.roundRect(-95,-42,190,84,20);g.fill();g.fillStyle='#bfe0f2';g.beginPath();g.roundRect(18,-34,34,68,8);g.fill();g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.roundRect(-40,-36,56,72,10);g.fill();g.restore()}
function wheelUI(x,y,ang,k){g.save();g.globalAlpha=k;g.fillStyle='rgba(10,14,20,.8)';g.beginPath();g.roundRect(x-120,y-110,240,220,20);g.fill();g.translate(x,y);g.rotate(ang);g.strokeStyle='#e5e7eb';g.lineWidth=16;g.beginPath();g.arc(0,0,70,0,7);g.stroke();g.lineWidth=12;g.beginPath();g.moveTo(-66,0);g.lineTo(66,0);g.moveTo(0,0);g.lineTo(0,66);g.stroke();g.fillStyle='#e5e7eb';g.beginPath();g.arc(0,0,16,0,7);g.fill();g.restore();g.save();g.globalAlpha=k;g.fillStyle='#e5e7eb';g.font=`800 24px ${FONT}`;g.textAlign='center';g.fillText('ハンドル',x,y+98);g.restore()}
function pedalUI(x,y,press,k){g.save();g.globalAlpha=k;g.fillStyle='rgba(10,14,20,.8)';g.beginPath();g.roundRect(x-120,y-110,240,220,20);g.fill();g.save();g.translate(x+10,y+10);g.rotate(0.35*press);g.fillStyle='#9ca3af';g.fillRect(-40,-60,80,26);g.fillRect(-6,-40,12,80);g.restore();
  g.fillStyle='#374151';g.beginPath();g.ellipse(x-20+press*10,y-58+press*26,62,24,0.55,0,7);g.fill();g.fillStyle='#e5e7eb';g.font=`800 24px ${FONT}`;g.textAlign='center';g.fillText('ブレーキ',x,y+92);g.restore()}
window.render=function(t){
  const tb=T(1,DUR*0.45);sfxOnce('r',0,'rattle',DUR);
  if(t<tb){ // ハンドル
    const off=t*700;topRoad(off);const steer=ease((t-0.4)/0.6)*0.9;
    // 曲がりたい道すじ（点線）と、実際の向き
    g.strokeStyle='rgba(255,255,255,.8)';g.setLineDash([14,12]);g.lineWidth=5;g.beginPath();g.moveTo(560,380);g.quadraticCurveTo(820,380,980,270);g.stroke();g.setLineDash([]);
    if(t>0.9){g.strokeStyle='rgba(255,211,106,.9)';g.lineWidth=7;g.beginPath();g.moveTo(560,384);g.lineTo(560+ease((t-0.9)/0.5)*420,388);g.stroke()}
    const hop=[0,1,2,3].map(i=>Math.sin(t*37+i*1.7)>0.1?1:0);const ang=-0.05*steer+0.03*Math.sin(t*23);
    carTop(470,380+6*Math.sin(t*29),ang,hop);
    wheelUI(1110,140,-steer*1.4+0.06*Math.sin(t*30),eout(t/0.3));
    label(780,600,'曲がりたいのに、まっすぐ進む',back((t-0.9)/0.35),'#ffd36a',34);
  }else{ // ブレーキ
    const u=t-tb,v0=520,dec=150;const x0=200;const tu=Math.min(u,v0/dec);const xs=x0+v0*tu-0.5*dec*tu*tu;
    topRoad(0);
    // 普通の道ならここで止まる（印）
    const stopN=x0+v0*v0/(2*620);g.fillStyle='rgba(255,255,255,.9)';g.fillRect(stopN,262,8,236);label(stopN,215,'ふつうの道なら ここで止まる',back((u-0.3)/0.35),'#fff',28);
    // 途切れ途切れのスリップ跡
    for(let x=x0;x<Math.min(xs,W);x+=34){if(((x/34)|0)%2)continue;g.fillStyle='rgba(30,30,30,.55)';g.fillRect(x,328,20,6);g.fillRect(x,420,20,6)}
    const hop=[0,1,2,3].map(i=>Math.sin(t*37+i*1.7)>0.1?1:0);if(xs<W+120)carTop(Math.min(xs,W+100),380+5*Math.sin(t*29),0.02*Math.sin(t*19),hop);
    pedalUI(1110,140,ease(u/0.3),eout(u/0.3));sfxOnce('b',tb,'thump');
    label(640,600,'ブレーキを踏んでも 止まらない',back((u-0.8)/0.35),'#ffd36a',34);
  }
};
</script></body></html>
