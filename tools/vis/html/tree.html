<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000"><canvas id="c" width="1280" height="720"></canvas>
<script src="lib.js"></script><script src="comp.js"></script>
<script>
/* 絵の練習：森と大きなクスノキ（2026-11-21・14回目。作り手「録画の木のやつみたいな場面で」）。
   録画から使うのはカメラのやり方だけ（絵・構図・色は自分のもの）：
   ・目線の点を1つ決めて動かさない。前へ進むとき、まわりだけが外へ流れる（手前ほど速く）
   ・ゆっくり始めて加速し、いちばん速い所で、放射状の光の中に切り替えを隠す。次の主役は同じ目線の点に置く
   ・上下のつながりは切らずに、縦に長い1枚の絵の上をカメラが下りる（層ごとに速さを変える。着くときはなめらかに）
   絵は今日の作り方：主役を決める／点で輪郭（blob）／面で色分け（部分塗り）／短く太い一本線／デフォルメ（幹を太く短く）／色みをずらす／反対の色み（だいだい）は小鳥とミミズにだけ */
window.DEF={};
const GX=640,GY=330,T1=3.7,TP=6.6;
const K={sky0:'#e6f8c8',sky1:'#9fe0c4',hill0:'#86d4b6',hill1:'#58b89e',lf0:'#17574e',lf1:'#238a58',lf2:'#55bf52',lf3:'#b6e860',tr:'#6f3552',trL:'#a2535e',trD:'#45213f',dk:'#2a1a40',ac:'#ff9c2e',ac2:'#ffd27a',straw:'#f2e2a0',so0:'#255a5c',so1:'#184454',so2:'#0f3048',rt:'#d98a78',rtD:'#9a4f5c'};
const fill=(P,col)=>{g.fillStyle=col;g.beginPath();blob(P);g.fill()},inside=(P,fn)=>{g.save();g.beginPath();blob(P);g.clip();fn();g.restore()};
const ln=(P,w,col)=>{g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.beginPath();P.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke()};
// でこぼこのかたまり（葉の房・石）：丸を置かず、点をずらして作る
function bump(cx,cy,rx,ry,seed,n=9,rd=.8){const r=R(seed),P=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2-1.6,k=0.78+r()*0.38;P.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k,rd])}return P}
// 先へ行くほど細くなる線（根・枝）：折れ線を太さを変えながらつなぐ。len＝0〜1 で伸びる
function taper(P,w0,w1,col,len=1){g.strokeStyle=col;g.lineCap='round';const n=P.length-1,L=clamp(len)*n;for(let i=0;i<n;i++){if(L<=i)break;const u=Math.min(1,L-i),a=P[i],b=[lerp(a[0],P[i+1][0],u),lerp(a[1],P[i+1][1],u)];g.lineWidth=lerp(w0,w1,(i+0.5)/n);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}}
// ───── 場面1：森の中を前へ進む ─────
function forest(t){const u=clamp(t/T1),Z=0.05*u+2.6*Math.pow(u,4.2);
  const s=g.createLinearGradient(0,0,0,H);s.addColorStop(0,K.sky0);s.addColorStop(1,K.sky1);g.fillStyle=s;g.fillRect(0,0,W,H);
  const gl=g.createRadialGradient(GX,GY,10,GX,GY,420);gl.addColorStop(0,'rgba(255,250,200,.95)');gl.addColorStop(1,'rgba(255,250,200,0)');g.fillStyle=gl;g.fillRect(0,0,W,H);
  const cols=['#9fdcc4','#6cc4a8','#3fa08a','#237a6c','#155a58','#0c3b4a'],N=6;
  for(let i=0;i<N;i++){const d=[0.1,0.22,0.45,0.9,1.7,3.0][i],k=1+Z*d,r=R(31+i*7),gap=[60,95,150,230,330,470][i],wd=[20,30,46,70,110,170][i],col=cols[i];
    g.save();g.translate(GX,GY);g.scale(k,k);g.translate(-GX,-GY);if(i>=4)blurOn(i==4?2.5:6);
    // 地面のうねり
    const gy=[420,440,468,505,560,640][i];fill([[-700,gy+40,.4],[-200,gy-8,.7],[GX-gap,gy+6,.7],[GX,gy+16+i*2,.8],[GX+gap,gy+4,.7],[1500,gy-6,.7],[2000,gy+40,.4],[2000,1300,.2],[-700,1300,.2]],col);
    for(const sd of [-1,1]){const cnt=[5,4,4,3,2,2][i];for(let j=0;j<cnt;j++){const x=GX+sd*(gap+wd*0.4+j*(wd*2.3+r()*wd*1.4)+r()*wd),w=wd*(0.75+r()*0.5),lean=(r()-0.5)*w*0.9,by=gy+10;
      // 幹：まっすぐな棒にしない。根元が広がり、少し傾く
      fill([[x-w*.45+lean,-500,.3],[x+w*.45+lean,-500,.3],[x+w*.5+lean*.4,by-240,.6],[x+w*.62,by-60,.6],[x+w*1.05,by+8,.4],[x-w*1.0,by+8,.4],[x-w*.6,by-60,.6],[x-w*.52+lean*.4,by-240,.6]],col);
      if(i>=2&&j%2==0)taper([[x+lean*.4,by-250-r()*90],[x+sd*-w*1.6,by-330-r()*60],[x+sd*-w*2.7,by-350]],w*.34,w*.14,col)}}   // 枝（太い線）
    // 上をおおう葉のかたまり（まん中だけ空ける）
    for(const sd of [-1,1])for(let j=0;j<3;j++)fill(bump(GX+sd*(gap*1.5+j*wd*3.4+r()*60),20-i*6+r()*50-j*14,wd*3.2,wd*1.5+34,91+i*11+j*3+sd,10),col);
    blurOff();g.restore()}
  // 光のすじと白（いちばん速い所で切り替えを隠す）
  const v=clamp((t-(T1-0.55))/0.55);if(v>0){g.save();g.translate(GX,GY);const r=R(5);for(let i=0;i<34;i++){const a=r()*7,l0=40+r()*120,l1=l0+(200+r()*700)*v;g.strokeStyle=`rgba(255,252,220,${0.5*v})`;g.lineWidth=3+r()*9;g.lineCap='round';g.beginPath();g.moveTo(Math.cos(a)*l0,Math.sin(a)*l0);g.lineTo(Math.cos(a)*l1,Math.sin(a)*l1);g.stroke()}g.restore();g.fillStyle=`rgba(255,253,228,${Math.pow(v,1.6)})`;g.fillRect(0,0,W,H)}}
// ───── 場面2・3：大きなクスノキと、土の中 ─────
function world(t){const tt=t-T1,zm=1+0.32*(1-eout(clamp(tt/1.1))),pu=clamp((t-TP)/2.5),cam=470*ease(pu);
  const Lr=(d,fn)=>{g.save();g.translate(GX,GY);g.scale(zm,zm);g.translate(-GX,-GY-cam*d);fn();g.restore()};
  const s=g.createLinearGradient(0,0,0,H);s.addColorStop(0,K.sky0);s.addColorStop(1,K.sky1);g.fillStyle=s;g.fillRect(0,0,W,H);
  Lr(0.25,()=>{fill([[-300,470,.5],[-60,380,.8],[200,410,.8],[420,350,.8],[700,400,.8],[980,340,.8],[1240,390,.8],[1600,470,.5],[1600,900,.2],[-300,900,.2]],K.hill0)});
  Lr(0.5,()=>{fill([[-300,520,.5],[60,450,.8],[330,480,.8],[640,440,.8],[960,486,.8],[1220,446,.8],[1600,520,.5],[1600,1000,.2],[-300,1000,.2]],K.hill1);
    for(const b of [[150,470,90,60,3],[330,492,70,44,5],[1010,486,84,54,7],[1180,470,96,64,9]]){fill(bump(b[0],b[1],b[2],b[3],b[4]),'#3fa08a');inside(bump(b[0],b[1],b[2],b[3],b[4]),()=>fill(bump(b[0]-b[2]*.3,b[1]-b[3]*.5,b[2]*.7,b[3]*.6,b[4]+1),'#6cc4a8'))}});
  Lr(1,()=>{const sw=h=>Math.sin(t*1.3-h*0.004)*5*(1-h/560);   // 上ほど大きくゆれ、遅れる
    // 土（3層）と石
    fill([[-300,556,.4],[1600,556,.4],[1600,1400,.2],[-300,1400,.2]],K.so0);
    fill([[-300,730,.5],[120,700,.8],[420,742,.8],[760,706,.8],[1060,750,.8],[1600,712,.5],[1600,1400,.2],[-300,1400,.2]],K.so1);
    fill([[-300,900,.5],[200,880,.8],[560,916,.8],[900,872,.8],[1240,910,.8],[1600,880,.5],[1600,1400,.2],[-300,1400,.2]],K.so2);
    for(const b of [[170,676,58,34,21],[1090,640,46,28,23],[330,860,70,40,25],[1000,846,54,36,27],[1190,980,80,44,29],[110,1000,60,40,33]]){const P=bump(b[0],b[1],b[2],b[3],b[4],8,.5);fill(P,'#3f8088');inside(P,()=>{g.fillStyle='#2a6070';g.beginPath();blob(P,-7,10);g.fill();fill(bump(b[0]-b[2]*.35,b[1]-b[3]*.5,b[2]*.5,b[3]*.4,b[4]+2,7,.6),'#6fb0a8')})}
    // 根：カメラが着くのに合わせて、太い根→細い根の順に伸びる
    const rg=d=>clamp((t-TP-0.5-d)/0.9);
    const roots=[[[600,560],[540,650],[430,720],[300,770],[190,850],[130,950]],[[640,560],[650,680],[620,800],[650,920],[630,1030]],[[690,560],[770,640],[880,700],[990,790],[1090,900],[1130,1000]],[[570,560],[470,610],[350,630],[230,620]],[[715,560],[830,600],[950,596],[1060,560]]];
    roots.forEach((P,i)=>{taper(P,[44,40,44,26,26][i],5,K.rtD,rg(i*0.12)*1.0);});
    roots.forEach((P,i)=>{taper(P.map(p=>[p[0]-5,p[1]-5]),[26,24,26,14,14][i],3,K.rt,rg(i*0.12))});
    for(const q of [[[430,720],[400,800],[440,880]],[[300,770],[250,760],[180,790]],[[620,800],[540,850],[500,930]],[[650,920],[730,960],[760,1030]],[[880,700],[900,790],[860,860]],[[990,790],[1080,780],[1160,820]],[[190,850],[240,920],[220,990]]].entries())taper(q[1],9,3,K.rt,rg(0.5+q[0]*0.1));
    // ミミズ（反対の色み。太い線1本が、くねって進む）
    const wx=880+Math.sin(t*0.9)*10,W0=[];for(let i=0;i<7;i++)W0.push([wx+i*16,968+Math.sin(t*5-i*0.9)*6+i*2]);fill(bump(930,972,84,26,41,9,.7),'#0a2238');ln(W0,13,K.ac);ln(W0.slice(4),13,'#e0701c');ln(W0.slice(1,3),4,K.ac2);
    // 草の地面：上のふちは明るい面
    const GR=[[-300,566,.4],[80,548,.8],[330,560,.8],[520,552,.6],[760,552,.6],[980,562,.8],[1240,548,.8],[1600,566,.4],[1600,600,.5],[900,612,.8],[400,606,.8],[-300,600,.5]];fill(GR,'#2f9a5a');inside(GR,()=>{g.fillStyle='#8fdc5a';g.beginPath();blob(GR,0,-34);g.fill()});
    // 奥の葉のかたまり（暗い）
    for(const b of [[470,210,170,110,51],[820,200,180,120,53],[640,130,210,120,55],[330,290,120,80,57],[960,292,120,84,59]])fill(bump(b[0]+sw(b[1]),b[1],b[2],b[3],b[4],11),K.lf0);
    // 太い枝（先細りの線）
    taper([[610,330],[540,250],[450,210]],46,22,K.trD);taper([[672,330],[760,262],[850,236]],44,20,K.trD);taper([[640,340],[646,240],[632,150]],50,24,K.tr);
    // 幹：太く短く。根元が大きく広がる
    const TK=[[566,300,.5],[712,296,.5],[726,420,.6],[742,500,.6],[812,566,.4],[470,566,.4],[538,500,.6],[556,420,.6]];fill(TK,K.tr);
    inside(TK,()=>{fill([[440,280,.3],[612,280,.5],[600,400,.7],[586,500,.7],[540,580,.5],[440,580,.3]],K.trL);     // 光の当たる左の面
      fill([[684,280,.5],[840,280,.3],[840,580,.3],[742,580,.5],[706,500,.7],[694,400,.7]],K.trD);                    // 影の右の面
      fill(bump(604,356,17,26,61,8,.6),K.dk);fill(bump(600,353,10,17,63,7,.6),'#1a1030');                            // うろ（中をさらに暗く）
      ln([[578,470],[570,520]],6,K.tr);ln([[640,330],[636,384]],6,K.tr);ln([[660,330],[668,400]],6,K.trD);ln([[676,500],[690,544]],6,K.trD);ln([[560,520],[540,556]],6,K.tr)});   // 木の皮（短く太い線。端から端まで引かない）
    // しめ縄（太い線）と紙（遅れてゆれる）
    const sy=420;g.strokeStyle='#c9b46a';g.lineWidth=17;g.lineCap='round';g.beginPath();g.moveTo(552,sy-4);g.quadraticCurveTo(640,sy+26,730,sy-4);g.stroke();g.strokeStyle=K.straw;g.lineWidth=11;g.beginPath();g.moveTo(552,sy-7);g.quadraticCurveTo(640,sy+22,730,sy-7);g.stroke();
    [[592,sy+8],[640,sy+13],[688,sy+8]].forEach((p,i)=>{const a=Math.sin(t*2.2-i*0.7)*0.16;g.save();g.translate(p[0],p[1]);g.rotate(a);fill([[-7,0,.2],[7,0,.2],[9,16,.2],[1,16,.2],[4,34,.2],[-10,34,.2],[-8,18,.2],[-1,18,.2]],'#f6fbe6');fill([[1,16,.2],[9,16,.2],[4,34,.2],[-3,34,.2]],'#cfe8c8');g.restore()});
    // 手前の葉のかたまり：暗い房を奥、明るい房を手前。左上にいちばん明るい房
    for(const b of [[400,230,150,96,71,K.lf1],[880,236,150,100,73,K.lf1],[640,170,190,110,75,K.lf1],[520,150,130,84,77,K.lf2],[760,150,128,80,79,K.lf2],[380,180,110,70,81,K.lf2],[910,190,96,64,83,K.lf2],[640,100,150,80,85,K.lf2],[470,112,92,54,87,K.lf3],[366,160,60,38,89,K.lf3],[620,74,84,44,93,K.lf3]])fill(bump(b[0]+sw(b[1])*1.3,b[1],b[2],b[3],b[4],11),b[5]);
    // 小鳥（反対の色み）：枝の上。5秒すぎに、しゃがんでから跳ねる
    const hp=clamp((t-5.2)/0.7),cr=hp>0&&hp<0.25?Math.sin(hp/0.25*Math.PI):0,jy=hp>=0.25&&hp<1?Math.sin((hp-0.25)/0.75*Math.PI)*26:0,jx=hp>=0.25?ease((hp-0.25)/0.75)*30:0;
    g.save();g.translate(876+jx,540-jy+cr*3);g.scale(1.25*(1+cr*0.12),1.25*(1-cr*0.16));const BD=[[-18,-4,.7],[-4,-18,.8],[14,-14,.7],[20,-2,.6],[8,10,.8],[-10,10,.8]];fill(BD,K.ac);inside(BD,()=>{fill([[-22,-2,.6],[-2,-6,.7],[4,12,.7],[-20,14,.5]],'#e0701c');fill([[2,-22,.6],[18,-18,.6],[14,-8,.7],[4,-10,.7]],K.ac2)});
    ln([[-16,2],[-30,8]],6,'#e0701c');fill([[18,-8,.3],[30,-5,.3],[19,-1,.3]],K.dk);g.fillStyle=K.dk;g.beginPath();g.arc(11,-9,2.4,0,7);g.fill();ln([[0,10],[0,17]],2.6,K.dk);g.restore();
    // 落ちる葉：ゆれながら落ちる
    const rl=R(17);for(let i=0;i<7;i++){const a=((t*0.16+rl())%1),x=380+rl()*520+Math.sin(a*9+i)*26,y=250+a*330,an=Math.sin(a*9+i)*0.9;g.save();g.translate(x,y);g.rotate(an);fill([[-9,0,.4],[0,-5,.8],[9,0,.4],[0,5,.8]],i%2?K.lf3:K.lf2);g.restore()}});
  // 手前の草（速く動く）
  Lr(1.5,()=>{blurOn(5);for(const b of [[60,740,190,90,101],[1220,750,210,96,103],[420,790,150,60,105]])fill(bump(b[0],b[1],b[2],b[3],b[4],11),'#17574e');blurOff()});
  // 切り替えの白が晴れる
  const w=1-clamp(tt/0.5);if(w>0){g.fillStyle=`rgba(255,253,228,${w*w})`;g.fillRect(0,0,W,H)}
  const dkv=ease(pu)*0.35;const vg=g.createRadialGradient(W/2,H*0.5,H*0.4,W/2,H*0.5,H*0.95);vg.addColorStop(0,'rgba(8,30,50,0)');vg.addColorStop(1,`rgba(8,30,50,${0.2+dkv})`);g.fillStyle=vg;g.fillRect(0,0,W,H)}
window.render=function(t){g.setTransform(1,0,0,1,0,0);(t<T1?forest:world)(t)};
</script>
