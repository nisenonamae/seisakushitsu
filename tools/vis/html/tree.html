<!doctype html><meta charset="utf-8"><body style="margin:0;background:#000"><canvas id="c" width="1280" height="720"></canvas>
<script src="lib.js"></script><script src="comp.js"></script>
<script>
/* 絵の練習：森と大きなクスノキ（2026-11-21・14回目。作り手「録画の木のやつみたいな場面で」）。
   録画から使うのはカメラのやり方だけ（絵・構図・色は自分のもの）：
   ・目線の点を1つ決めて動かさない。前へ進むとき、まわりだけが外へ流れる（手前ほど速く）
   ・ゆっくり始めて加速し、いちばん速い所で、放射状の光の中に切り替えを隠す。次の主役は同じ目線の点に置く
   ・上下のつながりは切らずに、縦に長い1枚の絵の上をカメラが下りる（層ごとに速さを変える。着くときはなめらかに）
   絵は今日の作り方：主役を決める／点で輪郭（blob）／面で色分け（部分塗り）／短く太い一本線／デフォルメ（幹を太く短く）／色みをずらす／反対の色み（だいだい）は小鳥とミミズにだけ */
window.DEF={};
const GX=640,GY=300,T1=3.7,TP=6.6,DX=GX-640;
const K={sky0:'#e6f8c8',sky1:'#9fe0c4',hill0:'#86d4b6',hill1:'#58b89e',lf0:'#17574e',lf1:'#238a58',lf2:'#55bf52',lf3:'#b6e860',tr:'#6f3552',trL:'#a2535e',trD:'#45213f',dk:'#2a1a40',ac:'#ff9c2e',ac2:'#ffd27a',straw:'#f2e2a0',so0:'#255a5c',so1:'#184454',so2:'#0f3048',rt:'#d98a78',rtD:'#9a4f5c'};
const fill=(P,col)=>{g.fillStyle=col;g.beginPath();blob(P);g.fill()},inside=(P,fn)=>{g.save();g.beginPath();blob(P);g.clip();fn();g.restore()};
const ln=(P,w,col)=>{if(PERSP){w*=pk((P[0][1]+P[P.length-1][1])/2);P=P.map(p=>pw(p[0],p[1]))}g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.lineJoin='round';g.beginPath();P.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke()};
// でこぼこのかたまり（葉の房・石）：丸を置かず、点をずらして作る
function bump(cx,cy,rx,ry,seed,n=9,rd=.8){const r=R(seed),P=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2-1.6,k=0.78+r()*0.38;P.push([cx+Math.cos(a)*rx*k,cy+Math.sin(a)*ry*k,rd])}return P}
// 先へ行くほど細くなる線（根・枝）：折れ線を太さを変えながらつなぐ。len＝0〜1 で伸びる
function taper(P,w0,w1,col,len=1){if(PERSP){w0*=pk(P[0][1]);w1*=pk(P[P.length-1][1]);P=P.map(p=>pw(p[0],p[1]))}g.strokeStyle=col;g.lineCap='round';const n=P.length-1,L=clamp(len)*n;for(let i=0;i<n;i++){if(L<=i)break;const u=Math.min(1,L-i),a=P[i],b=[lerp(a[0],P[i+1][0],u),lerp(a[1],P[i+1][1],u)];g.lineWidth=lerp(w0,w1,(i+0.5)/n);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}}
// ───── 場面1：森の中を前へ進む（15回目・構図から作り直し）─────
// 構図：型＝手前の黒いわく＋V字。主役＝奥の光のすき間（まん中に置かず、右上寄りの点）。支える物＝左手前の黒い大木・右上から対角に伸びる枝。
// 目の道：左の大木 → ふちを伝って光のすき間 → 右上の枝がまたすき間を指す。空は細い逆三角だけ残す。木は全部すき間のほうへ傾ける。
// 距離は4つを一緒に変える：色み（水色→青緑→緑→黒に近い紺）／描きこみ（輪郭だけ→2色→3色と筆あと）／大きさ／光の当たるふち（手前だけ）
// 木は使い回さない：3種類（スギ・モミ・広葉樹）、高さ・幅・段の数・垂れ方・傾きを1本ずつ変え、隣どうしで大きさを倍ほど変える
const cresIn=(P,dx,dy,col)=>{g.save();g.beginPath();g.rect(-9000,-9000,18000,18000);blob(P,dx,dy);g.clip('evenodd');g.fillStyle=col;g.fillRect(-9000,-9000,18000,18000);g.restore()};
// ───── 実在の木（17回目・作り手「存在しない木になっている。特定の種類を考えて、実物をリアルに」）─────
// ジャイアントセコイアの森（シエラネバダ）に実際に生える木。描く前に、種類ごとのつくりを言葉にした（docs/notes/videos.md）。
// どの木も (x, 根元のy, 高さ, 種, T, lvl, s)。T＝色を距離に合わせて変える関数、lvl＝描きこみ（0 輪郭だけ／1 2色／2 3色と線）、s＝光の来る側
const mixc=(a,b,u)=>{const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*u).toString(16).padStart(2,'0')).join('')};
const rimIn=(P,T,s)=>{if(T.rim)inside(P,()=>cresIn(P,-s*T.rw,T.rw*.9,T.rim))};
// ホワイトファー：細い円すい。水平な枝が、等間隔の薄い段になる。先は鋭くとがる。青緑。皮は灰色
function fir(x,by,h,seed,T,lvl,s){const r=R(seed),n=6+Math.floor(r()*4),bare=(seed%3==0?0.26:0.07)+r()*.04,hw=h*(0.17+r()*.05);ln([[x,by],[x,by-h*.4]],h*.04,T('#7a5a86'));
  // 木の中にも層を作る（作り手の直し・19回目「木に必要なのはレイヤー分けによる階層分け。手前の葉の後ろに、また葉が見える」）：
  //   段ごとに、奥の枝（暗い・広い・左右に垂れる）を先に描き、その上に手前の枝（明るい・少し小さい・左右で大きさを変える）を重ねる。奥の枝の先が、手前の枝の下と横からのぞく
  const bough=(cx,cy,tw,th,sd)=>[[cx-sd*tw*.12,cy-th*.5,.5],[cx+sd*tw*.5,cy-th*.24,.8],[cx+sd*tw,cy+th*.34,.35],[cx+sd*tw*.72,cy+th*.46,.7],[cx+sd*tw*.34,cy+th*.28,.8],[cx-sd*tw*.12,cy+th*.4,.6]];
  const cb=T('#2f7f76'),cd=T('#1b5560'),cl=T('#62b49c');
  fill([[x,by-h*.97,.3],[x+hw*.5,by-h*bare,.5],[x-hw*.5,by-h*bare,.5]],lvl>=1?cd:cb);
  for(let i=0;i<n;i++){const u=i/(n-1),cy=by-h*bare-h*(0.9-bare)*u,tw=(hw*Math.pow(1-u,.85)+h*.014)*(0.95+r()*.1),th=h*(0.9-bare)/n*1.9*(1-u*.35),big=i%2?1:-1;
    for(const sd of [-1,1])fill(bough(x,cy+th*.16,tw*1.06,th,sd),lvl>=1?cd:cb);                                                    // 奥の枝
    for(const sd of [-1,1]){const k=sd==big?0.9:0.66,P=bough(x,cy-th*.1,tw*k,th*.86,sd);fill(P,cb);                                // 手前の枝
      if(lvl>=1&&sd==s)inside(P,()=>fill([[x+s*tw*.02,cy-th*.7,.6],[x+s*tw*k*1.1,cy+th*.02,.5],[x+s*tw*k*1.1,cy+th*.22,.5],[x+s*tw*.3,cy-th*.06,.7]],cl));rimIn(P,T,s)}}
  fill([[x-h*.014,by-h*.9,.4],[x,by-h*1.0,.4],[x+h*.014,by-h*.9,.4]],cb)}
// 葉のかたまり（巨木）：1つの中に層を重ねる。下に暗い面、まん中に地の色、左上に明るい面、いちばん上に小さな明るい面
function clump(cx,cy,rx,ry,seed,C,far){const P0=bump(cx+rx*.1,cy+ry*.26,rx,ry,seed,12,.85);fill(P0,C[0]);if(far)return;
  fill(bump(cx-rx*.04,cy-ry*.06,rx*.9,ry*.84,seed+1,12,.85),C[1]);fill(bump(cx-rx*.2,cy-ry*.3,rx*.62,ry*.56,seed+2,11,.85),C[2]);fill(bump(cx-rx*.32,cy-ry*.46,rx*.32,ry*.28,seed+3,9,.85),C[3])}
// 雲：上はもこもこ、下は平ら。下の面にうすい影。後ろに、透けた雲をもう1枚重ねる
function cloud(x,y,k,seed){const r=R(seed),w=120*k,h=58*k,mk=(ox,oy,sc)=>{const q=R(seed+Math.round(sc*10));return [[-w,0,.55],[-w*.82,-h*(.3+q()*.2),.9],[-w*.5,-h*(.28+q()*.1),.5],[-w*.3,-h*(.7+q()*.3),.9],[w*.02,-h*(.5+q()*.15),.5],[w*.26,-h*(.85+q()*.3),.9],[w*.56,-h*(.45+q()*.1),.55],[w*.82,-h*(.4+q()*.2),.9],[w,0,.55]].map(p=>[x+ox+p[0]*sc,y+oy+p[1]*sc,p[2]])};
  g.save();g.globalAlpha*=0.42;fill(mk(w*.34,-h*.16,1.2),'#f6fdff');g.restore();
  const P=mk(0,0,1);fill(P,'#fbfeff');inside(P,()=>{cresIn(P,0,-h*.26,'#cfe7f3');cresIn(P,-w*.02,-h*.1,'#b7d9ea')});
  const P2=mk(-w*1.05,h*.04,.34);fill(P2,'#fbfeff');inside(P2,()=>cresIn(P2,0,-h*.1,'#cfe7f3'))}
// ふちがでこぼこの密な木（シーダー＝細い柱、若いセコイア＝円すい）。wk＝幅、pw＝細くなり方
function dense(x,by,h,seed,T,lvl,s,wk,pw,cb,cl,cd,ct,tw){const r=R(seed),w=h*wk*(0.9+r()*.2);ln([[x,by],[x,by-h*.14]],h*tw,T(ct));
  const N=11,Rt=[],Lf=[];for(let k=0;k<=N;k++){const u=k/N,y=by-h*.05-h*.93*u,hw=(w*(1-Math.pow(u,pw))+h*.006)*(k%2?1.16:0.84)*(0.92+r()*.16);Rt.push([x+hw,y+(k%2?h*.012:0),k%2?.5:.8]);Lf.push([x-hw*(0.9+r()*.2),y+(k%2?h*.012:0),k%2?.5:.8])}
  const P=[[x,by-h*1.0,.6],...Rt.reverse(),...Lf];fill(P,T(cb));if(lvl>=1)inside(P,()=>{if(lvl>=2)cresIn(P,s*w*.45,-h*.02,T(cd));g.fillStyle=T(cl);g.beginPath();blob(P,s*w*1.0,-h*.025);g.fill();
    if(lvl>=2)for(let k=1;k<6;k++)ln([[x-s*w*.05,by-h*(.12+k*.14)],[x-s*w*.5,by-h*(.07+k*.14)]],Math.max(2.2,h*.008),T(cd))});rimIn(P,T,s)}
// インセンスシーダー：細く密な柱の形。葉は下まで付く。黄緑。皮は赤茶
function cedar(x,by,h,seed,T,lvl,s){dense(x,by,h,seed,T,lvl,s,0.1,1.5,'#5a9a3c','#8cc24e','#2f6a34','#9a4a3a',0.06)}
// 若いセコイア：下まで葉のある、密な円すい。先は丸い。青みのある緑。皮は赤茶
function yseq(x,by,h,seed,T,lvl,s){dense(x,by,h,seed,T,lvl,s,0.2,1.0,'#3f8f7a','#6fbf94','#256a62','#a8503c',0.07)}
// シュガーパイン：まっすぐな幹の高い所から、長い枝が腕のように水平に伸びる（左右は不ぞろい）。枝先に長い松ぼっくりが下がる
function spine(x,by,h,seed,T,lvl,s){const r=R(seed),tw=h*.04;ln([[x,by],[x,by-h*.93]],tw,T('#7a4636'));if(lvl>=1)ln([[x+s*tw*.24,by],[x+s*tw*.24,by-h*.9]],tw*.4,T('#a8644a'));
  for(let i=0;i<8;i++){const u=.48+i*.062,sd=(i%2?1:-1)*(r()<.15?-1:1),L=h*(.08+.1*r())*(1.15-(u-.48)*1.3),y=by-h*u,ex=x+sd*L,ey=y-L*.1;if(r()<.12)continue;
    taper([[x,y],[x+sd*L*.5,y-L*.02],[ex,ey]],h*.016,h*.007,T('#7a4636'));
    for(const q of [[.5,.5],[.95,.42]]){const P=bump(x+sd*L*q[0],y-L*.06*q[0]-h*.012,L*q[1]*.66,h*.036,seed+i*7+Math.round(q[0]*9),9,.7);fill(P,T('#2f7a50'));if(lvl>=1)inside(P,()=>{g.fillStyle=T('#5cae62');g.beginPath();blob(P,s*L*.08,-h*.014);g.fill()});rimIn(P,T,s)}
    if(lvl>=2&&i%2==0)ln([[ex,ey+h*.008],[ex+sd*h*.004,ey+h*.05]],Math.max(3,h*.011),T('#b08a52'))}                 // 松ぼっくり
  const P=bump(x,by-h*.95,h*.045,h*.035,seed+99,8,.7);fill(P,T('#2f7a50'));rimIn(P,T,s)}
// ポンデローサパイン：だいだい色の皮。下半分は枝が無い。枝先に、針の束が房になって付く
function ppine(x,by,h,seed,T,lvl,s){const r=R(seed),tw=h*.046;ln([[x,by],[x,by-h*.9]],tw,T('#c46a3a'));if(lvl>=1)ln([[x-s*tw*.24,by],[x-s*tw*.24,by-h*.88]],tw*.42,T('#8a4630'));
  if(lvl>=2)for(let k=0;k<5;k++)ln([[x+s*tw*.1,by-h*(.06+k*.085)],[x+s*tw*.1,by-h*(.1+k*.085)]],Math.max(2,tw*.14),T('#8a4630'));
  for(let i=0;i<9;i++){const u=.46+i*.058,sd=i%2?1:-1,L=h*(.06+.09*r())*(1.1-(u-.46)),y=by-h*u,cx=x+sd*L,cy=y-L*.5;ln([[x,y],[cx,cy]],h*.012,T('#8a4630'));
    const P=bump(cx,cy,h*(.05+r()*.02),h*.042,seed+i*5,9,.3);fill(P,T('#3a7a3e'));if(lvl>=1)inside(P,()=>{g.fillStyle=T('#74b04a');g.beginPath();blob(P,s*h*.02,-h*.02);g.fill()});rimIn(P,T,s)}
  const P=bump(x,by-h*.93,h*.055,h*.05,seed+77,9,.3);fill(P,T('#3a7a3e'));rimIn(P,T,s)}
const SPEC={f:fir,c:cedar,s:spine,p:ppine,y:yseq};
// ───── 場面1：セコイアの森の中を前へ進む ─────
// 構図は15回目のまま：型＝手前の黒いわく＋V字。主役＝奥の光のすき間（右上寄り）。支える物＝左手前の黒いモミ・右上から伸びるマツの大枝
function forest(t){const u=clamp(t/T1),Z=0.05*u+2.6*Math.pow(u,4.2);
  const s0=g.createLinearGradient(0,0,0,H);s0.addColorStop(0,'#8fe2f2');s0.addColorStop(0.6,'#d6f7ee');s0.addColorStop(1,'#bfeede');g.fillStyle=s0;g.fillRect(0,0,W,H);
  const gl=g.createRadialGradient(GX,GY,10,GX,GY,380);gl.addColorStop(0,'rgba(255,252,214,.95)');gl.addColorStop(1,'rgba(255,252,214,0)');g.fillStyle=gl;g.fillRect(0,0,W,H);
  // 距離：奥ほど、空の水色に寄せる（色みごと変わる）。手前2層だけ、光の当たるふち。いちばん手前は黒に近い紺
  const FOG=['#a9e6ee','#86d8ea','#6ccbdc','#5cc0c8','#58b8a8'],FA=[0.86,0.7,0.48,0.26,0.06],D=[0.1,0.22,0.45,0.9,1.7,3.0],LV=[0,0,1,2,2,0],GC=['#a9e6ee','#7dd2e2','#4fb4b4','#2f8f78','#256c44','#0b2233'];
  const mkT=i=>{const T=i==5?(()=>'#0b2233'):(c=>mixc(c,FOG[i],FA[i]));if(i==4){T.rim='#e9f2a0';T.rw=2.4}if(i==5){T.rim='#f2dc8c';T.rw=5}return T};
  // 木の置き方：[種類, x, 根元のy, 高さ, 種]。f＝モミ c＝シーダー s＝シュガーパイン p＝ポンデローサ y＝若いセコイア。左右で数も大きさも変える
  const TR=[
   [['f',540,372,120,1],['f',450,376,210,2],['f',730,372,170,3],['f',370,382,150,4],['f',810,380,240,5],['f',900,386,190,6],['f',270,390,200,7],['f',1000,392,280,8],['f',150,394,170,9]],
   [['f',500,410,260,11],['f',750,404,300,12],['f',320,416,250,13],['f',860,414,210,14],['f',180,422,400,15],['f',1040,422,310,16],['f',10,426,200,17]],
   [['f',440,452,470,21],['f',810,446,320,22],['f',250,460,300,23],['f',970,456,520,24],['f',70,464,370,25],['f',1130,466,240,26]],
   [['f',370,508,460,31],['f',890,500,700,32],['f',130,518,640,33],['f',1080,512,430,34],['f',750,494,230,35]],
   [['f',1030,610,940,41],['f',180,616,700,42],['f',360,590,300,43]],
   [['f',-60,900,1500,51]]];
  const GAP=[0,0,0,40,60,0],FH=[[60,120],[80,160],[120,230],[160,300],[210,380]],FS=[22,30,44,64,104],MIX='f';
  for(let i=0;i<6;i++){const k=1+Z*D[i],T=mkT(i);g.save();g.translate(GX,GY);g.scale(k,k);g.translate(-GX,-GY);
    const gy=[378,408,446,494,574,700][i];fill([[-900,gy-30-i*8,.4],[GX-260-i*40,gy-6,.7],[GX-20,gy+14+i*3,.8],[GX+240+i*30,gy+2,.7],[2200,gy-46-i*10,.4],[2200,1600,.2],[-900,1600,.2]],GC[i]);
    if(i<5){const r=R(200+i);for(let x=-260;x<1560;x+=FS[i]*(0.7+r()*0.6)){const dx=Math.abs(x-GX);if(dx<GAP[i]){r();r();r();continue}let h=FH[i][0]+r()*(FH[i][1]-FH[i][0]);const by=gy+6+r()*10+i*2-(dx>300?10:0);if(dx<120)h=Math.min(h,by-GY-34+dx*0.5);const sp=MIX[Math.floor(r()*MIX.length)];if(h>30)fir(x,by,h,300+i*50+Math.round(x),c=>T(c),Math.min(LV[i],1),x<GX?1:-1)}}
    for(const q of TR[i])SPEC[q[0]](q[1],q[2],q[3],q[4],T,LV[i],q[1]<GX?1:-1);
    if(i==5){ // 右上から伸びるシュガーパインの大枝：上のふちに光。枝先に長い松ぼっくり
      const BR=[[1600,-70],[1330,20],[1130,96],[1000,150]];taper(BR.map(p=>[p[0]-2,p[1]-6]),70,22,T.rim);taper(BR,70,22,'#0b2233');
      for(const b of [[1390,10,240,150],[1210,96,180,110],[1480,-80,260,150],[1060,160,110,70]]){const cx=b[0],cy=b[1],tw=b[2]/2,th=b[3];const P=[[cx-tw,cy+th*.5,.45],[cx-tw*.55,cy-th*.05,.8],[cx-tw*.1,cy-th*.4,.6],[cx+tw*.2,cy-th*.42,.6],[cx+tw*.7,cy-th*.1,.8],[cx+tw,cy+th*.4,.45],[cx+tw*.45,cy+th*.3,.8],[cx,cy+th*.5,.7],[cx-tw*.42,cy+th*.34,.8]];fill(P,'#0b2233');inside(P,()=>cresIn(P,2,6,T.rim))}
      }
    g.restore()}
  // 鳥は3羽（奇数）。すき間の上を横切る
  for(let i=0;i<3;i++){const bx=GX-70+i*46+t*16,by=GY-150-i*17+Math.sin(t*2+i)*4,fl=Math.sin(t*9+i*2)*5;ln([[bx-9,by-fl],[bx,by],[bx+9,by-fl]],3,'#1b5a6a')}
