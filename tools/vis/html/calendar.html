<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="lib.js"></script>
<script>
/* 年月がたつ：めくりカレンダーが from 年から to 年まで、だんだん速くめくれる */
window.DEF={from:1963,to:2007};
window.render=function(t){
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#3b4656');bg.addColorStop(1,'#1b222c');g.fillStyle=bg;g.fillRect(0,0,W,H);
  const u=ease(t/Math.max(0.8,DUR*0.8));const yr=Math.round(lerp(P.from,P.to,u));if(window._y!==yr){window._y=yr;window.SFX.push([t,'tick'])}
  const x=640,y=380;g.fillStyle='#e5e7eb';g.beginPath();g.roundRect(x-230,y-200,460,400,18);g.fill();g.fillStyle='#c0392b';g.beginPath();g.roundRect(x-230,y-200,460,90,[18,18,0,0]);g.fill();
  for(const rx of [-120,120]){g.fillStyle='#4b5563';g.beginPath();g.arc(x+rx,y-200,14,0,7);g.fill()}
  g.fillStyle='#111827';g.font=`900 150px ${FONT}`;g.textAlign='center';g.textBaseline='middle';g.fillText(String(yr),x,y+50);
  // めくれる紙
  for(let i=0;i<6;i++){const f=((t*Math.max(1.5,u*10))+i/6)%1;if(u>=1)break;g.save();g.translate(x+f*380*(i%2?1:-1),y-110-f*300);g.rotate(f*(i%2?1.2:-1.2));g.globalAlpha=0.8*(1-f);g.fillStyle='#f3f4f6';g.fillRect(-90,-60,180,120);g.restore()}
};
</script></body></html>
