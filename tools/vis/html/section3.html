 plow      … 回らない斜めの板を引きずる。遅いうちは平らな跡 → times[1] で速くなると板が跳ね、後ろに波
 loop      … 波 → 揺れ → 波 の輪。times[1] 波から車へ、[2] 車から波へ、[3] もう一周（太く）、[4] ぐるぐる回り続ける
 twospeeds … 上は遅い車（大きく揺れる）、下は速い車（山のてっぺんをなぞる）。times[1] で下の道の山が着地のたびに高くなる
 advice    … 速度計の針が下がって、ゆっくりの範囲（緑）に入る
 seesaw    … シーソー：片方に車、もう片方に道。車が楽になるほど道の波が大きくなり、逆も同じ
 crawl     … 波打った道を、車がそっと這うように越えていく。揺れない
 delay     … 上は粗い道、下は滑らかな道。同じように車が通っても、下の道は波が出るのが遅い
 active    … 波の上を走る車。最初は車体が揺れる → times[1] で車輪のまわりが光り、車輪だけが上下して車体は揺れない

   for(const [k,tt] of [['a',t1],['b',t2],['c',t3],['d',t4]])if(t>=tt)sfxOnce(k,tt,'whoosh');
   if(stage>=1)sfxOnce('r',t1,'rattle',DUR-t1);
 }
 else if(m==='twospeeds'){
   const t1=T(1,DUR*0.5);const lam=200;
   const offA=t*90,offB=t*520;const growB=t>t1?clamp((t-t1)/(DUR-t1)):0;
   // 上：遅い車（谷に落ちて大きく揺れる）
   {const topA=x=>300-20*Math.max(0,Math.sin(2*Math.PI*(x+offA)/lam));lane(0,360,topA,()=>{const cx=640;const fy=topA(cx+112),ry=topA(cx-110);const bob=((fy+ry)/2-300)*1.3;car(cx,300-34+bob,1,{heads:5,t,wheelR:34,wheelAng:offA/34,wheelLift:[300-ry,300-fy].map(v=>v*0.4)})},t>t1?ease((t-t1)/0.5):0)}
   // 下：速い車（てっぺんをなぞる）。後半は着地のたびに山が高くなる
   {const A=20+16*growB;const topB=x=>660-A*Math.max(0,Math.sin(2*Math.PI*(x+offB)/lam));lane(360,360,topB,()=>{const cx=640;car(cx,660-A-34+1.5*Math.sin(t*20),1,{heads:0.6,t,col:'#2f5d9f',wheelR:34,wheelAng:offB/34});
       if(growB>0){const ph=((cx+112+offB)%lam)/lam;const f=Math.max(0,1-Math.abs(ph-0.25)/0.12);if(f>0)glowAt(cx+112,660-A,f*0.8);const f2=Math.max(0,1-Math.abs((((cx-110+offB)%lam)/lam)-0.25)/0.12);if(f2>0)glowAt(cx-110,660-A,f2*0.8)}})}
   g.fillStyle='#10151b';g.fillRect(0,357,W,6);sfxOnce('r',0,'rattle',DUR);
 }
 else if(m==='advice'){
   dash();const v=t<0.4?34:lerp(34,13,ease((t-0.4)/1.6))+0.5*Math.sin(t*2.5);
   g.fillStyle='#1a1f26';g.beginPath();g.roundRect(240,60,800,600,60);g.fill();g.strokeStyle='#3a414c';g.lineWidth=6;g.stroke();
   const cx=640,cy=360,Rr=250,a0=Math.PI*0.75,a1=Math.PI*2.25,ang=v=>a0+(a1-a0)*clamp(v/40);
   speedo(cx,cy,Rr,v,{vmax:40,step:10});
   const k=ease((t-1.6)/0.6);if(k>0){g.strokeStyle=`rgba(74,222,128,${0.9*k})`;g.lineWidth=Rr*0.07;g.beginPath();g.arc(cx,cy,Rr*0.95,ang(0),ang(16));g.stroke();sfxOnce('g',1.6,'pop')}
 }
 else if(m==='seesaw'){
   sky2();layers(x=>BASE+60);const th=0.2*Math.sin(2*Math.PI*(t/DUR*1.5)-Math.PI/2);   // th>0：左（車）が上がる
   const comfy=clamp(0.5+th/0.4),rough=comfy;const px=640,py=BASE-10;
   g.fillStyle='#6b5b4a';g.beginPath();g.moveTo(px,py-30);g.lineTo(px-60,BASE+62);g.lineTo(px+60,BASE+62);g.closePath();g.fill();
   g.save();g.translate(px,py-30);g.rotate(-th);g.fillStyle='#8a6a46';g.beginPath();g.roundRect(-470,-12,940,24,10);g.fill();
   // 左：車（楽なほど揺れない）
   const sh=6*(1-comfy);const [sx,sy]=shake(t,sh);car(-330+sx,-12-34+sy,0.75,{heads:sh*0.8,t,wheelR:25,wheelAng:0});
   // 右：道の切れ端（車が楽なほど、波が大きい）
   g.save();g.translate(330,-12);const A=4+28*rough;g.beginPath();g.moveTo(-130,0);for(let x=-130;x<=130;x+=4)g.lineTo(x,-40-A*Math.max(0,Math.sin(2*Math.PI*x/65)));g.lineTo(130,0);g.closePath();g.fillStyle=sandPat();g.fill();g.strokeStyle='rgba(255,236,200,.85)';g.lineWidth=3;g.stroke();g.restore();
   g.restore();
   const q=Math.floor(t/(DUR/3));if(q!==S.q){S.q=q;window.SFX.push([t,'thump'])}
 }
 else if(m==='crawl'){
   sky2();const lam=170,A=26;const top=x=>BASE-A*Math.max(0,Math.sin(2*Math.PI*x/lam));layers(top);
   const cx=lerp(-120,W+60,clamp(t/DUR));const fy=top(cx+112),ry=top(cx-110);const bob=((fy+ry)/2-BASE)*0.5;
   car(cx,BASE-34+bob,1,{heads:0,t,wheelR:34,wheelAng:cx/34,wheelLift:[BASE-ry,BASE-fy]});
   sfxOnce('e',0,'engine',DUR);
 }
 else if(m==='delay'){
   const per=2.4;
   for(const [y0,rough,start] of [[0,1,0.15],[360,0,0.62]]){const gy=y0+300;const g0=clamp((t/DUR-start)/0.3);const A=40*ease(g0);
     const top=x=>gy-(rough?3*Math.sin(x/6)+2*Math.sin(x/2.3):0)-A*Math.max(0,Math.sin(2*Math.PI*x/180));
     lane(y0,360,top,()=>{if(!rough){g.fillStyle='rgba(255,250,235,.35)';g.fillRect(0,gy-6,W,10)}
       for(let i=0;i<3;i++){const q=((t/per)+i/3)%1;const cx=lerp(-200,W+200,q);car(cx,gy-34*0.7-A*0.5,0.7,{heads:A/8,t,wheelR:24,wheelAng:cx/24,col:['#c0392b','#2f5d9f','#e6e2d8','#7a8f3c'][i]})}})}
   g.fillStyle='#10151b';g.fillRect(0,357,W,6);sfxOnce('c',0,'car',DUR);
 }
 else if(m==='active'){
   const t1=T(1,DUR*0.4);const on=ease((t-t1)/0.6);sky2();const lam=200,A=24;const off=t*300;const top=x=>BASE-A*Math.max(0,Math.sin(2*Math.PI*(x+off)/lam));layers(top);
   const cx=640;const fy=top(cx+112),ry=top(cx-110);const bob=((fy+ry)/2-BASE+A/2)*1.4*(1-on);const [sx,sy]=shake(t,5*(1-on));
   car(cx+sx,BASE-A/2-34+bob+sy,1,{heads:5*(1-on),t,wheelR:34,wheelAng:off/34,noWheels:true});
   tire(cx-110,ry-34,34,off/34);tire(cx+112,fy-34,34,off/34);
   if(on>0){sfxOnce('o',t1,'pop');for(const wx of [cx-110,cx+112]){const wy=(wx<cx?ry:fy)-34;const p=0.5+0.5*Math.sin(t*8);g.strokeStyle=`rgba(125,211,252,${on*(0.55+0.4*p)})`;g.lineWidth=6;g.shadowColor='#7dd3fc';g.shadowBlur=18;g.beginPath();g.arc(wx,wy,46+4*p,0,7);g.stroke();g.shadowBlur=0}}
   sfxOnce('r',0,'rattle',t1);sfxOnce('e',t1,'engine',DUR-t1);
 }
 else if(m==='deflate'){
   const t1=T(1,DUR*0.35);const sq=ease((t-t1)/1.0);sky2();const off=t*140;const lam=240;
   const top=x=>BASE-10*Math.max(0,Math.sin(2*Math.PI*(x+off)/lam));layers(top);
   const wx=640,r=180;const ph=((wx+off)%lam)/lam;const lift=lerp(26,6,sq)*4*ph*(1-ph);const flat=34*sq;const cy=top(wx)-r-lift+flat;
   g.save();g.beginPath();g.rect(0,0,W,top(wx)-lift+2);g.clip();tire(wx,cy,r,off/r);g.restore();
   // つぶれて広がった接地（ふくらみ）
   if(sq>0){const yb=top(wx)-lift;const half=Math.sqrt(Math.max(0,r*r-(r-flat)*(r-flat)));g.fillStyle='#1b1d22';g.beginPath();g.ellipse(wx,yb-2,half+10*sq,10*sq+3,0,Math.PI,0);g.fill();g.fillRect(wx-half-10*sq,yb-4,2*(half+10*sq),6)}
   // バルブから空気
   if(t>t1&&t<t1+1.4){sfxOnce('p',t1,'puff');const r2=R(8);const a=off/r-Math.PI/3;const vx=wx+r*0.62*Math.cos(a),vy=cy+r*0.62*Math.sin(a);for(let i=0;i<14;i++){const d=((t-t1)*1.4+r2())%1;g.fillStyle=`rgba(255,255,255,${0.6*(1-d)})`;g.beginPath();g.arc(vx+(r2()-0.3)*80*d+30*d,vy-60*d+(r2()-0.5)*30,4+10*d,0,7);g.fill()}}
 }
};
