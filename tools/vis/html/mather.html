<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="lib.js"></script>
<script>
/* メイザーの円い溝の実験（斜め上から）。mode：
 intro … times[1..4]＝「砂を敷き」「真ん中から伸びた棒」「小さな車輪」「手で押して」の瞬間に、溝→砂→棒→車輪→手 の順に組み上がる
 hand  … 手で押して回し続けると、小さな波が少しずつ現れる
 build … times[1..3]＝「モーター」「ばね」「回った数」：速度計が加速／車輪をばねで押さえる／回数の表示が増える
 speed … ゆっくり回すと轍だけ → times[1]（「ところが」）から速くなり、赤い所を越えた所で1か所に波が生まれ、広がって育つ */
window.DEF={mode:'intro'};
const CX=600,CY=420,RX=470,RY=165,TH=50;
const rg=R(21);const grains=[...Array(1500)].map(()=>({a:rg()*Math.PI*2,r:0.62+rg()*0.33,l:rg()}));
function E(a,r,h=0){return [CX+RX*r*Math.cos(a),CY+RY*r*Math.sin(a)-h]}
let ang=0,lastT=0,amp=new Float32Array(96),rut=0,laps=0;
function init(){ang=0;lastT=0;amp=new Float32Array(96);rut=0;laps=0}
function trough(fill,show){if(show<=0)return;g.save();g.globalAlpha=clamp(show);
  g.fillStyle='#5b4636';g.beginPath();g.ellipse(CX,CY+TH,RX*1.04,RY*1.04,0,0,Math.PI);g.lineTo(CX-RX*1.04,CY);g.ellipse(CX,CY,RX*1.04,RY*1.04,0,Math.PI,0,true);g.closePath();g.fill();
  g.fillStyle='#7a5f49';g.beginPath();g.ellipse(CX,CY,RX*1.04,RY*1.04,0,0,7);g.fill();
  g.fillStyle='#3d2f25';g.beginPath();g.ellipse(CX,CY+8,RX*0.97,RY*0.97,0,0,7);g.fill();
  if(fill>0){g.globalAlpha=clamp(show)*clamp(fill);g.fillStyle='#d2ab70';g.beginPath();g.ellipse(CX,CY+8*(1-fill),RX*0.97,RY*0.97,0,0,7);g.fill();
    for(const p of grains){const [x,y]=E(p.a,p.r);g.fillStyle=p.l<.5?'rgba(140,105,60,.5)':'rgba(245,225,180,.6)';g.fillRect(x,y,2.6,1.8)}}
  g.globalAlpha=clamp(show);g.fillStyle='#7a5f49';g.beginPath();g.ellipse(CX,CY,RX*0.6,RY*0.6,0,0,7);g.fill();g.fillStyle='#5b4636';g.beginPath();g.ellipse(CX,CY,RX*0.6,RY*0.6,0,0,Math.PI);g.fill();
  g.restore()}
function ripples(){ // 波：放射状の明暗の帯（振れ幅 amp[k]）
  const K=amp.length;for(let k=0;k<K;k++){const a0=2*Math.PI*k/K,a1=2*Math.PI*(k+0.5)/K,A=amp[k];if(A<0.02)continue;
    for(const [b0,b1,c] of [[a0,a0+(a1-a0)*0.55,`rgba(110,80,45,${0.75*A})`],[a0+(a1-a0)*0.55,a1+0.02,`rgba(255,238,200,${0.6*A})`]]){
      const p=[E(b0,0.63),E(b0,0.96),E(b1,0.96),E(b1,0.63)];g.fillStyle=c;g.beginPath();g.moveTo(...p[0]);for(const q of p.slice(1))g.lineTo(...q);g.fill()}}
  if(rut>0.02){g.strokeStyle=`rgba(95,68,40,${0.75*rut})`;g.lineWidth=RY*0.12;g.beginPath();g.ellipse(CX,CY,RX*0.8,RY*0.8,0,0,7);g.stroke()}}
function wheelAt(a,lift=0,spin=0){const [x,y]=E(a,0.8,lift);const k=RY/RX,r=40,th=16;
  g.strokeStyle='#c7ccd3';g.lineWidth=8;g.lineCap='round';g.beginPath();g.moveTo(CX,CY-46);g.lineTo(x,y-r);g.stroke();
  const ux=-Math.sin(a),uy=Math.cos(a)*k,nx=Math.cos(a)*th,ny=Math.sin(a)*k*th;   // 接線（車輪の向き）と、軸の向き
  const face=(ox,oy,col)=>{g.save();g.setTransform(ux*r,uy*r,0,-r,x+ox,y-r+oy);g.fillStyle=col;g.beginPath();g.arc(0,0,1,0,7);g.restore();g.fill()};
  // 見ている人の側の面を最後に描く（台の手前なら外側の面、奥なら内側の面）
  const sg=Math.sin(a)>=0?1:-1;
  for(let k=0;k<=12;k++){const q=sg*(k/12-0.5);face(nx*q,ny*q,k===12?'#262a31':'#15171b')}
  g.save();g.setTransform(ux*r,uy*r,0,-r,x+sg*nx/2,y-r+sg*ny/2);g.fillStyle='#3a3f48';g.beginPath();g.arc(0,0,0.72,0,7);g.fill();g.fillStyle='#7d8590';g.beginPath();g.arc(0,0,0.34,0,7);g.fill();g.strokeStyle='#4b5260';g.lineWidth=0.07;for(let i=0;i<5;i++){const q=spin+i*Math.PI*2/5;g.beginPath();g.moveTo(0,0);g.lineTo(0.32*Math.cos(q),0.32*Math.sin(q));g.stroke()}g.restore();
  return [x,y]}
function hub(){g.fillStyle='#9aa3ae';g.fillRect(CX-8,CY-50,16,50);g.fillStyle='#d1d5db';g.beginPath();g.ellipse(CX,CY-50,14,6,0,0,7);g.fill()}
function hand(x,y){g.fillStyle='#e9b796';g.beginPath();g.ellipse(x,y-34,26,18,-0.3,0,7);g.fill();g.fillStyle='#d9a07d';g.fillRect(x-40,y-46,22,18)}
function stepSim(t,speed,mode){const dt=Math.max(0,t-lastT);lastT=t;const da=speed*dt;ang+=da;laps+=da/(2*Math.PI);
  const k=((ang%(2*Math.PI))+2*Math.PI)%(2*Math.PI)/(2*Math.PI)*amp.length|0;return [da,k]}
function storyRender(t){
  const T1=T(1,1),T2=T(2,2),T3=T(3,3),T4=T(4,4),T5=T(5,6),T6=T(6,8),T7=T(7,10),T8=T(8,12),T9=T(9,14);
  let sp=0;if(t>T4&&t<T6)sp=0.9;else if(t>=T7&&t<T8)sp=0.8;else if(t>=T8)sp=0.8+3.4*ease((t-T8)/Math.max(0.8,T9-T8+0.8));
  const [da]=stepSim(t,sp);
  if(t>T5&&t<T6)for(let i=0;i<amp.length;i++)amp[i]=0.3*clamp((t-T5)/1.5)*(0.5+0.5*Math.sin(i*1.9));
  if(t>=T6&&t<T7){for(let i=0;i<amp.length;i++)amp[i]*=0.9;rut*=0.9}   // 新しい装置：砂をならし直す
  if(t>=T7&&t<T8)rut=Math.min(1,rut+da*0.12);
  if(t>T9){const born=Math.floor(amp.length*0.15),age=t-T9;const spread=Math.min(amp.length,Math.floor(age*14));for(let i=0;i<spread;i++){const j=(born+i)%amp.length;amp[j]=Math.min(1,amp[j]+da*0.25*(1+0.5*Math.sin(j*0.7)))}sfxOnce('w',T9,'pop')}
  trough(ease((t-T1)/0.9),ease(t/0.5));
  if(t<T1+0.6){const k=back((t-0.2)/0.35);if(k>0){g.strokeStyle='#ffd36a';g.lineWidth=4;g.beginPath();g.moveTo(CX-RX,CY+RY+80);g.lineTo(CX+RX,CY+RY+80);g.stroke();label(CX,CY+RY+80,'約60cm',k,'#ffd36a',30);sfxOnce('d',0.2,'tick')}}
  if(t>T1)sfxOnce('s',T1,'puff');
  if(t>T1)ripples();
  const a=Math.PI*0.35+ang;const back_=Math.sin(a)<0;   // 奥にいるときは、車輪を先に描いて真ん中の柱の後ろに隠す
  if(t>T2&&!(back_&&t>=T3))hub();
  if(t>T2&&t<T3){const u=eout((t-T2)/0.5);const [x,y]=E(a,0.8*u);g.strokeStyle='#c7ccd3';g.lineWidth=8;g.beginPath();g.moveTo(CX,CY-46);g.lineTo(x,y-40);g.stroke();sfxOnce('r',T2,'tick')}
  if(t>=T3){sfxOnce('wl',T3,'pop');wheelAt(a,0,ang*4);if(back_)hub()}
  if(t>T6){const k=eout((t-T6)/0.4);g.save();g.globalAlpha=k;g.fillStyle='#374151';g.beginPath();g.roundRect(CX-50,CY-118,100,70,12);g.fill();g.fillStyle='#4b5563';g.fillRect(CX-40,CY-108,80,12);g.restore();sfxOnce('m',T8,'motor',Math.max(1,DUR-T8),0)}
  if(t>T7-0.2){const k=eout((t-T7+0.2)/0.4);speedo(1110,160,115*k,sp*7,{vmax:30,step:10,plain:true,mark:(0.8+3.4*ease((T9-T8)/Math.max(0.8,T9-T8+0.8)))*7})}
}
window.render=function(t){
  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#33404f');bg.addColorStop(1,'#171d25');g.fillStyle=bg;g.fillRect(0,0,W,H);
  g.fillStyle='#4a3a2e';g.fillRect(0,600,W,120);
  const m=P.mode;
  if(m==='story'){g.fillStyle='#4a3a2e';g.fillRect(0,600,W,120);storyRender(t);return}
  if(m==='intro'){
    const t1=T(1,1.2),t2=T(2,2.2),t3=T(3,3.0),t4=T(4,3.8);
    trough(ease((t-t1)/0.9),ease(t/0.5));
    if(t<t1+0.8){const k=back((t-0.3)/0.35);if(k>0){g.strokeStyle='#ffd36a';g.lineWidth=4;g.beginPath();g.moveTo(CX-RX,CY+RY+70);g.lineTo(CX+RX,CY+RY+70);g.stroke();label(CX,CY+RY+70,'直径 約60cm',k,'#ffd36a',34);sfxOnce('d',0.3,'pop')}}
    if(t>t1)sfxOnce('s',t1,'puff');
    if(t>t2)hub();
    const a=Math.PI*0.35+(t>t4?(t-t4)*1.1:0);
    if(t>t2){const u=eout((t-t2)/0.5);const [x,y]=E(a,0.8*u);g.strokeStyle='#c7ccd3';g.lineWidth=7;g.beginPath();g.moveTo(CX,CY-38);g.lineTo(x,y-18);g.stroke();sfxOnce('r',t2,'tick')}
    if(t>t3){sfxOnce('w',t3,'pop');const [x,y]=wheelAt(a);if(t>t4){const [hx,hy]=E(a,0.5);hand(hx,hy);sfxOnce('h',t4,'whoosh')}}
  }else if(m==='hand'){
    const [da,k]=stepSim(t,1.1);for(let i=0;i<amp.length;i++){const grow=0.35*clamp(t/Math.max(1,DUR*0.8));const pat=0.5+0.5*Math.sin(i*1.9);amp[i]=grow*pat}
    trough(1,1);ripples();hub();const [x,y]=wheelAt(ang+Math.PI*0.35);const [hx,hy]=E(ang+Math.PI*0.35,0.5);hand(hx,hy);
  }else if(m==='build'){
    const t1=T(1,0.3),t2=T(2,2.0),t3=T(3,3.6);
    const sp=t<t1?0:1.5+4.5*ease((t-t1)/1.5)*(t<t2?1:1-0.3*ease((t-t2)/1));stepSim(t,sp);
    trough(1,1);ripples();hub();
    if(t>t1){g.fillStyle='#374151';g.beginPath();g.roundRect(CX-46,CY-110,92,64,10);g.fill();g.fillStyle='#9ca3af';g.font=`800 22px ${FONT}`;g.textAlign='center';g.fillText('モーター',CX,CY-72);sfxOnce('m',t1,'motor',Math.max(1,DUR-t1))}
    const [x,y]=wheelAt(ang+Math.PI*0.35);
    if(t>t1){const k=eout((t-t1)/0.4);speedo(1110,170,120*k,sp*9,{vmax:30,step:10,plain:true})}
    if(t>t2){const k=eout((t-t2)/0.35);sfxOnce('sp',t2,'pop');const bx=170,by=170;g.save();g.globalAlpha=k;g.fillStyle='rgba(10,14,20,.88)';g.beginPath();g.roundRect(bx-140,by-140,280,300,20);g.fill();
      const c=Math.sin((t-t2)*9)*6;g.strokeStyle='#c7ccd3';g.lineWidth=8;g.beginPath();g.moveTo(bx-120,by-60);g.lineTo(bx+20,by+30+c);g.stroke();
      g.strokeStyle='#e5e7eb';g.lineWidth=5;g.beginPath();for(let i=0;i<=9;i++){g.lineTo(bx+20+(i%2?12:-12),by-100+i*(12+c/9))}g.stroke();g.fillStyle='#9ca3af';g.fillRect(bx-10,by-112,60,10);
      tire(bx+20,by+60+c,34,t*3);g.fillStyle='#d2ab70';g.fillRect(bx-130,by+94,260,50);arrowLine(bx+80,by-110,bx+80,by-40,'#ffd36a',5);g.restore()}
    if(t>t3){const k=eout((t-t3)/0.3);const n=Math.floor(laps);if(window._ln!==n){window._ln=n;if(t>t3)window.SFX.push([t,'tick'])}g.globalAlpha=k;g.fillStyle='#0b0f14';g.beginPath();g.roundRect(990,330,240,110,14);g.fill();g.fillStyle='#7dd3fc';g.font=`800 60px ${FONT}`;g.textAlign='center';g.fillText(String(n).padStart(4,'0'),1110,404);g.fillStyle='#e5e7eb';g.font=`800 24px ${FONT}`;g.fillText('回った数',1110,470);g.globalAlpha=1}
  }else{ // speed
    const t1=T(1,DUR*0.4),thr=T(2,t1+1.6);
    const sp=t<t1?0.7:0.7+2.4*ease((t-t1)/Math.max(0.6,thr-t1+0.6));
    const [da,k]=stepSim(t,sp);
    if(t<t1)rut=Math.min(1,rut+da*0.12);
    if(t>thr){ // 1か所で生まれ、走る向き（先）へ広がり、育つ
      const born=Math.floor(amp.length*0.15),age=t-thr;const spread=Math.min(amp.length,Math.floor(age*14));
      for(let i=0;i<spread;i++){const j=(born+i)%amp.length;amp[j]=Math.min(1,amp[j]+da*0.25*(1+0.5*Math.sin(j*0.7)))}
      sfxOnce('w',thr,'pop')}
    trough(1,1);ripples();hub();g.fillStyle='#374151';g.beginPath();g.roundRect(CX-46,CY-110,92,64,10);g.fill();
    wheelAt(ang+Math.PI*0.35);sfxOnce('m',0,'motor',DUR);
    speedo(1110,170,120,sp*9,{vmax:30,step:10,plain:true,mark:(0.7+2.4*ease((thr-t1)/Math.max(0.6,thr-t1+0.6)))*9});
  }
};
</script></body></html>
