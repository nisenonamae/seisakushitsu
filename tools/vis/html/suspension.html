<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="lib.js"></script>
<script>
/* サスペンション：横から見た車を透かして、車輪と車体の間にあるばねを見せる。でこぼこを越えると、ばねが縮み、車体が上下に弾む。最後に「ぽよよん」。文字なし */
window.DEF={};
function coil(x,y0,y1,w,n=8){g.strokeStyle='#f3f4f6';g.lineWidth=6;g.beginPath();g.moveTo(x,y0);for(let i=1;i<=n;i++){const y=y0+(y1-y0)*i/n;g.lineTo(x+(i%2?w:-w),y-(y1-y0)/n/2)}g.lineTo(x,y1);g.stroke()}
window.render=function(t){sky();hills(t*80);
  const gx=t*170;const bumpX=1000-gx;const top=x=>560-40*Math.exp(-Math.pow((x-bumpX)/60,2));ground(top);
  const s=1.5,cx=600;const fx=cx+112*s,rx=cx-110*s,wr=34*s;
  const fy=top(fx)-wr,ry=top(rx)-wr;   // 車輪はでこぼこに沿って上下する
  const tB=(1000-fx)/170,d=t-tB;const bounce=d>0?-26*Math.exp(-d*1.4)*Math.cos(d*8):0;const bodyY=560-wr+bounce;
  if(Math.abs(d)<0.02)sfxOnce('b',t,'thump');
  // 車体（透ける）
  car(cx,bodyY,s,{noWheels:true,alpha:0.35,heads:0,t});
  // ばね：車輪の軸から、車体の床まで
  tire(fx,fy,wr,t*5);tire(rx,ry,wr,t*5);
  // ばね：車輪の軸から、上の車体まで（車輪の上に重ねて見せる）
  const topY=bodyY-95;for(const [x,y] of [[fx,fy],[rx,ry]]){g.strokeStyle='#6b7280';g.lineWidth=8;g.beginPath();g.moveTo(x,y);g.lineTo(x,topY);g.stroke();coil(x,topY+6,y-wr*0.45,15,9);g.fillStyle='#4b5563';g.fillRect(x-22,topY-6,44,10)}
  if(d>1.2)sfxOnce('bo',tB+1.2,'boing');
};
</script></body></html>
